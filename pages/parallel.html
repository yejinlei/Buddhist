    <link rel="stylesheet" href="../css/custom.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/tailwind-fixes.css">
    <style>
        body { font-family: -apple-system, "Noto Serif SC", "Songti SC", serif; background-color: #F5F0E1; color: #2C1810; }
        .nav-active { background-color: rgba(184,134,11,0.2); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d4c8b0; border-radius: 3px; }
        .group-item.active { background-color: rgba(139,69,19,.1); border-left: 3px solid #8B4513; }
        .seg-badge { display:inline-block; font-size:10px; padding:1px 6px; border-radius:3px; background:#16a34a; color:#fff; margin-left:6px; vertical-align:middle; }
        .seg-badge.chap { background:#d97706; }
        .seg-badge.raw { background:#9ca3af; }
        .col-body { line-height: 2; font-size: .95rem; text-indent: 2em; }
        .col-body .chap { font-weight: bold; color: #8B4513; text-indent: 0; margin: 1rem 0 .5rem; font-size: 1.02rem; border-bottom: 1px solid #e5d9c3; padding-bottom: .3rem; }
        .col-wrap { max-height: 76vh; overflow-y: auto; }
        /* 段级/章级对齐 */
        .seg-row { display: grid; gap: 8px; border-bottom: 1px dashed #e5d9c3; padding: 10px 0; scroll-margin-top: 80px; }
        .seg-row.highlight { background: rgba(234,179,8,.22); box-shadow: inset 3px 0 0 #b8860b; }
        .seg-cell { padding: 6px 10px; border-radius: 6px; cursor: pointer; line-height: 2; font-size: .95rem; text-indent: 2em; transition: background .15s; }
        .seg-cell:hover { background: rgba(184,134,11,.08); }
        .seg-cell.empty { color: #9ca3af; font-size: .85rem; font-style: italic; text-indent: 0; cursor: default; }
        .seg-num { display:inline-block; width:34px; text-align:right; color:#8B4513; font-size:.75rem; opacity:.6; margin-right:6px; font-style: normal; text-indent: 0; }
        .seg-chapter { font-weight: bold; color: #8B4513; text-indent: 0; padding: 10px 10px 6px; margin: 0; border-bottom: 2px solid #d97706; background: rgba(217,119,6,.05); }
        .mode-switch { display:inline-flex; border:1px solid #d4c8b0; border-radius:6px; overflow:hidden; margin-left:.5rem; }
        .mode-switch button { padding:4px 10px; border:0; background:#fff; font-size:12px; cursor:pointer; color:#3E2723; }
        .mode-switch button.active { background:#8B4513; color:#fff; }
        .diff-add { background: rgba(34,197,94,.18); }
        .diff-del { background: rgba(239,68,68,.18); text-decoration: line-through; opacity: .6; }
        @media (max-width: 768px) {
            .seg-row { display: flex; flex-direction: column; gap: 6px; }
            .seg-cell { font-size: .92rem; }
            .col-wrap { max-height: none; }
        }
    </style>
</head>

    <div class="max-w-[1500px] mx-auto px-4 py-6 flex gap-5">
        <div class="w-72 flex-shrink-0">
            <div class="bg-white rounded-xl shadow-md p-4 sticky top-24 max-h-[calc(100vh-120px)] flex flex-col">
                <h2 class="text-lg font-bold text-ink mb-1 flex items-center gap-2"><span class="text-primary">📚</span>同经异译</h2>
                <p class="text-xs text-ink/50 mb-3">共 <span id="grp-count" class="text-primary font-bold">—</span> 组佛经原典，其中 <span class="text-green-700 font-bold" id="seg-count">0</span> 段级对齐、<span class="text-amber-600 font-bold" id="chap-count">0</span> 章级对齐</p>
                <input id="grp-search" type="text" placeholder="搜索经名..." class="w-full border border-primary/20 rounded-lg px-3 py-2 mb-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
                <div class="flex gap-1 mb-3 text-xs">
                    <button data-flt="all" class="flt-btn px-2 py-1 rounded bg-primary/10 text-ink">全部</button>
                    <button data-flt="seg" class="flt-btn px-2 py-1 rounded text-ink/60 hover:bg-primary/5">段级</button>
                    <button data-flt="chap" class="flt-btn px-2 py-1 rounded text-ink/60 hover:bg-primary/5">章级</button>
                </div>
                <div id="grp-list" class="flex-1 overflow-y-auto text-sm space-y-1">
                    <div class="text-center text-ink/50 py-8">加载中...</div>
                </div>
            </div>
        </div>

        <div class="flex-1 min-w-0">
            <div id="stage" class="bg-white rounded-xl shadow-md p-6 min-h-[70vh]">
                <div class="text-center py-24">
                    <div class="text-6xl mb-4 opacity-30">🔀</div>
                    <h1 class="text-2xl font-bold text-ink mb-3">异译本逐部对照</h1>
                    <p class="text-ink/70 mb-1">从左侧选择一组同经异译，即可并排对读不同译师的译本。</p>
                    <p class="text-sm text-ink/50"><span class="text-green-700 font-bold">绿色段级</span>：段落级对齐，点击段落联动高亮；<span class="text-amber-600 font-bold">橙色章级</span>：长经按章节对齐。</p>
                    <p class="text-sm text-ink/50 mt-1">推荐：《心经》4 译本、《金刚经》4 译本、《阿弥陀经》2 译本、《大乘起信论》2 译本。</p>
                    <p class="text-xs text-ink/40 italic mt-2">注：经疏、义记、目录、仪轨、礼忏、祈愿文等非原典类异本已自动过滤。</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let GROUPS = [];               // 所有异译组（原典）
        const SEG_MANIFEST = {};       // {group_id: manifest entry}
        const cache = {};              // 经文 JSON 缓存
        const segCache = {};           // 对齐数据缓存
        let currentFilter = 'all';
        let currentGroup = null;
        let currentMode = null;        // 'segment' | 'chapter' | 'raw'

        function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

        // 把一组对齐manifest与异译组匹配（按经id集合相等/包含）
        function matchSeg(g) {
            const ids = new Set((g.sutras||[]).map(s => s.id));
            // 优先完全匹配
            for (const [key, m] of Object.entries(SEG_MANIFEST)) {
                const mids = new Set(m.versions.map(v=>v.id));
                // 组内含全部对齐版本
                let allIn = true;
                for (const vid of mids) if (!ids.has(vid)) { allIn=false; break; }
                if (allIn && mids.size >= 2) return { key: m.file || m.group_id, m };
            }
            return null;
        }

        async function load() {
            try {
                const mr = await fetch('../data/segment_alignments/manifest.json?v=3');
                const ml = await mr.json();
                (ml||[]).forEach(m => { SEG_MANIFEST[m.group_id] = m; });
            } catch(e) { console.warn('段对齐清单加载失败', e); }

            const res = await fetch('../ontology/parallel_translations.json?' + Date.now());
            let d = await res.json();
            if (d && d.groups) d = d.groups;
            // 过滤非原典
            const NON = /(疏$|義記$|义记$|目錄$|目录$|禮懺文|礼忏文|儀軌$|仪轨$|祈願|祈愿|戒本疏|律抄$|經疏$|论疏$|註$|注$|鈔$|抄$|讚$|赞$|懺法|礼赞|文句$|文記$|文记$|義$|义$|宗義$|義章$|義鈔$|發隱$|疏鈔$|疏抄$|玄義$|玄赞$|演義$|義镜$|義鏡$|述記$|述记$|義絕$|索隱$|问答$|問答$|寶藏論$)/;
            GROUPS = (d || []).filter(g => g && g.sutras && g.sutras.length >= 2 && !NON.test(g.title || ''))
                .map(g => {
                    const m = matchSeg(g);
                    return { ...g, _segKey: m ? m.key : null, _segMode: m ? m.m.mode : null, _segN: m ? m.m.n_alignments : 0, _nVer: m ? m.m.n_versions : g.sutras.length };
                })
                .sort((a,b) => {
                    // 段级优先，其次章级，最后按译本数、名称
                    const rankA = a._segMode==='segment'?2 : a._segMode==='chapter'?1 : 0;
                    const rankB = b._segMode==='segment'?2 : b._segMode==='chapter'?1 : 0;
                    if(rankB!==rankA) return rankB-rankA;
                    return (a.title||'').localeCompare(b.title||'');
                });
            const segN = GROUPS.filter(g=>g._segMode==='segment').length;
            const chapN = GROUPS.filter(g=>g._segMode==='chapter').length;
            document.getElementById('grp-count').textContent = GROUPS.length;
            document.getElementById('seg-count').textContent = segN;
            document.getElementById('chap-count').textContent = chapN;
            renderList();
            // URL hash?=#idx 自动打开
            if (GROUPS.length) {
                let idx = 0;
                const m = location.hash.match(/g=(\d+)/);
                if (m) idx = Math.min(+m[1], GROUPS.length-1);
                openGroup(idx);
            }
        }

        function renderList() {
            const kw = (document.getElementById('grp-search').value || '').trim();
            let list = GROUPS;
            if (currentFilter === 'seg') list = list.filter(g => g._segMode==='segment');
            else if (currentFilter === 'chap') list = list.filter(g => g._segMode==='chapter');
            if (kw) list = list.filter(g => (g.title||'').includes(kw) || g.sutras.some(s => (s.title||'').includes(kw) || (s.translator||'').includes(kw)));
            document.getElementById('grp-list').innerHTML = list.map(g => {
                const gi = GROUPS.indexOf(g);
                let badge;
                if (g._segMode==='segment') badge = `<span class="seg-badge">段级·${g._segN}段</span>`;
                else if (g._segMode==='chapter') badge = `<span class="seg-badge chap">章级·${g._segN}章</span>`;
                else badge = `<span class="seg-badge raw">整篇</span>`;
                return `<div class="group-item cursor-pointer rounded px-3 py-2 hover:bg-primary/5" data-idx="${gi}">
                    <div class="font-medium text-ink truncate">${g.title}${badge}</div>
                    <div class="text-xs text-ink/50">${g._nVer||g.sutras.length} 译本${g._segMode?' · 点击联动高亮':''}</div>
                </div>`;
            }).join('') || `<div class="text-center text-ink/50 py-6">无匹配</div>`;
            document.querySelectorAll('.group-item').forEach(el => el.onclick = () => openGroup(+el.dataset.idx));
        }

        function getParasByIndex(data) {
            // 按换行切分段落（与build_all_alignments一致），返回文本数组
            const arr = [];
            if (data && data.content) {
                data.content.forEach(c => {
                    const t = (c.text||'').replace(/\r/g,'');
                    t.split(/\n+/).map(x=>x.trim()).filter(x=>x.length>=2).forEach(p => arr.push(p));
                });
            } else if (data && data.chapters) {
                data.chapters.forEach(c => (c.paragraphs||[]).forEach(p => arr.push(p)));
            }
            return arr;
        }

        function getChapters(data) {
            // 返回章节数组，包含章节名+章节段落（换行拆分）
            const out = [];
            if (data && data.content) {
                data.content.forEach(c => {
                    const paras = (c.text||'').replace(/\r/g,'').split(/\n+/).map(x=>x.trim()).filter(x=>x.length>=2);
                    out.push({ title: c.chapter || c.title || '', paras });
                });
            }
            return out;
        }

        async function openGroup(idx) {
            document.querySelectorAll('.group-item').forEach(el => el.classList.toggle('active', +el.dataset.idx === idx));
            const g = GROUPS[idx];
            currentGroup = g;
            location.hash = `g=${idx}`;
            const stage = document.getElementById('stage');
            stage.innerHTML = `<div class="text-center py-16 text-ink/50">正在加载各译本正文…</div>`;

            const cols = await Promise.all(g.sutras.map(async s => {
                let data = cache[s.id];
                if (!data) {
                    try {
                        const r = await fetch(`../sutras/${s.id}.json?v=3`);
                        data = await r.json();
                    } catch(e) { data = null; }
                    cache[s.id] = data;
                }
                return { meta: s, data };
            }));

            // 选择模式：有段级用段级，有章级用章级，否则整篇
            if (g._segKey) {
                let seg = segCache[g._segKey];
                if (!seg) {
                    try {
                        const r = await fetch(`../data/segment_alignments/${g._segKey}${g._segKey.endsWith('.json')?'':'.json'}?v=3`);
                        seg = await r.json();
                        segCache[g._segKey] = seg;
                    } catch(e) { seg = null; }
                }
                if (seg && seg.mode === 'segment') { currentMode='segment'; return renderSegmentView(g, cols, seg); }
                if (seg && seg.mode === 'chapter') { currentMode='chapter'; return renderChapterView(g, cols, seg); }
            }
            currentMode='raw';
            renderRawView(g, cols);
        }

        function renderRawView(g, cols) {
            const stage = document.getElementById('stage');
            const n = Math.min(cols.length, 4);
            const head = `<div class="mb-5">
                <h1 class="text-2xl font-bold text-ink mb-1">${g.title}<span class="seg-badge raw">整篇并排</span></h1>
                <p class="text-sm text-ink/60">${cols.length} 个汉译本并排对读 · 此组未做自动对齐，按原文顺序并列呈现</p>
            </div>`;
            const grid = `<div class="grid gap-4" style="grid-template-columns: repeat(${n}, minmax(0,1fr))">` +
                cols.map(c => {
                    const m = c.meta, d = c.data;
                    const chaps = getChapters(d);
                    let charCount = 0;
                    chaps.forEach(ch => ch.paras.forEach(p => charCount += p.length));
                    if (!charCount) charCount = m.actual_char_count || m.official_char_count || 0;
                    const body = chaps.length
                        ? chaps.map(ch => `<div class="chap">${esc(ch.title||'')}</div>` + ch.paras.map(p=>`<div class="col-body">${esc(p)}</div>`).join('')).join('')
                        : `<div class="text-ink/40 text-center py-10">该译本正文暂未收录</div>`;
                    return `<div class="border border-paper rounded-lg overflow-hidden flex flex-col">
                        <div class="bg-primary/5 px-3 py-2 border-b border-paper">
                            <div class="font-bold text-ink text-sm">${m.translator||'失译'}</div>
                            <div class="text-xs text-ink/50 mt-0.5">${m.vol||''} · ${charCount.toLocaleString()}字</div>
                        </div>
                        <div class="col-wrap px-3 py-3">${body}</div>
                    </div>`;
                }).join('') + `</div>`;
            stage.innerHTML = head + grid;
        }

        function renderSegmentView(g, cols, seg) {
            const stage = document.getElementById('stage');
            const orderedIds = seg.versions.map(v => v.id);
            const colMap = {};
            cols.forEach(c => colMap[c.meta.id] = c);
            const paraArrs = {};
            orderedIds.forEach(id => {
                const d = colMap[id] && colMap[id].data;
                paraArrs[id] = d ? getParasByIndex(d) : [];
            });

            const totalSeg = seg.alignments.length;
            const multiSeg = seg.alignments.filter(a => Object.keys(a.refs||{}).length > 1).length;
            const nCols = orderedIds.length;

            const head = `<div class="mb-5">
                <h1 class="text-2xl font-bold text-ink mb-1">${seg.group_title || g.title}<span class="seg-badge">段级对齐</span></h1>
                <p class="text-sm text-ink/60 mb-2">
                    ${nCols} 个汉译本 · ${totalSeg} 组对齐段落 · 多译对齐率 ${Math.round(multiSeg/totalSeg*100)}%
                </p>
                <div class="flex flex-wrap gap-2 text-xs mb-1 items-center">
                    ${seg.versions.map(v => `<span class="px-2 py-1 rounded bg-primary/10 text-ink"><strong>${v.translator||'失译'}</strong> · ${v.n_paras}段</span>`).join('')}
                </div>
                <p class="text-xs text-ink/40 italic">※ 段对齐基于共现关键词+位置顺序自动生成，存在局部错配；点击任意段可高亮整组对应段。</p>
            </div>`;

            // 关键词跳转
            const kws = [];
            for (const a of seg.alignments) {
                if (a.keyword && a.keyword.length >= 2 && a.keyword.length <= 20 && !/^(一時|如是|何以|佛言|爾時|須菩提|舍利弗)$/.test(a.keyword)) {
                    if (!kws.find(x=>x.kw===a.keyword)) kws.push({kw:a.keyword, id:a.id});
                }
                if (kws.length >= 16) break;
            }
            const kwHtml = kws.length ? `<div class="mb-4 flex flex-wrap gap-1.5">${kws.map(k=>`<button class="kw-jump px-2 py-1 rounded text-xs border border-primary/20 hover:bg-primary/10 text-ink/70" data-to="${k.id}">${k.kw}</button>`).join('')}</div>` : '';

            const colHeads = `<div class="seg-row font-bold text-ink border-b-2 border-primary/20 pb-2" style="grid-template-columns: 40px repeat(${nCols}, minmax(0,1fr));">
                <div class="text-ink/40 text-center text-xs">#</div>
                ${orderedIds.map(id => {
                    const c = colMap[id], m = c ? c.meta : {}, v = seg.versions.find(x=>x.id===id);
                    return `<div class="text-sm">
                        <div class="font-bold text-ink">${m.translator||v.translator||'失译'}</div>
                        <div class="text-xs text-ink/50">${v?`${v.n_paras}段`:''}</div>
                    </div>`;
                }).join('')}
            </div>`;

            const rows = seg.alignments.map(a => {
                const cells = orderedIds.map(id => {
                    const pis = (a.refs||{})[id];
                    if (!pis || !pis.length) return `<div class="seg-cell empty">— 无对应 —</div>`;
                    const text = pis.map(pi => esc(paraArrs[id][pi]||'').replace(/\n/g,'<br>')).join('<br>');
                    return `<div class="seg-cell" data-sid="${id}" data-seg="${a.id}">${text}</div>`;
                }).join('');
                return `<div class="seg-row" data-row="${a.id}" style="grid-template-columns: 40px repeat(${nCols}, minmax(0,1fr));">
                    <div class="flex items-start justify-end pr-1 pt-1"><span class="seg-num">§${a.id}</span></div>
                    ${cells}
                </div>`;
            }).join('');

            stage.innerHTML = head + kwHtml + colHeads + `<div id="seg-body">${rows}</div>`;

            const body = document.getElementById('seg-body');
            body.addEventListener('click', e => {
                const cell = e.target.closest('.seg-cell');
                if (!cell || cell.classList.contains('empty')) return;
                const row = cell.closest('.seg-row');
                body.querySelectorAll('.seg-row.highlight').forEach(el => el.classList.remove('highlight'));
                if (row) {
                    row.classList.add('highlight');
                    row.scrollIntoView({behavior:'smooth', block:'center'});
                }
            });
            document.querySelectorAll('.kw-jump').forEach(btn => {
                btn.onclick = () => {
                    const to = document.querySelector(`.seg-row[data-row="${btn.dataset.to}"]`);
                    if (to) {
                        body.querySelectorAll('.seg-row.highlight').forEach(el => el.classList.remove('highlight'));
                        to.classList.add('highlight');
                        to.scrollIntoView({behavior:'smooth', block:'center'});
                    }
                };
            });
        }

        function renderChapterView(g, cols, seg) {
            const stage = document.getElementById('stage');
            const orderedIds = seg.versions.map(v => v.id);
            const colMap = {};
            cols.forEach(c => colMap[c.meta.id] = c);
            // 每部经预取章节列表
            const chapArrs = {};
            orderedIds.forEach(id => { chapArrs[id] = colMap[id] && colMap[id].data ? getChapters(colMap[id].data) : []; });
            const nCols = orderedIds.length;

            const head = `<div class="mb-5">
                <h1 class="text-2xl font-bold text-ink mb-1">${seg.group_title || g.title}<span class="seg-badge chap">章级对齐</span></h1>
                <p class="text-sm text-ink/60 mb-2">${nCols} 个汉译本 · ${seg.alignments.length} 组章节对齐 · 点击章节名跳转对应译本位置</p>
                <p class="text-xs text-ink/40 italic">※ 长经采用章节级对齐（按位置等分），适合卷帙较大的大部经典对读。</p>
            </div>`;

            const colHeads = `<div class="seg-row font-bold text-ink border-b-2 border-amber-600/40 pb-2" style="grid-template-columns: 40px repeat(${nCols}, minmax(0,1fr));">
                <div class="text-ink/40 text-center text-xs">#</div>
                ${orderedIds.map(id => {
                    const v = seg.versions.find(x=>x.id===id);
                    return `<div class="text-sm"><div class="font-bold text-ink">${v?v.translator:id}</div></div>`;
                }).join('')}
            </div>`;

            const rows = seg.alignments.map(a => {
                const cells = orderedIds.map(id => {
                    const ref = (a.refs||{})[id];
                    if (!ref || (Array.isArray(ref) && ref.length===0)) return `<div class="seg-cell empty">— 无对应 —</div>`;
                    // 新格式：ref 是数组，每项 {title, para_count, preview}
                    if (Array.isArray(ref) && ref.length>0 && typeof ref[0] === 'object' && ref[0].title) {
                        const r = ref[0];
                        return `<div class="seg-cell chap-cell" data-sid="${id}" data-idx="${a.id-1}" title="点击查看该节内容">
                            <div class="seg-chapter" style="background:transparent;padding:0;border:0;">📖 ${esc(r.title)}</div>
                            <div class="text-xs text-ink/50 mt-1">${r.para_count||'—'}段</div>
                            <div class="text-xs text-ink/40 mt-1 italic">${esc((r.preview||'').slice(0,40))}${(r.preview||'').length>40?'…':''}</div>
                        </div>`;
                    }
                    // 段级旧格式：ref 是数字数组（段落索引）
                    if (Array.isArray(ref) && ref.every(x=>typeof x==='number')) {
                        // 段级不在这里渲染，应走 renderSegmentView
                        return `<div class="seg-cell empty">— 段级数据 —</div>`;
                    }
                    return `<div class="seg-cell empty">— 无对应 —</div>`;
                }).join('');
                return `<div class="seg-row" data-row="${a.id}" style="grid-template-columns: 40px repeat(${nCols}, minmax(0,1fr));">
                    <div class="flex items-start justify-end pr-1 pt-1"><span class="seg-num">§${a.id}</span></div>
                    ${cells}
                </div>`;
            }).join('');

            stage.innerHTML = head + colHeads + `<div id="seg-body">${rows}</div>`;

            const body = document.getElementById('seg-body');
            body.addEventListener('click', e => {
                const cell = e.target.closest('.seg-cell');
                if (!cell || cell.classList.contains('empty')) return;
                const sid = cell.dataset.sid;
                if (sid) {
                    // 打开对应经在读经页
                    window.open(`sutras.html?load=${sid}`, '_blank');
                }
            });
        }

        document.getElementById('grp-search').addEventListener('input', renderList);
        document.querySelectorAll('.flt-btn').forEach(b => b.onclick = () => {
            currentFilter = b.dataset.flt;
            document.querySelectorAll('.flt-btn').forEach(x => {
                x.classList.remove('bg-primary/10','text-ink');
                x.classList.add('text-ink/60','hover:bg-primary/5');
            });
            b.classList.add('bg-primary/10','text-ink');
            b.classList.remove('text-ink/60','hover:bg-primary/5');
            renderList();
        });
        load();
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
