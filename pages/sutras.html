<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全藏原典 · 佛学本体论</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{buddha:{primary:'#8B5A2B',secondary:'#D4AF37',dark:'#3A2E1F',light:'#F5F0E6',paper:'#F8F4E9'}}}}}
</script>
<style>
body{font-family:"Noto Serif SC","Source Han Serif SC",serif;background:#F8F4E9;}
.sutra-text p{text-indent:2em;line-height:2;margin:0.8em 0;font-size:17px;}
.vol-tag{display:inline-block;padding:2px 8px;border-radius:4px;background:#8B5A2B;color:white;font-size:12px;margin-right:6px;}
.scroll-thin::-webkit-scrollbar{width:6px;height:6px;}
.scroll-thin::-webkit-scrollbar-thumb{background:rgba(139,90,43,.3);border-radius:3px;}
</style>
</head>
<body class="text-buddha-dark">

<!-- 导航 -->
<header class="sticky top-0 z-50 bg-buddha-dark/95 backdrop-blur-sm border-b border-buddha-primary/20 text-white shadow-md">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa fa-leaf text-buddha-secondary text-xl"></i>
      <a href="index.html" class="font-serif font-bold text-lg">佛学本体论</a>
      <span class="mx-2 text-white/30">|</span>
      <span class="text-white/70">全藏原典</span>
    </div>
    <nav class="flex gap-4 text-sm">
      <a href="index.html" class="hover:text-buddha-secondary">首页</a>
      <a href="ontology.html" class="hover:text-buddha-secondary">本体体系</a>
      <a href="graph.html" class="hover:text-buddha-secondary">义理图谱</a>
      <a href="timeline.html" class="hover:text-buddha-secondary">译传时间轴</a>
      <a href="compare.html" class="hover:text-buddha-secondary">判教对比</a>
    </nav>
  </div>
</header>

<div class="container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
  <!-- 左侧经目 -->
  <aside class="lg:col-span-1">
    <div class="bg-white rounded-lg shadow p-4 sticky top-20 max-h-[calc(100vh-100px)] overflow-auto scroll-thin">
      <h3 class="font-bold text-buddha-primary mb-3 flex items-center gap-2">
        <i class="fa fa-book"></i>
        <span>大正藏经目</span>
        <span id="totalBadge" class="ml-auto text-xs bg-buddha-primary/10 text-buddha-primary px-2 py-0.5 rounded"></span>
      </h3>
      
      <div class="mb-3">
        <input id="searchInput" type="text" placeholder="搜索经名/译者/经号..."
               class="w-full px-3 py-2 border border-buddha-primary/20 rounded text-sm focus:outline-none focus:border-buddha-primary">
      </div>
      
      <div class="mb-3 flex flex-wrap gap-1 text-xs">
        <button class="vol-filter px-2 py-1 rounded border border-buddha-primary/30 hover:bg-buddha-primary/10 active" data-vol="">全部</button>
      </div>
      
      <div id="sutraList" class="space-y-1 text-sm"></div>
    </div>
  </aside>
  
  <!-- 右侧正文 -->
  <main class="lg:col-span-3">
    <div id="welcome" class="bg-white rounded-lg shadow p-8 text-center">
      <i class="fa fa-book text-buddha-primary text-5xl mb-4 opacity-30"></i>
      <h2 class="text-2xl font-serif font-bold mb-3">CBETA大正藏全文在线阅读</h2>
      <p class="text-buddha-dark/60 max-w-lg mx-auto mb-4">
        从左侧选择一部经典开始阅读。当前已收录
        <span class="text-buddha-primary font-bold" id="welcomeCount">加载中</span>部
        共<span class="text-buddha-primary font-bold" id="welcomeChars">加载中</span>，
        数据来自 <a href="https://www.cbeta.org/" target="_blank" class="text-blue-600 underline">CBETA</a>，持续扩充中。
      </p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-3 max-w-2xl mx-auto mt-6 text-sm">
        <div class="p-3 bg-buddha-paper rounded">
          <div class="font-bold text-buddha-primary">T01-T02</div>
          <div class="text-xs text-buddha-dark/60">阿含部</div>
        </div>
        <div class="p-3 bg-buddha-paper rounded">
          <div class="font-bold text-buddha-primary">T05-T08</div>
          <div class="text-xs text-buddha-dark/60">般若部</div>
        </div>
        <div class="p-3 bg-buddha-paper rounded">
          <div class="font-bold text-buddha-primary">T09-T10</div>
          <div class="text-xs text-buddha-dark/60">法华·华严</div>
        </div>
        <div class="p-3 bg-buddha-paper rounded">
          <div class="font-bold text-buddha-primary">T12-T14</div>
          <div class="text-xs text-buddha-dark/60">宝积·涅槃·大集</div>
        </div>
      </div>
    </div>
    
    <article id="sutraView" class="hidden bg-white rounded-lg shadow">
      <header class="p-6 border-b border-buddha-primary/10">
        <div class="flex items-center gap-2 text-xs text-buddha-dark/50 mb-2">
          <span id="sVol" class="vol-tag"></span>
          <span id="sId"></span>
          <span>·</span>
          <span id="sJuan"></span>
          <span>·</span>
          <span id="sChars"></span>
        </div>
        <h1 id="sTitle" class="text-2xl md:text-3xl font-serif font-bold mb-2"></h1>
        <div id="sTrans" class="text-buddha-dark/60"></div>
      </header>
      <div id="sContent" class="p-6 sutra-text"></div>
    </article>
  </main>
</div>

<script>
let INDEX=null;
let CUR_SUTRA=null;
const VOL_NAMES={T01:'阿含部上',T02:'阿含部下',T03:'本缘部上',T04:'本缘部下',T05:'般若一',T06:'般若二',T07:'般若三',T08:'般若四',T09:'法华部',T10:'华严上',T11:'华严下',T12:'宝积部',T13:'涅槃部',T14:'大集部',T15:'经集一',T16:'经集二',T17:'经集三',T18:'经集四',T19:'密教一',T20:'密教二',T21:'密教三',T22:'律一',T23:'律二',T24:'律三',T25:'律四',T26:'释经论',T27:'毗昙二',T28:'毗昙三',T29:'中观瑜伽上',T30:'瑜伽下',T31:'论集一',T32:'论集二',T33:'经疏一',T34:'经疏二',T35:'经疏三',T36:'经疏四',T37:'经疏五',T38:'经疏六',T39:'律疏',T40:'论疏一',T41:'论疏二',T42:'论疏三',T43:'论疏四',T44:'诸宗一',T45:'诸宗二',T46:'诸宗三',T47:'诸宗四',T48:'诸宗五',T49:'史传一',T50:'史传二',T51:'史传三',T52:'史传四',T53:'事汇',T54:'外教',T55:'目录',T85:'古逸'};

async function loadIndex(){
  const r=await fetch('../sutras/index.json');
  INDEX=await r.json();
  document.getElementById('totalBadge').textContent=INDEX.total+'部';
  document.getElementById('welcomeCount').textContent=INDEX.total;
  document.getElementById('welcomeChars').textContent=Math.round(INDEX.chars/10000)+'万字';
  renderFilters();
  renderList('');
}

function renderFilters(){
  const vols={};
  INDEX.sutras.forEach(s=>{vols[s.vol]=(vols[s.vol]||0)+1});
  const wrap=document.querySelector('.vol-filter').parentElement;
  // 保留"全部"按钮
  wrap.querySelectorAll('.vol-filter:not(.active)').forEach(b=>b.remove());
  Object.keys(vols).sort().forEach(v=>{
    const b=document.createElement('button');
    b.className='vol-filter px-2 py-1 rounded border border-buddha-primary/30 hover:bg-buddha-primary/10';
    b.dataset.vol=v;
    b.textContent=`${v.slice(1)}·${VOL_NAMES[v]||v}(${vols[v]})`;
    b.onclick=()=>{
      wrap.querySelectorAll('.vol-filter').forEach(x=>x.classList.remove('active','bg-buddha-primary','text-white'));
      b.classList.add('active','bg-buddha-primary','text-white');
      renderList(v);
    };
    wrap.appendChild(b);
  });
  document.querySelector('.vol-filter.active').onclick=()=>{
    wrap.querySelectorAll('.vol-filter').forEach(x=>x.classList.remove('active','bg-buddha-primary','text-white'));
    document.querySelector('.vol-filter[data-vol=""]').classList.add('active','bg-buddha-primary','text-white');
    renderList('');
  };
}

function renderList(vol){
  const kw=document.getElementById('searchInput').value.trim().toLowerCase();
  const list=document.getElementById('sutraList');
  list.innerHTML='';
  const arr=INDEX.sutras.filter(s=>{
    if(vol && s.vol!==vol) return false;
    if(kw && !(s.title||'').toLowerCase().includes(kw) &&
        !(s.translator||'').toLowerCase().includes(kw) &&
        !(s.taisho||'').toLowerCase().includes(kw)) return false;
    return true;
  });
  // 按册分组
  const groups={};
  arr.forEach(s=>{
    groups[s.vol]=groups[s.vol]||[];
    groups[s.vol].push(s);
  });
  Object.keys(groups).sort().forEach(v=>{
    const h=document.createElement('div');
    h.className='text-xs text-buddha-dark/50 mt-3 mb-1 font-bold';
    h.textContent=`${v} ${VOL_NAMES[v]||''} (${groups[v].length})`;
    list.appendChild(h);
    groups[v].forEach(s=>{
      const a=document.createElement('a');
      a.href='#';a.dataset.id=s.id;
      a.className='block px-2 py-1.5 rounded hover:bg-buddha-primary/10 cursor-pointer truncate';
      a.title=`${s.title} / ${s.translator||''}`;
      a.innerHTML=`<span class="text-buddha-dark/40 text-xs mr-1">${s.taisho.slice(1).replace(/^0+/,'')}</span>${s.title}`;
      a.onclick=(e)=>{e.preventDefault();openSutra(s.id);};
      list.appendChild(a);
    });
  });
}

async function openSutra(id){
  document.querySelectorAll('#sutraList a').forEach(a=>{
    a.classList.remove('bg-buddha-primary/20','text-buddha-primary','font-bold');
    if(a.dataset.id===id) a.classList.add('bg-buddha-primary/20','text-buddha-primary','font-bold');
  });
  const r=await fetch(`../sutras/${id}.json`);
  const d=await r.json();
  CUR_SUTRA=d;
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('sutraView').classList.remove('hidden');
  document.getElementById('sVol').textContent=d.vol;
  document.getElementById('sId').textContent=d.taisho;
  document.getElementById('sJuan').textContent=`${d.juan}卷`;
  document.getElementById('sChars').textContent=`${Math.round(d.chars/10000*10)/10}万字`;
  document.getElementById('sTitle').textContent=d.title||d.taisho;
  document.getElementById('sTrans').textContent=d.translator||'译者失考';
  const c=document.getElementById('sContent');
  c.innerHTML='';
  d.content.forEach(ch=>{
    if(ch.chapter && ch.chapter!=='正文'){
      const h=document.createElement('h3');
      h.className='text-lg font-bold text-buddha-primary mt-6 mb-3 pb-2 border-b border-buddha-primary/20';
      h.textContent=ch.chapter;
      c.appendChild(h);
    }
    const p=document.createElement('p');
    p.textContent=ch.text;
    c.appendChild(p);
  });
  window.scrollTo(0,0);
}

document.getElementById('searchInput').addEventListener('input',()=>{
  const act=document.querySelector('.vol-filter.active');
  renderList(act?act.dataset.vol:'');
});

loadIndex();
</script>
</body>
</html>
