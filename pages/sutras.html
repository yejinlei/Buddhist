<script>
let allSutras = [];
let currentSutra = null;
let loadedChapters = 0;
let NOTES = {};   // 学者注解：sutra_id -> {anchors:[...]}
let KEPAN = null; // 科判数据
let H2S = {};     // 繁->简单字映射
let DICT_TERMS = null;
let DICT_MAP = new Map();
let DICT_AUTO_SET = new Set(); // 自动划线用的词条（不含人物/地名/太通用词）
let DICT_MAX_LEN = 8;
let CROSS = null; // 跨页关联数据，懒加载
const CHAPTERS_PER_PAGE = 10; // 每次加载10章（大约几卷）

// ===== 学术工具：收藏/笔记/引用/书签 =====
const LS_FAV = 'buddhist_favs';
const LS_NOTE = 'buddhist_notes';
const LS_BM = 'buddhist_bookmarks';
function LS_get(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){return [];} }
function LS_set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let favs = LS_get(LS_FAV);
let notes = LS_get(LS_NOTE);
let bookmarks = LS_get(LS_BM);
let curSBtab = 'fav';

// ===== 跨页关联 =====
let CROSS_LOADED = false;
async function ensureCrossLoaded(){
  if(!CROSS){
    try{
      const r = await fetch('../data/cross-links.json');
      CROSS = await r.json();
      // 按sutra_id建立科判索引方便查找
      if(CROSS.kepan_to_sutra){
        CROSS._kepanBySutra = {};
        Object.values(CROSS.kepan_to_sutra).forEach(k=>{
          if(!CROSS._kepanBySutra[k.sutra_id]) CROSS._kepanBySutra[k.sutra_id] = [];
          CROSS._kepanBySutra[k.sutra_id].push(k);
        });
      }
      CROSS_LOADED = true;
    }catch(e){
      console.warn('跨页关联加载失败', e);
      CROSS = {};
      CROSS_LOADED = true;
    }
  }
  return CROSS;
}

// 异译本提示条
function updateParallelBar(){
  const bar = document.getElementById('parallel-bar');
  if(!bar || !currentSutra || !CROSS) return;
  const parallels = (CROSS.sutra_to_parallel && CROSS.sutra_to_parallel[currentSutra.id]) || [];
  if(!parallels.length){ bar.innerHTML = ''; return; }
  const g = parallels[0]; // 通常一部经只在一个异译组
  bar.innerHTML = `<div class="mt-3 p-3 bg-amber-100/70 border border-amber-300 rounded-lg flex items-center flex-wrap gap-2 text-sm">
    <i class="fa fa-exchange text-amber-700"></i>
    <span class="text-amber-900"><b>${g.group_name}</b> 共有 <b>${parallels.length}</b> 个译本：</span>
    ${parallels.map(p=>{
      const isSelf = p.translator === currentSutra.translator;
      return `<span class="text-amber-800 ${isSelf?'font-bold':''}">${p.translator||''}${isSelf?'（当前）':''}</span>`;
    }).join(' · ')}
    <a href="parallel.html?grp=${encodeURIComponent(g.group_name)}" target="_blank" class="ml-2 text-amber-700 hover:underline">打开段级对照 →</a>
  </div>`;
}

// 段末加所属科判小标签
function annotateParaKepanTags(){
  if(!CROSS || !currentSutra) return;
  const sutraKepan = (CROSS._kepanBySutra && CROSS._kepanBySutra[currentSutra.id]) || [];
  if(!sutraKepan.length) return;
  // 对每个科判节点，quote在段落里出现就给该段加标签
  const wraps = document.querySelectorAll('.para-wrap');
  wraps.forEach(wrap => {
    const p = wrap.querySelector('.sutra-content');
    if(!p) return;
    const ptxt = p.textContent;
    const hits = [];
    sutraKepan.forEach(k=>{
      if(!k.quote) return;
      // 截取科判原文前20字作为匹配key
      const key = k.quote.replace(/\s+/g,'').slice(0, Math.min(20, k.quote.length));
      if(key && ptxt.replace(/\s+/g,'').includes(key)){
        hits.push(k);
      }
    });
    if(hits.length){
      // 去重
      const seen = new Set();
      const tags = [];
      hits.forEach(h=>{
        if(!seen.has(h.kepan_id)){
          seen.add(h.kepan_id);
          tags.push(h);
        }
      });
      const tagHtml = `<span class="kepan-tag-wrap" style="margin-left:8px;display:inline-flex;gap:4px;flex-wrap:wrap;">${
        tags.slice(0,3).map(t=>`<a class="kepan-pill" href="kepan.html?sid=${currentSutra.id}&node=${encodeURIComponent(t.kepan_id)}" target="_blank" title="${(t.path||t.title).replace(/"/g,'&quot;')}"><i class="fa fa-sitemap"></i> ${t.title}</a>`).join('')
      }</span>`;
      const tools = wrap.querySelector('.para-tools');
      if(tools){
        // 在工具按钮前插入标签
        tools.insertAdjacentHTML('beforebegin', tagHtml);
      }
    }
  });
}



function getParaText(pid) {
  const el = document.getElementById(pid);
  return el ? el.textContent.trim().replace(/\s+/g,' ') : '';
}
function getSutraTitle() {
  return currentSutra ? (currentSutra.title || currentSutra.sutra_title || currentSutra.id) : '';
}
function getTranslator() {
  return currentSutra ? (currentSutra.translator || '失译') : '';
}

function toggleFav(pid) {
  const idx = favs.findIndex(f => f.pid === pid);
  if (idx >= 0) { favs.splice(idx,1); }
  else {
    favs.unshift({
      pid, sutra: currentSutra.id, sutraTitle: getSutraTitle(),
      text: getParaText(pid).slice(0,80), ts: Date.now()
    });
  }
  LS_set(LS_FAV, favs);
  updateParaUI(pid);
  if (curSBtab==='fav') renderSB();
}

function openNoteEditor(pid) {
  const existing = notes.find(n => n.pid === pid);
  const txt = prompt('写笔记：\n（留空则删除该段笔记）', existing ? existing.note : '');
  if (txt === null) return;
  if (txt.trim() === '') {
    notes = notes.filter(n => n.pid !== pid);
  } else {
    if (existing) existing.note = txt;
    else notes.unshift({
      pid, sutra: currentSutra.id, sutraTitle: getSutraTitle(),
      text: getParaText(pid).slice(0,80), note: txt, ts: Date.now()
    });
  }
  LS_set(LS_NOTE, notes);
  updateParaUI(pid);
  if (curSBtab==='note') renderSB();
}

function citePara(pid) {
  const paraText = getParaText(pid);
  const sutraId = currentSutra ? (currentSutra.id || '').toUpperCase() : '';
  const title = getSutraTitle();
  const trans = getTranslator();
  // §段号 = cN_pN → 简化显示
  const m = pid.match(/_c(\d+)_p(\d+)/);
  const seg = m ? `§${parseInt(m[1])+1}.${parseInt(m[2])+1}` : '';
  const cite = `"${paraText.slice(0,60)}${paraText.length>60?'…':''}" ——《${title}》（${trans}译），${sutraId}，${seg}`;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(cite).then(()=>toast('✅ 引用已复制：' + cite.slice(0,40)+'…'))
      .catch(()=>fallbackCopy(cite));
  } else fallbackCopy(cite);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('✅ 引用已复制'); }catch(e){alert(text);}
  ta.remove();
}
let toastTimer;
function toast(msg) {
  let t = document.getElementById('buddha-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'buddha-toast';
    t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(62,39,35,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:80vw;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; },1800);
}

function addBookmark() {
  if (!currentSutra) return;
  const sutraId = currentSutra.id;
  const chap = loadedChapters > 0 ? Math.min(loadedChapters-1, (currentSutra.content||[]).length-1) : 0;
  const scrollY = window.scrollY;
  // 每经只保留一个书签，覆盖旧的
  bookmarks = bookmarks.filter(b => b.sutra !== sutraId);
  bookmarks.unshift({
    sutra: sutraId, sutraTitle: getSutraTitle(), chap, scrollY, ts: Date.now()
  });
  LS_set(LS_BM, bookmarks);
  toast('🔖 已添加书签（当前位置）');
  updateBookmarkBtn();
  if (curSBtab==='bm') renderSB();
}

function gotoBookmark(b) {
  const hit = allSutras.find(s => s.id === b.sutra || s.file === b.sutra+'.json');
  if (hit) {
    closeSB();
    loadSutra(hit).then(()=>{
      setTimeout(()=>{ window.scrollTo({top:b.scrollY||0, behavior:'smooth'}); },300);
    });
  }
}
function delItem(list, key, pid, storageKey){
  const arr = (list==='fav')?favs:(list==='note'?notes:bookmarks);
  const idx = arr.findIndex(x=>x[key]===pid);
  if (idx>=0){ arr.splice(idx,1); LS_set(storageKey,arr); renderSB(); updateParaUI(pid); }
}
function updateBookmarkBtn() {
  const btn = document.getElementById('bookmark-btn');
  if (!btn || !currentSutra) return;
  const has = bookmarks.some(b => b.sutra === currentSutra.id);
  btn.classList.toggle('active', has);
  btn.title = has ? '已加书签（点击更新位置）' : '添加书签';
}
function updateParaUI(pid) {
  const el = document.getElementById(pid);
  if (!el) return;
  const favBtn = el.querySelector('.pt-fav');
  const noteBtn = el.querySelector('.pt-note');
  if (favBtn) {
    const on = favs.some(f=>f.pid===pid);
    favBtn.classList.toggle('on', on);
    favBtn.innerHTML = on ? '★' : '☆';
    favBtn.title = on ? '取消收藏' : '收藏该段';
  }
  if (noteBtn) {
    const on = notes.some(n=>n.pid===pid);
    noteBtn.classList.toggle('on', on);
    noteBtn.innerHTML = on ? '📝<span class="note-dot"></span>' : '📝';
    noteBtn.title = on ? '编辑笔记' : '添加笔记';
  }
}
function openSB() { document.getElementById('study-sidebar').classList.add('open'); document.getElementById('study-sidebar-mask').classList.add('open'); document.body.style.overflow='hidden'; renderSB(); }
function closeSB() { document.getElementById('study-sidebar').classList.remove('open'); document.getElementById('study-sidebar-mask').classList.remove('open'); document.body.style.overflow=''; }
function switchTab(tab) {
  curSBtab = tab;
  document.querySelectorAll('#study-sidebar .sb-tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  renderSB();
}
function renderSB() {
  const body = document.getElementById('sb-body');
  document.getElementById('fav-count').textContent = favs.length ? `(${favs.length})` : '';
  document.getElementById('note-count').textContent = notes.length ? `(${notes.length})` : '';
  document.getElementById('bm-count').textContent = bookmarks.length ? `(${bookmarks.length})` : '';
  let html = '';
  if (curSBtab==='fav') {
    if (!favs.length) html = '<div class="sb-empty">还没有收藏<br><br>段落末尾的 ☆ 按钮即可收藏</div>';
    else favs.forEach(f=>{
      html += `<div class="sb-item">
        <div class="sb-sutra">📜 ${f.sutraTitle} · ${(f.sutra||'').toUpperCase()}</div>
        <div class="sb-text">"${f.text}…"</div>
        <div class="sb-actions">
          <button onclick="jumpToPara('${f.pid}')"><i class="fa fa-arrow-right"></i> 跳转</button>
          <button onclick="delItem('fav','pid','${f.pid}',LS_FAV)"><i class="fa fa-trash"></i> 删除</button>
        </div></div>`;
    });
  } else if (curSBtab==='note') {
    if (!notes.length) html = '<div class="sb-empty">还没有笔记<br><br>段落末尾的 📝 按钮即可添加</div>';
    else notes.forEach(n=>{
      html += `<div class="sb-item">
        <div class="sb-sutra">📜 ${n.sutraTitle} · ${(n.sutra||'').toUpperCase()}</div>
        <div class="sb-text">"${n.text}…"</div>
        <div class="sb-note">${(n.note||'').replace(/</g,'&lt;')}</div>
        <div class="sb-actions">
          <button onclick="jumpToPara('${n.pid}')"><i class="fa fa-arrow-right"></i> 跳转</button>
          <button onclick="delItem('note','pid','${n.pid}',LS_NOTE)"><i class="fa fa-trash"></i> 删除</button>
        </div></div>`;
    });
  } else {
    if (!bookmarks.length) html = '<div class="sb-empty">还没有书签<br><br>工具栏「🔖 书签」记录阅读位置</div>';
    else bookmarks.forEach(b=>{
      html += `<div class="sb-item">
        <div class="sb-sutra">🔖 ${b.sutraTitle} · ${(b.sutra||'').toUpperCase()}</div>
        <div class="sb-text">第 ${b.chap+1} 章附近</div>
        <div class="sb-actions">
          <button onclick="gotoBookmark({sutra:'${b.sutra}',scrollY:${b.scrollY||0},chap:${b.chap||0}})"><i class="fa fa-arrow-right"></i> 继续阅读</button>
          <button onclick="delItem('bm','sutra','${b.sutra}',LS_BM)"><i class="fa fa-trash"></i> 删除</button>
        </div></div>`;
    });
  }
  body.innerHTML = html;
}
function jumpToPara(pid) {
  const [,sutra,c,p] = pid.match(/^(.+)_c(\d+)_p(\d+)$/) || [];
  if (!sutra) return;
  const needLoad = !currentSutra || currentSutra.id !== sutra;
  const go = () => {
    // 确保目标章节已加载
    const chapIdx = parseInt(c);
    const need = chapIdx + 1;
    function ensure() {
      if (loadedChapters < need && loadedChapters < currentSutra.content.length) {
        loadMoreChapters();
        setTimeout(ensure,80);
      } else {
        closeSB();
        setTimeout(()=>{
          const el = document.getElementById(pid);
          if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='#fff4c4'; setTimeout(()=>el.style.background='',1500); }
        },100);
      }
    }
    ensure();
  };
  if (needLoad) {
    const hit = allSutras.find(s=>s.id===sutra||s.file===sutra+'.json');
    if (hit) loadSutra(hit).then(go);
  } else go();
}

// ===== 阅读增强：字号调节与章节目录 =====
const FS_KEY = 'buddhist_read_fs';
let curFs = 'md';
try { curFs = localStorage.getItem(FS_KEY) || 'md'; } catch(e) {}

function applyFs(fs){
    curFs = fs;
    try { localStorage.setItem(FS_KEY, fs); } catch(e) {}
    const t = document.getElementById('sutra-text');
    if(t) t.dataset.fs = fs;
    // 实际设置字号
    const sizeMap = {sm:'15px', md:'16px', lg:'18px', xl:'20px'};
    const lhMap = {sm:'1.9', md:'2', lg:'2.05', xl:'2.1'};
    let styleEl = document.getElementById('dynamicFs');
    if (!styleEl) { styleEl = document.createElement('style'); styleEl.id='dynamicFs'; document.head.appendChild(styleEl); }
    styleEl.textContent = `.sutra-content{font-size:${sizeMap[fs]||'16px'} !important;line-height:${lhMap[fs]||'2'} !important;}`;
    document.querySelectorAll('.read-toolbar button[data-fs]').forEach(b =>
        b.classList.toggle('active', b.dataset.fs === fs));
}

function buildToc(){
    const panel = document.getElementById('toc-panel');
    if(!panel || !currentSutra) return;
    if(panel.dataset.built === currentSutra.id) return;
    panel.innerHTML = currentSutra.content.map((c, i) =>
        `<a href="javascript:void(0)" onclick="jumpToChapter(${i})">${i+1}. ${esc(c.chapter || c.title || ('第' + (i+1) + '章'))}</a>`

// 将段落中词典词条自动加下划线可点击（仅对 DICT_AUTO_SET 中的术语词加下划线，避免人物名/地名全部划线）
function linkDictTerms(simpText, origText) {
    if (!DICT_MAP || !DICT_MAP.size) return origText;
    const n = simpText.length;
    const out = [];
    let i = 0;
    while (i < n) {
        let matched = null, matchLen = 0;
        // 从长到短尝试匹配
        for (let L = Math.min(DICT_MAX_LEN, n - i); L >= 2; L--) {
            const seg = simpText.substr(i, L);
            if (DICT_AUTO_SET.has(seg) && DICT_MAP.has(seg)) { matched = DICT_MAP.get(seg); matchLen = L; break; }
        }
        if (matched) {
            const chunk = origText.substr(i, matchLen);
            out.push(`<span class="dict-term" data-term="${esc(matched.name)}" title="点击查词典：${esc(matched.name)}">${esc(chunk)}</span>`);
            i += matchLen;
        } else {
            out.push(esc(origText[i]));
            i += 1;
        }
    }
    return out.join('');
}

// 渲染单段：繁简逐字对齐后高亮锚点句并插入「注」标记；同时自动识别佛学名词加词典链接

// 解析白话三段式
function parseModern(text) {
    if (!text) return '';
    // 保护：如果不是【...】格式，直接返回
    if (text.indexOf('【') === -1) return escHtml(text).replace(/\n/g,'<br>');
    // 按 【xxx】 切分
    let parts = [];
    let re = /【([^】]+)】/g;
    let last = 0, m;
    let segs = [];
    while ((m = re.exec(text)) !== null) {
        if (m.index > last) segs.push({type:'_body', text:text.slice(last,m.index)});
        segs.push({type:m[1], text:''});
        last = m.index + m[0].length;
    }
    if (last < text.length) segs.push({type:'_tail', text:text.slice(last)});
    // 把后续 text 挂到下一个标签前
    let html = '';
    let curType = null, curText = '';
    function flush(){
        if (curType === null && !curText.trim()) { curText=''; return; }
        let body = escHtml(curText.trim()).replace(/\n/g,'<br>');
        if (!body) { curType=null; curText=''; return; }
        if (curType === null) {
            html += `<div class="modern-zhengwen" style="margin:4px 0;color:#1f4d2f;">${body}</div>`;
        } else if (curType === '义解') {
            html += `<div class="modern-yijie-body"><b class="modern-tag-yijie">【义解】</b>${body.replace(/^【义解】/,'')}</div>`;
        } else {
            // 小标题 + 正文；小标题绿色加粗
            html += `<div class="modern-xiaobiaoti"><b>【${curType}】</b></div>`;
            html += `<div class="modern-zhengwen" style="color:#1f4d2f;margin:2px 0 8px 0;">${body}</div>`;
        }
        curType=null; curText='';
    }
    for (let i=0;i<segs.length;i++){
        const s = segs[i];
        if (s.type === '_body' || s.type === '_tail') {
            curText += s.text;
        } else {
            flush();
            curType = s.type;
        }
    }
    flush();
    return html;
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderParagraph(p) {
    if (!p) return '';
    const noteSet = (currentSutra && NOTES[currentSutra.id]) ? NOTES[currentSutra.id] : null;
    const simp = toSimp(p);

    // 第一步：将文本切成"普通文本"和"学者注高亮片段"区间
    const seg = []; // [{s,e,isNote,anchor}]
    if (noteSet) {
        const hits = [];
        noteSet.anchors.forEach(a => {
            let from = 0, idx;
            while ((idx = simp.indexOf(a.text, from)) !== -1) {
                hits.push({ s: idx, e: idx + a.text.length, a });
                from = idx + a.text.length;
            }
        });
        hits.sort((x,y)=>x.s-y.s);
        let cur = 0;
        hits.forEach(h => {
            if (h.s < cur) return;
            if (h.s > cur) seg.push({s:cur, e:h.s, isNote:false});
            seg.push({s:h.s, e:h.e, isNote:true, a:h.a});
            cur = h.e;
        });
        if (cur < p.length) seg.push({s:cur, e:p.length, isNote:false});
    } else {
        seg.push({s:0, e:p.length, isNote:false});
    }

    // 第二步：每个片段内：若是注片段加学者标记；否则应用词典词条自动链接
    let out = '';
    seg.forEach(part => {
        const partOrig = p.slice(part.s, part.e);
        const partSimp = simp.slice(part.s, part.e);
        if (part.isNote) {
            out += `<span class="scholar-hi">${linkDictTerms(partSimp, partOrig)}</span>`;
            out += `<sup class="scholar-mark" data-note="${encodeURIComponent(JSON.stringify(part.a))}" title="查看学者解读">注</sup>`;
        } else {
            out += linkDictTerms(partSimp, partOrig);
        }
    });
    return out;
}

// 2. 初始化筛选器
function parseTranslator(raw) {
    // 从 "朝代 译者譯/造/集" 等格式中拆出朝代与首译者
    const t = (raw || '').trim();
    if (!t || t === '失譯' || t === '失译') return { dynasty: '失译', translator: '失译' };
    const m = t.match(/^(\S+)\s+(.+)$/);
    let dyn = '其他', tr = t;
    if (m) { dyn = m[1]; tr = m[2]; }
    // 去掉尾缀
    tr = tr.replace(/(譯|译|造|集|撰|說|说|作|糅|製|制|頌|本)$/g, '').trim();
    // 多人译者取首位
    const first = tr.split(/共|及|等/)[0].trim();
    return { dynasty: dyn, translator: first || '其他' };
}
function initFilters() {
    // 预计算每部经的朝代/译者
    allSutras.forEach(s => {
        const p = parseTranslator(s.translator);
        s._dyn = p.dynasty;
        s._tr = p.translator;
    });

    // 部类下拉（去掉敦煌重复标签，主部类优先）
    const cats = [...new Set(allSutras.map(s => s.category).filter(Boolean))];
    // 排序：先单部类（按经数倒序），再多部类
    const catCount = {};
    cats.forEach(c => { catCount[c] = allSutras.filter(s => s.category === c).length; });
    cats.sort((a,b) => {
        const am = (a.match(/,/g)||[]).length, bm = (b.match(/,/g)||[]).length;
        if (am !== bm) return am - bm;
        return catCount[b] - catCount[a];
    });
    const catSel = document.getElementById('cat-filter');
    cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `${c}（${catCount[c]}）`;
        catSel.appendChild(opt);
    });
    catSel.addEventListener('change', applyFilters);

    // 册号下拉
    const vols = [...new Set(allSutras.map(s => s.vol).filter(Boolean))].sort((a,b)=>{
        const na = parseInt(a.replace(/\D/g,''),10), nb = parseInt(b.replace(/\D/g,''),10);
        return na-nb;
    });
    const volSelect = document.getElementById('vol-filter');
    vols.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        const n = allSutras.filter(s => s.vol === v).length;
        opt.textContent = `${v}（${n}部）`;
        volSelect.appendChild(opt);
    });
    volSelect.addEventListener('change', applyFilters);

    // 朝代下拉（按年代顺序）
    const DYN_ORDER = ['後漢','後汉','曹魏','吳','吴','西晉','西晋','東晉','东晋','前秦','符秦','姚秦','後秦','后秦','西秦','乞伏秦','前涼','北涼','北凉','元魏','後魏','北魏','東魏','西魏','北周','宇文周','北齊','北齐','高齊','蕭齊','梁','陳','陈','隋','唐','宋','劉宋','元','清','高麗','失译','其他'];
    const dyns = [...new Set(allSutras.map(s => s._dyn).filter(Boolean))];
    dyns.sort((a,b) => {
        const ia = DYN_ORDER.indexOf(a), ib = DYN_ORDER.indexOf(b);
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0) return -1;
        if (ib >= 0) return 1;
        return catCountDyn(b)-catCountDyn(a);
    });
    function catCountDyn(d){ return allSutras.filter(s=>s._dyn===d).length; }
    const dynSel = document.getElementById('dyn-filter');
    dyns.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = `${d}（${catCountDyn(d)}）`;
        dynSel.appendChild(opt);
    });
    dynSel.addEventListener('change', applyFilters);

    // 译者下拉（按经数倒序，前80）
    const trCount = {};
    allSutras.forEach(s => { if(s._tr) trCount[s._tr] = (trCount[s._tr]||0)+1; });
    const trs = Object.keys(trCount).sort((a,b)=>trCount[b]-trCount[a]).slice(0, 120);
    const trSel = document.getElementById('tr-filter');
    trs.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `${t}（${trCount[t]}）`;
        trSel.appendChild(opt);
    });
    trSel.addEventListener('change', applyFilters);

    // 搜索框：防抖
    let searchTimer;
    document.getElementById('search-input').addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 200);
    });

    // 重置按钮
    document.getElementById('filter-reset').addEventListener('click', () => {
        document.getElementById('search-input').value = '';
        document.getElementById('vol-filter').value = '';
        document.getElementById('cat-filter').value = '';
        document.getElementById('dyn-filter').value = '';
        document.getElementById('tr-filter').value = '';
        applyFilters();
    });
}

    const groups = new Map();
    for(const s of list){
        const c = s.category || '其他';
        if(!groups.has(c)) groups.set(c, []);
        groups.get(c).push(s);
    }
    const cats = [...groups.keys()].sort((a,b)=>{
        const oa = catOrderKey(a), ob = catOrderKey(b);
        if(oa !== ob) return oa - ob;
        return groups.get(b).length - groups.get(a).length;
    });
    for(const cat of cats){
        const arr = groups.get(cat);
        const sec = document.createElement('section');
        sec.className = 'mb-2';
        sec.innerHTML = `<h3 class="text-[12px] font-bold text-primary/90 border-b border-primary/15 pb-0.5 mb-1 flex items-center justify-between">
            <span>${cat}</span><span class="text-[10px] font-normal text-ink/40">${arr.length}部</span>
        </h3>`;
        const grid = document.createElement('div');
        grid.className = 'flex flex-wrap gap-[2px]';
        for(const s of arr){
            const btn = document.createElement('span');
            const isYi = TRANSLATED_IDS.has(s.id);
            btn.className = 'inline-block px-1.5 py-[1px] rounded-[3px] text-[12px] cursor-pointer border sutra-item transition-colors leading-[1.4] '
                + (isYi
                    ? 'border-red-200 bg-red-50 text-red-700 hover:bg-red-100'
                    : 'border-primary/10 bg-paper/40 text-ink/75 hover:bg-primary/10 hover:text-primary');
            btn.dataset.id = s.id;
            btn.title = `${s.id.toUpperCase()} · ${s.vol||''} · ${s.translator||s._dyn||''}`;
            btn.innerHTML = isYi ? `${s.title}<b class="ml-0.5 text-red-600 text-[10px]">译</b>` : s.title;
            btn.addEventListener('click', ()=>loadSutra(s));
            grid.appendChild(btn);
        }
        sec.appendChild(grid);
        container.appendChild(sec);
    }
}

function applyFilters() {
    const keyword = document.getElementById('search-input').value.trim().toLowerCase();
    const vol = document.getElementById('vol-filter').value;
    const cat = document.getElementById('cat-filter').value;
    const dyn = document.getElementById('dyn-filter').value;

    let filtered = allSutras.filter(s => {
        if(cat && s.category !== cat) return false;
        if(vol && s.vol !== vol) return false;
        if(dyn && s._dyn !== dyn) return false;
        if(tr && s._tr !== tr) return false;
        if(keyword) {

                || (s.translator||'').toLowerCase().includes(keyword)
                || (s.id||'').toLowerCase().includes(keyword);

        return true;
    });

}

// 5. 加载单部经文（用户点击才加载，不预加载）
async function loadSutra(meta) {
    showReading(meta);

    // 先检查缓存
    const cacheKey = CACHE_KEY + meta.id;
    let sutraData = null;
    try {
        const cached = localStorage.getItem(cacheKey);
        if(cached) {
            const { data, timestamp } = JSON.parse(cached);
            if(Date.now() - timestamp < CACHE_EXPIRY) {
                sutraData = data;
            }
        }
    } catch(e) {}

    // 显示加载状态
    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
        <div class="text-center py-20">
            <div class="text-4xl mb-4 animate-pulse">📖</div>
            <p class="text-ink/70">正在加载《${meta.title}》...</p>
            <p class="text-sm text-ink/40 mt-2">${meta.word_count}字，首次加载需几秒，后续秒开</p>
        </div>
    `;
    document.getElementById('load-more')?.classList.add('hidden');

    // 没有缓存就从服务器拉
    if(!sutraData) {
        try {
            const res = await fetch(`../sutras/${meta.id}.json?v=2`);
            sutraData = await res.json();
            // 写入缓存
            try {
                localStorage.setItem(cacheKey, JSON.stringify({
                    data: sutraData,
                    timestamp: Date.now()
                }));
            } catch(e) {
                console.warn('缓存写入失败（存储空间不足），不影响阅读');
            }
        } catch(e) {
            contentArea.innerHTML = `<div class="text-center py-20 text-red-600">加载失败，请刷新重试</div>`;
            return;
        }
    }

    // 并行加载白话译文（若有）
    let modernData = null;
    if (TRANSLATED_IDS.has(meta.id)) {
        try {
            const mres = await fetch(`../data/modern-translation/${meta.id}.json?v=` + Date.now());
            if (mres.ok) {
                modernData = await mres.json();
                // 建索引：以 original_preview 前 12 字去空白为键
                modernData._map = new Map();
                (modernData.translations || []).forEach(t => {
                    const k = (t.original_preview || '').replace(/\s+/g,'').slice(0, 12);
                    if (k) modernData._map.set(k, t);

        } catch(e) { console.warn('白话加载失败', e); }

        <div class="mb-8 pb-6 border-b-2 border-primary/20">

                <span>👤 ${sutraData.translator || '失译'}${sutraData.dynasty ? '（'+sutraData.dynasty+'）' : ''}</span>

            </div>`;
    // 异译对照提示条（由ensureCross加载后updateParallelBar更新，先占位）

        window._viewMode = mode;
        document.querySelectorAll('#view-group button[data-view]').forEach(b => {
            b.classList.toggle('active', b.dataset.view === mode);
        });
        document.querySelectorAll('.sutra-text-block').forEach(el => {
            const mod = el.dataset.view === mode ? 'block' : 'none';
            // 实际通过 data-mode 控制
        });
        // 重新渲染已加载段落的显示状态
        document.querySelectorAll('.para-orig').forEach(el => {
            el.style.display = (mode === 'orig' || mode === 'both') ? '' : 'none';
        });
        document.querySelectorAll('.para-modern').forEach(el => {
            el.style.display = (mode === 'modern' || mode === 'both') ? '' : 'none';
        });
    };
    document.querySelectorAll('#view-group button[data-view]').forEach(b => {
        b.addEventListener('click', () => applyView(b.dataset.view));
    });
    applyView(window._viewMode);
    // 绑定注音按钮（按钮是动态创建的，经文加载后需重新绑定）
    initPronounceUI();
    // 先加载前N章
    loadMoreChapters();
    // 监听滚动，懒加载更多章节
    const sentinel = document.getElementById('chapter-sentinel');
    if(sentinel){
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if(entry.isIntersecting && loadedChapters < currentSutra.content.length) {
                    loadMoreChapters();
                }
            });
        }, { rootMargin: '500px' });
        observer.observe(sentinel);
    }
}

// 6. 分批加载章节（大经如大般若经不会一次渲染所有DOM）
function paraId(tid, ci, pi){ return 'p-'+tid+'-'+ci+'-'+pi; }

function loadMoreChapters() {
    if(!currentSutra) return;
    const textContainer = document.getElementById('sutra-text');
    const end = Math.min(loadedChapters + CHAPTERS_PER_PAGE, currentSutra.content.length);
    for(let i = loadedChapters; i < end; i++) {
        const chap = currentSutra.content[i];
        const chapDiv = document.createElement('div');
        chapDiv.id = 'chap-' + i;
        chapDiv.className = 'sutra-chapter';
        const paras = (chap.text || '').split(/\n+/).filter(Boolean);
        const parasHtml = paras.map((p, pIdx) => {
            const trimmed = p.trim();
            if (!trimmed) return '';
            const pid = paraId(currentSutra.id, i, pIdx);
            const hasFav = favs.some(f=>f.pid===pid);
            const hasNote = notes.some(n=>n.pid===pid);
            // 查找白话
            let modHtml = '';
            if (currentSutra._modern && currentSutra._modern._map) {
                const key = trimmed.replace(/\s+/g,'').slice(0, 12);
                const hit = currentSutra._modern._map.get(key);
                if (hit && hit.modern) {
                    const parsed = parseModern(hit.modern);
                    modHtml = `<div class="para-modern">${parsed}</div>`;
                }
            }
            const mode = window._viewMode || 'orig';
            const showOrig = (mode === 'orig' || mode === 'both') ? '' : 'display:none;';
            const showMod = (mode === 'modern' || mode === 'both') ? '' : 'display:none;';
            return `<div class="para-wrap" id="${pid}-wrap">
                <p class="sutra-content para-orig" id="${pid}" style="${showOrig}">${renderParagraph(trimmed)}</p>
                ${modHtml ? modHtml.replace('style="', `style="${showMod}`) : ''}
                <span class="para-tools">
                    <button class="pt-fav ${hasFav?'on':''}" onclick="toggleFav('${pid}')" title="${hasFav?'取消收藏':'收藏'}">${hasFav?'★':'☆'}</button>
                    <button class="pt-note ${hasNote?'on':''}" onclick="openNoteEditor('${pid}')" title="笔记">📝${hasNote?'<span class="note-dot"></span>':''}</button>
                    <button onclick="citePara('${pid}')" title="复制引用">📋</button>
                </span>
            </div>`;
        }).join('');
        chapDiv.innerHTML = `
            <div class="chapter-title">${chap.chapter || chap.title || ''}</div>
            <div>${parasHtml}</div>
        `;
        textContainer.appendChild(chapDiv);
    }
    loadedChapters = end;
    // 给新加载的段落标注科判标签
    if(window.CROSS_LOADED) annotateParaKepanTags();
    // 若注音已开启，给新加载的段落注入ruby
    if(PRON_READY && isPronOn()) annotatePronIn(textContainer);
    // 更新阅读进度
    const progEl = document.getElementById('read-progress');
    if(progEl) progEl.textContent = `已读 ${loadedChapters}/${currentSutra.content.length} 章`;
    // 全文加载完提示
    if(loadedChapters >= currentSutra.content.length) {
        if(currentSutra.content.length > CHAPTERS_PER_PAGE && !document.getElementById('end-tip')) {
            const endTip = document.createElement('div');
            endTip.id = 'end-tip';
            endTip.className = 'text-center text-ink/40 py-8 mt-8 border-t border-paper';
            endTip.textContent = '—— 全文完 ——';
            textContainer.appendChild(endTip);
        }
    } else {
        const endTip = document.getElementById('end-tip');
        if(endTip) endTip.remove();
    }
}

// ===== 生僻字/音译字注音（ruby 旁注）=====
const PRON_KEY = 'buddhist_read_pron';
let PRONOUNCE = null;
let PRONOUNCE_SINGLE = null;
let PRONOUNCE_PHRASES = [];
let PRON_READY = false;
let PRON_PENDING = false;
function isPronOn(){
  try {
    const v = localStorage.getItem(PRON_KEY);
    // 默认开启（拼音显示在字顶）
    if(v===null) return true;
    return v==='1';
  }catch(e){ return true; }
}
function setPronOn(on){
  try { localStorage.setItem(PRON_KEY, on?'1':'0'); }catch(e){}
  // 默认显示，只有关闭时加 mode-no-pron 类隐藏 rt
  document.body.classList.toggle('mode-no-pron', !on);
  document.body.classList.toggle('mode-pinyin', !!on);
  const btn = document.getElementById('btn-pron');
  if(btn) btn.classList.toggle('on', !!on);
}
function initPronounceUI(){
  const btn = document.getElementById('btn-pron');
  if(!btn || btn._bound) return;
  btn._bound = true;
  // 初始按钮状态
  setPronOn(isPronOn());
  btn.addEventListener('click', async () => {
    const on = !isPronOn();
    setPronOn(on);
    if(on){
      // 开启时：等数据就绪后注入ruby
      if(!PRON_READY){
        btn.title = '注音数据加载中...';
        await waitForPronData();
        btn.title = '点击可关闭注音';
      } else {
        btn.title = '点击可关闭注音';
      }
      annotateAllPron();
    } else {
      btn.title = '点击开启注音';
    }
  });
}
function waitForPronData(){
  if(PRON_READY) return Promise.resolve();
  if(PRON_PENDING) return PRON_PENDING;
  PRON_PENDING = new Promise(resolve=>{
    const t0 = Date.now();
    const tick = setInterval(()=>{
      if(PRON_READY || Date.now()-t0>8000){ clearInterval(tick); resolve(); }
    },100);
  });
  return PRON_PENDING;
}
function escHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pronounceHtml(txt){
  // 词组优先匹配（用占位符保护已替换的ruby）
  const placeholders = [];
  let work = txt;
  (PRONOUNCE_PHRASES||[]).forEach(ph=>{
    const w = ph.w; if(!w) return;
    let idx;
    while((idx = work.indexOf(w)) !== -1){
      const key = '\u0001PH'+placeholders.length+'\u0001';
      placeholders.push(`<ruby class="pr-ruby" data-cat="${escHtml(ph.cat||'')}" title="${escHtml(ph.mean||'')}">${escHtml(w)}<rt>${escHtml(ph.py)}</rt></ruby>`);
      work = work.slice(0,idx) + key + work.slice(idx+w.length);
    }
  });
  let out = '';
  for(let i=0;i<work.length;i++){
    const ch = work[i];
    if(ch==='\u0001'){
      let j=i+1; while(j<work.length && work[j]!=='\u0001') j++;
      const idx = parseInt(work.slice(i+2,j),10);
      out += placeholders[idx] || '';
      i = j; continue;
    }
    const m = PRONOUNCE_SINGLE[ch];
    if(m){
      out += `<ruby class="pr-ruby" data-cat="${escHtml(m.cat||'')}" title="${escHtml(m.mean||'')}">${escHtml(ch)}<rt>${escHtml(m.py)}</rt></ruby>`;
    } else {
      out += escHtml(ch);
    }
  }
  return out;
}
function rubyWalk(el){
  // 遍历文本节点，跳过已在ruby/rt/sup/a/按钮/.scholar-mark/.para-tools 内的节点
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
      const tag = p.nodeName;
      if(tag==='RUBY'||tag==='RT'||tag==='RP') return NodeFilter.FILTER_REJECT;
      if(p.closest && p.closest('sup,a,button,.scholar-mark,.para-tools,.chapter-title,.dict-term,rt,ruby')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[]; let nd;
  while((nd=walker.nextNode())) nodes.push(nd);
  nodes.forEach(tn=>{
    const frag = document.createDocumentFragment();
    const tmp = document.createElement('span');
    tmp.innerHTML = pronounceHtml(tn.nodeValue);
    while(tmp.firstChild) frag.appendChild(tmp.firstChild);
    tn.parentNode.replaceChild(frag, tn);
  });
}
function annotatePronIn(container){
  if(!PRON_READY || !PRONOUNCE_SINGLE) return;
  const paras = container.querySelectorAll ? container.querySelectorAll('.para-orig, .para-modern') : [];
  paras.forEach(p=>{
    if(p.dataset.pronounced==='1') return;
    rubyWalk(p);
    p.dataset.pronounced='1';
  });
}
function annotateAllPron(){
  const area = document.getElementById('sutra-text');
  if(!area) return;
  annotatePronIn(area);
}
// 每次懒加载新章后，如果注音开启，就给新加载的段注入ruby
const _origLoadMore = loadMoreChapters;
// 使用 MutationObserver 监听新段落插入（避免侵入原函数）
(function(){
  const area = document.getElementById('sutra-text');
  if(!area) return;
  const mo = new MutationObserver(()=>{
    if(isPronOn() && PRONOUNCE_SINGLE) annotatePronIn(area);
  });
  mo.observe(area, {childList:true, subtree:true});
})();

// ===== 手机端：左侧经目可折叠 =====
(function () {
  if (window.matchMedia('(min-width: 768px)').matches) return;
  const left = document.querySelector('#sutra-list')?.closest('div.flex-shrink-0');
  const right = document.querySelector('.flex-1');
  if (!left || !right) return;
  // 包裹成上下结构
  const parent = left.parentElement;
  parent.classList.add('mobile-layout');
  // 添加切换按钮
  const toggle = document.createElement('button');
  toggle.id = 'sutra-list-toggle';
  toggle.innerHTML = '📖 经目 <i class="fa fa-chevron-down" style="font-size:11px"></i>';
  toggle.style.cssText='display:block;width:100%;padding:10px;background:#8B4513;color:#F5F0E1;border:0;border-radius:8px;font-size:15px;margin-bottom:8px;cursor:pointer;';
  parent.insertBefore(toggle, left);
  left.style.display = 'none';
  toggle.addEventListener('click', ()=>{
    const open = left.style.display !== 'none';
    left.style.display = open ? 'none' : 'block';
    toggle.innerHTML = open ? '📖 经目 <i class="fa fa-chevron-down" style="font-size:11px"></i>' : '📖 收起经目 <i class="fa fa-chevron-up" style="font-size:11px"></i>';
  });
  // 选中经文后自动收起经目
  document.addEventListener('click', e=>{
    if (e.target.closest('#sutra-list a, #sutra-list .sutra-item')) {
      setTimeout(()=>{ left.style.display='none'; toggle.innerHTML='📖 经目 <i class="fa fa-chevron-down" style="font-size:11px"></i>'; },100);
    }
  });
})();
