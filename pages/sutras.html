<script>
let allSutras = [];
let currentSutra = null;
let loadedChapters = 0;
let NOTES = {};   // 学者注解：sutra_id -> {anchors:[...]}
let H2S = {};     // 繁->简单字映射
let DICT_TERMS = null;
let DICT_MAP = new Map();
let DICT_MAX_LEN = 6;
const CHAPTERS_PER_PAGE = 10; // 每次加载10章（大约几卷）

// ===== 阅读增强：字号调节与章节目录 =====
const FS_KEY = 'buddhist_read_fs';
let curFs = 'md';
try { curFs = localStorage.getItem(FS_KEY) || 'md'; } catch(e) {}

function applyFs(fs){
    curFs = fs;
    try { localStorage.setItem(FS_KEY, fs); } catch(e) {}
    const t = document.getElementById('sutra-text');
    if(t) t.dataset.fs = fs;
    document.querySelectorAll('.read-toolbar button[data-fs]').forEach(b =>
        b.classList.toggle('active', b.dataset.fs === fs));
}

function buildToc(){
    const panel = document.getElementById('toc-panel');
    if(!panel || !currentSutra) return;
    if(panel.dataset.built === currentSutra.id) return;
    panel.innerHTML = currentSutra.content.map((c, i) =>
        `<a href="javascript:void(0)" onclick="jumpToChapter(${i})">${i+1}. ${esc(c.chapter || c.title || ('第' + (i+1) + '章'))}</a>`
    ).join('');
    panel.dataset.built = currentSutra.id;
}

function jumpToChapter(i){
    if(!currentSutra) return;
    let guard = 0;
    while(loadedChapters <= i && loadedChapters < currentSutra.content.length && guard < 2000){
        loadMoreChapters(); guard++;
    }
    const el = document.getElementById('chap-' + i);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    document.getElementById('toc-panel')?.classList.add('hidden');
}

function esc(s){ return (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function toSimp(s){ return [...(s||'')].map(c => H2S[c] || c).join(''); }

async function loadExtras() {
    try {
        const [n, h, d] = await Promise.all([
            fetch('../data/scholar-notes.json?' + Date.now()).then(r => r.json()),
            fetch('../sutras/hant2simp.json').then(r => r.json()),
            fetch('../data/buddhist_dict.json?' + Date.now()).then(r => r.json())
        ]);
        H2S = h || {};
        (n.notes || []).forEach(x => { NOTES[x.sutra_id] = x; });
        if (d && d.terms) {
            DICT_TERMS = d.terms;
            d.terms.forEach(t => { if(t.name && t.name.length >= 2) { DICT_MAP.set(t.name, t); if(t.name.length > DICT_MAX_LEN) DICT_MAX_LEN = Math.min(t.name.length, 10); } });
        }
        if (currentSutra && NOTES[currentSutra.id]) { loadedChapters = 0; const c = document.getElementById('sutra-text'); if (c) c.innerHTML = ''; if (c) loadMoreChapters(); }
    } catch (e) { console.warn('注解/词典加载失败', e); }
}

// 将段落中词典词条自动加下划线可点击
function linkDictTerms(simpText, origText) {
    // simpText 是已转简体的文本，origText 是原文（繁简逐字对齐）
    if (!DICT_MAP || !DICT_MAP.size) return origText;
    const n = simpText.length;
    const out = [];
    let i = 0;
    while (i < n) {
        let matched = null, matchLen = 0;
        // 从长到短尝试匹配（最长 DICT_MAX_LEN 字）
        for (let L = Math.min(DICT_MAX_LEN, n - i); L >= 2; L--) {
            const seg = simpText.substr(i, L);
            if (DICT_MAP.has(seg)) { matched = DICT_MAP.get(seg); matchLen = L; break; }
        }
        if (matched) {
            const chunk = origText.substr(i, matchLen);
            out.push(`<span class="dict-term" data-term="${esc(matched.name)}" title="点击查词典：${esc(matched.name)}（${matched.type||'术语'}）">${esc(chunk)}</span>`);
            i += matchLen;
        } else {
            out.push(esc(origText[i]));
            i += 1;
        }
    }
    return out.join('');
}

// 渲染单段：繁简逐字对齐后高亮锚点句并插入「注」标记；同时自动识别佛学名词加词典链接
function renderParagraph(p) {
    if (!p) return '';
    const noteSet = (currentSutra && NOTES[currentSutra.id]) ? NOTES[currentSutra.id] : null;
    const simp = toSimp(p);

    // 第一步：将文本切成"普通文本"和"学者注高亮片段"区间
    const seg = []; // [{s,e,isNote,anchor}]
    if (noteSet) {
        const hits = [];
        noteSet.anchors.forEach(a => {
            let from = 0, idx;
            while ((idx = simp.indexOf(a.text, from)) !== -1) {
                hits.push({ s: idx, e: idx + a.text.length, a });
                from = idx + a.text.length;
            }
        });
        hits.sort((x,y)=>x.s-y.s);
        let cur = 0;
        hits.forEach(h => {
            if (h.s < cur) return;
            if (h.s > cur) seg.push({s:cur, e:h.s, isNote:false});
            seg.push({s:h.s, e:h.e, isNote:true, a:h.a});
            cur = h.e;
        });
        if (cur < p.length) seg.push({s:cur, e:p.length, isNote:false});
    } else {
        seg.push({s:0, e:p.length, isNote:false});
    }

    // 第二步：每个片段内：若是注片段加学者标记；否则应用词典词条自动链接
    let out = '';
    seg.forEach(part => {
        const partOrig = p.slice(part.s, part.e);
        const partSimp = simp.slice(part.s, part.e);
        if (part.isNote) {
            out += `<span class="scholar-hi">${linkDictTerms(partSimp, partOrig)}</span>`;
            out += `<sup class="scholar-mark" data-note="${encodeURIComponent(JSON.stringify(part.a))}" title="查看学者解读">注</sup>`;
        } else {
            out += linkDictTerms(partSimp, partOrig);
        }
    });
    return out;
}

function showNote(json) {
    const a = JSON.parse(decodeURIComponent(json));
    const box = document.getElementById('note-pop');
    box.innerHTML = `<div class="flex justify-between items-start mb-2">
            <div class="text-sm text-primary font-bold">「${a.text}」· 学者解读</div>
            <button onclick="document.getElementById('note-pop').classList.add('hidden')" class="text-ink/40 hover:text-primary">✕</button>
        </div>` +
        (a.scholars || []).map(s => `<div class="mb-2 pb-2 border-b border-paper last:border-0">
            <div class="text-sm font-bold text-ink">${s.name} <span class="text-xs font-normal text-ink/50">${s.work || ''}</span></div>
            <div class="text-sm text-ink/75 leading-relaxed mt-1">${s.note}</div>
        </div>`).join('');
    box.classList.remove('hidden');
}
const CACHE_KEY = 'sutra_cache_';
const CACHE_EXPIRY = 7 * 24 * 60 * 60 * 1000; // 缓存7天

// 1. 页面加载时只拉轻量索引（478KB，秒开）
async function loadLightIndex() {
    const res = await fetch('../sutras/index-light.json?' + Date.now());
    allSutras = await res.json();
    console.log(`轻量索引加载完成：${allSutras.length}部经`);
    document.getElementById('loading-status').textContent = '已就绪';
    document.getElementById('loading-status').className = 'text-xs bg-green-100 text-green-700 px-2 py-1 rounded';
    initFilters();
    renderSutraList(allSutras);
    document.getElementById('list-stats').textContent = `共 ${allSutras.length} 部经`;
    // 支持 ?load=文件名 直接打开指定经文（部类总览 / 全文检索跳转）
    const loadParam = new URLSearchParams(location.search).get('load');
    if (loadParam) {
        const hit = allSutras.find(s => s.file === loadParam || s.id === loadParam || (s.id + '.json') === loadParam);
        if (hit) loadSutra(hit);
    }
}

// 2. 初始化筛选器
function initFilters() {
    // 部类筛选
    const cats = [...new Set(allSutras.map(s => s.category).filter(Boolean))].sort();
    const catContainer = document.getElementById('category-filters');
    catContainer.innerHTML = `<button class="cat-btn px-2 py-1 rounded bg-primary text-white text-xs" data-cat="">全部</button>`;
    cats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'cat-btn px-2 py-1 rounded bg-gray-100 hover:bg-primary/10 text-xs';
        btn.dataset.cat = cat;
        btn.textContent = cat.length > 6 ? cat.substring(0,5)+'…' : cat;
        btn.title = cat;
        catContainer.appendChild(btn);
    });
    catContainer.addEventListener('click', e => {
        if(e.target.classList.contains('cat-btn')) {
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = 'cat-btn px-2 py-1 rounded bg-gray-100 hover:bg-primary/10 text-xs';
            });
            e.target.className = 'cat-btn px-2 py-1 rounded bg-primary text-white text-xs';
            applyFilters();
        }
    });

    // 册号筛选
    const vols = [...new Set(allSutras.map(s => s.vol).filter(Boolean))].sort();
    const volSelect = document.getElementById('vol-filter');
    vols.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        opt.textContent = v + '册';
        volSelect.appendChild(opt);
    });
    volSelect.addEventListener('change', applyFilters);

    // 搜索框：防抖
    let searchTimer;
    document.getElementById('search-input').addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 200);
    });
}

// 3. 渲染经目列表（分批渲染，避免卡顿）
function renderSutraList(list) {
    const container = document.getElementById('sutra-list');
    container.innerHTML = '';
    // 只渲染前200条，滚动时再渲染更多
    const batchSize = 200;
    let renderCount = Math.min(batchSize, list.length);
    function renderBatch(start) {
        const end = Math.min(start + batchSize, list.length);
        for(let i = start; i < end; i++) {
            const s = list[i];
            const item = document.createElement('div');
            item.className = 'py-1.5 px-2 rounded cursor-pointer hover:bg-primary/5 border-b border-gray-100 flex justify-between items-center sutra-item';
            item.dataset.id = s.id;
            item.innerHTML = `<span class="truncate">${s.title}</span><span class="text-xs text-ink/40 ml-2 flex-shrink-0">${s.dynasty||''}${s.translator?.substring(0,4)||''}</span>`;
            item.addEventListener('click', () => loadSutra(s));
            container.appendChild(item);
        }
    }
    renderBatch(0);
    // 滚动加载更多经目
    container.addEventListener('scroll', () => {
        if(container.scrollTop + container.clientHeight > container.scrollHeight - 100) {
            if(renderCount < list.length) {
                renderBatch(renderCount);
                renderCount += batchSize;
            }
        }
    });
}

// 4. 筛选逻辑
function applyFilters() {
    const keyword = document.getElementById('search-input').value.trim().toLowerCase();
    const cat = document.querySelector('.cat-btn.bg-primary')?.dataset.cat || '';
    const vol = document.getElementById('vol-filter').value;
    let filtered = allSutras.filter(s => {
        if(cat && s.category !== cat) return false;
        if(vol && s.vol !== vol) return false;
        if(keyword) {
            const match = (s.title||'').toLowerCase().includes(keyword) 
                || (s.translator||'').toLowerCase().includes(keyword)
                || (s.id||'').toLowerCase().includes(keyword);
            if(!match) return false;
        }
        return true;
    });
    renderSutraList(filtered);
    document.getElementById('list-stats').textContent = `显示 ${filtered.length} / ${allSutras.length} 部经`;
}

// 5. 加载单部经文（用户点击才加载，不预加载）
async function loadSutra(meta) {
    // 高亮当前选中
    document.querySelectorAll('.sutra-item').forEach(i => i.classList.remove('bg-gold/10'));
    document.querySelector(`[data-id="${meta.id}"]`)?.classList.add('bg-gold/10');
    
    // 先检查缓存
    const cacheKey = CACHE_KEY + meta.id;
    let sutraData = null;
    try {
        const cached = localStorage.getItem(cacheKey);
        if(cached) {
            const { data, timestamp } = JSON.parse(cached);
            if(Date.now() - timestamp < CACHE_EXPIRY) {
                sutraData = data;
                console.log('从缓存加载：' + meta.title);
            }
        }
    } catch(e) {}

    // 显示加载状态
    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
        <div class="text-center py-20">
            <div class="text-4xl mb-4 animate-pulse">📖</div>
            <p class="text-ink/70">正在加载《${meta.title}》...</p>
            <p class="text-sm text-ink/40 mt-2">${meta.word_count}字，首次加载需几秒，后续秒开</p>
        </div>
    `;
    document.getElementById('load-more').classList.add('hidden');

    // 没有缓存就从服务器拉
    if(!sutraData) {
        try {
            const res = await fetch(`../sutras/${meta.file}?v=2`);
            sutraData = await res.json();
            // 写入缓存
            try {
                localStorage.setItem(cacheKey, JSON.stringify({
                    data: sutraData,
                    timestamp: Date.now()
                }));
            } catch(e) {
                console.warn('缓存写入失败（存储空间不足），不影响阅读');
            }
        } catch(e) {
            contentArea.innerHTML = `<div class="text-center py-20 text-red-600">加载失败，请刷新重试</div>`;
            return;
        }
    }

    currentSutra = sutraData;
    loadedChapters = 0;
    // 渲染经文头部信息
    contentArea.innerHTML = `
        <div class="mb-8 pb-6 border-b-2 border-primary/20">
            <h1 class="text-3xl font-bold text-ink mb-2">${sutraData.title || sutraData.sutra_title}</h1>
            <div class="flex gap-4 text-sm text-ink/70 flex-wrap">
                <span>📜 ${sutraData.id?.toUpperCase()}</span>
                <span>👤 ${sutraData.translator || '失译'}${sutraData.dynasty ? '（'+sutraData.dynasty+'）' : ''}</span>
                <span>📚 ${sutraData.vol}册 · ${sutraData.juan_count || sutraData.content.length}卷</span>
                <span>📖 ${sutraData.category || ''}</span>
                <span>✍️ ${(sutraData.word_count||sutraData.content.reduce((sum,c)=>sum+(c.text||'').length,0)).toLocaleString()} 字</span>
            </div>
        </div>
        <div class="read-toolbar">
            <button id="toc-toggle" title="章节目录">☰ 章节目录</button>
            <span class="rt-label" style="margin-left:.5rem">字号</span>
            <button data-fs="sm">小</button>
            <button data-fs="md">中</button>
            <button data-fs="lg">大</button>
            <button data-fs="xl">特大</button>
            <span class="rt-label" id="read-progress" style="margin-left:auto"></span>
        </div>
        <div id="toc-panel" class="hidden mb-4"></div>
        <div id="sutra-text"></div>
    `;
    // 绑定阅读工具条
    document.getElementById('toc-toggle')?.addEventListener('click', () => {
        buildToc();
        document.getElementById('toc-panel')?.classList.toggle('hidden');
    });
    document.querySelectorAll('.read-toolbar button[data-fs]').forEach(b =>
        b.addEventListener('click', () => applyFs(b.dataset.fs)));
    applyFs(curFs);
    // 先加载前N章
    loadMoreChapters();
    // 监听滚动，懒加载更多章节
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if(entry.isIntersecting && loadedChapters < currentSutra.content.length) {
                loadMoreChapters();
            }
        });
    }, { rootMargin: '500px' }); // 提前500px加载
    observer.observe(document.getElementById('load-more'));
}

// 6. 分批加载章节（大经如大般若经不会一次渲染所有DOM）
function loadMoreChapters() {
    if(!currentSutra) return;
    const textContainer = document.getElementById('sutra-text');
    const end = Math.min(loadedChapters + CHAPTERS_PER_PAGE, currentSutra.content.length);
    for(let i = loadedChapters; i < end; i++) {
        const chap = currentSutra.content[i];
        const chapDiv = document.createElement('div');
        chapDiv.id = 'chap-' + i;
        chapDiv.className = 'sutra-chapter';
        chapDiv.innerHTML = `
            <div class="chapter-title">${chap.chapter || chap.title || ''}</div>
            <div>${(chap.text || '').split(/\n+/).map(p => `<p class="sutra-content">${renderParagraph(p.trim())}</p>`).join('')}</div>
        `;
        textContainer.appendChild(chapDiv);
    }
    loadedChapters = end;
    // 更新阅读进度
    const progEl = document.getElementById('read-progress');
    if(progEl) progEl.textContent = `已读 ${loadedChapters}/${currentSutra.content.length} 章`;
    // 显示/隐藏加载更多按钮
    const loadMore = document.getElementById('load-more');
    if(loadedChapters < currentSutra.content.length) {
        loadMore.classList.remove('hidden');
        document.getElementById('load-more-btn').textContent = `继续加载后续内容（${loadedChapters}/${currentSutra.content.length}）`;
    } else {
        loadMore.classList.add('hidden');
        // 全文加载完提示
        if(currentSutra.content.length > CHAPTERS_PER_PAGE) {
            const endTip = document.createElement('div');
            endTip.className = 'text-center text-ink/40 py-8 mt-8 border-t border-paper';
            endTip.textContent = '—— 全文完 ——';
            textContainer.appendChild(endTip);
        }
    }
}

document.getElementById('load-more-btn').addEventListener('click', loadMoreChapters);

// 「注」标记点击 → 弹出学者解读
document.addEventListener('click', e => {
    const mk = e.target.closest('.scholar-mark');
    if (mk && mk.dataset.note) showNote(mk.dataset.note);
    // 点击划线的佛学名词 → 弹出词典
    const dt = e.target.closest('.dict-term');
    if (dt && dt.dataset.term) { showDictTerm(dt.dataset.term, dt); e.stopPropagation(); return; }
    // 点击其他区域关闭词典
    if (!e.target.closest('#dict-pop')) closeDict();
});

// 词典弹窗
function showDictTerm(termName, anchorEl) {
    const term = DICT_MAP.get(termName);
    const pop = document.getElementById('dict-pop');
    if (!term) { pop.classList.add('hidden'); return; }
    pop.innerHTML = `
        <span class="dt-close" onclick="closeDict()">×</span>
        <div><span class="dt-name">${esc(term.name)}</span><span class="dt-type">${term.type||'术语'}</span></div>
        <div class="dt-desc">${esc(term.desc||'暂无释义')}</div>
        <div class="text-right mt-2"><a href="dict.html" target="_blank" class="text-xs text-primary hover:underline">在大词典中查看 →</a></div>
    `;
    pop.classList.remove('hidden');
    // 定位
    const rect = anchorEl.getBoundingClientRect();
    let top = rect.bottom + window.scrollY + 6;
    let left = rect.left + window.scrollX;
    // 防止超出右侧
    const popW = 320;
    if (left + popW > window.scrollX + window.innerWidth - 10) left = window.scrollX + window.innerWidth - popW - 10;
    if (top + 200 > window.scrollY + window.innerHeight) top = rect.top + window.scrollY - 200;
    pop.style.top = top + 'px';
    pop.style.left = Math.max(10, left) + 'px';
}
function closeDict() { document.getElementById('dict-pop').classList.add('hidden'); }

// 划词查词典：选中文字后在光标位置显示「查词典」按钮
document.addEventListener('mouseup', e => {
    if (e.target.closest('#dict-pop') || e.target.closest('input,textarea')) return;
    setTimeout(() => {
        const sel = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        removeSelBtn();
        if (!text || text.length < 2 || text.length > 12) return;
        // 去标点
        const key = text.replace(/[，。、；：！？「」『』（）()\s.,;!?\[\]\""'']/g,'');
        let hit = null;
        if (DICT_MAP.has(key)) hit = key;
        else {
            // 尝试简体/包含匹配
            const simp = toSimp(key);
            for (const k of DICT_MAP.keys()) {
                if (k === simp || k === key || k.includes(key) || simp.includes(k)) { hit = k; break; }
            }
        }
        if (!hit) return;
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        const btn = document.createElement('button');
        btn.id = 'dict-sel-btn';
        btn.textContent = `📖 查「${hit.length > 6 ? hit.slice(0,6)+'…' : hit}」`;
        btn.style.cssText = `position:absolute;top:${rect.bottom + window.scrollY + 4}px;left:${rect.left + window.scrollX}px;background:#8B4513;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);`;
        btn.onclick = (ev) => {
            // 伪造一个anchorEl
            const span = document.createElement('span');
            span.getBoundingClientRect = () => rect;
            showDictTerm(hit, span);
            removeSelBtn();
            window.getSelection().removeAllRanges();
            ev.stopPropagation();
        };
        document.body.appendChild(btn);
    }, 10);
});
document.addEventListener('mousedown', e => { if(!e.target.closest('#dict-sel-btn')) removeSelBtn(); });
function removeSelBtn(){ const b=document.getElementById('dict-sel-btn'); if(b) b.remove(); }

// 启动
loadExtras();
loadLightIndex();
</script>
