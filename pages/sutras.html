<style>
/* ===== 树形经目样式 ===== */
.tree, .tree ul { list-style: none; padding: 0; margin: 0; }
.tree ul { padding-left: 1.1rem; display: none; }
.tree li.open > ul { display: block; }
.tree .node { display: flex; align-items: center; padding: 4px 8px; cursor: pointer; border-radius: 4px; font-size: 13.5px; line-height: 1.5; color: #4a3728; }
.tree .node:hover { background: #f5e6c8; }
.tree .node.active { background: #d4a574; color: #fff; font-weight: 600; }
.tree .node i.caret { width: 14px; text-align: center; margin-right: 4px; font-size: 10px; color: #a07850; transition: transform .2s; }
.tree li.open > .node i.caret { transform: rotate(90deg); }
.tree .node i.icon { margin-right: 6px; color: #8b6914; font-size: 13px; }
.tree .node.cat > i.icon { color: #a0522d; }
.tree .node.vol > i.icon { color: #b8860b; }
.tree .node.sutra > i.icon { color: #8b7355; font-size: 12px; }
.tree .yi-tag { color: #c82506; font-weight: 700; font-size: 11px; margin-left: 4px; }
.tree .node.active .yi-tag { color: #fff3cd; }
.tree .meta { color: #998778; font-size: 11px; margin-left: 6px; }
.tree .node.active .meta { color: #f0e0c0; }

/* ===== 阅读区正文样式（保持原版） ===== */
.sutra-text { font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif; font-size: 17px; line-height: 2; color: #3a2f23; }
.sutra-text .juan-title { font-size: 22px; font-weight: 700; color: #8b4513; text-align: center; margin: 28px 0 18px; padding-bottom: 8px; border-bottom: 2px solid #d4a574; }
.sutra-text .pin { text-indent: 2em; margin-bottom: 12px; }
.sutra-text .term { border-bottom: 1px dashed #a0522d; cursor: help; color: #8b4513; }
.sutra-text .note { background: #fff8dc; padding: 2px 4px; border-radius: 2px; }
.sutra-text .sutra-block { margin-bottom: 16px; }
.view-toggle button { padding: 4px 12px; border: 1px solid #d4a574; background: #fff; color: #8b4513; font-size: 13px; cursor: pointer; }
.view-toggle button.on { background: #8b4513; color: #fff; }
.view-toggle button:first-child { border-radius: 4px 0 0 4px; }
.view-toggle button:last-child { border-radius: 0 4px 4px 0; }
.view-toggle button:not(:first-child) { border-left: none; }

/* 白话样式 */
.baihua-block { border-left: 4px solid #d4a574; background: #fffbf0; margin: 10px 0 20px; padding: 10px 16px; border-radius: 0 6px 6px 0; }
.baihua-block .xb { font-size: 16px; font-weight: 700; color: #8b2500; margin: 4px 0 6px; }
.baihua-block .yj { background: #f5ebd8; border-left: 3px solid #b8860b; padding: 6px 12px; margin: 6px 0 8px; font-size: 14px; color: #6b4f1d; border-radius: 3px; }
.baihua-block .zw { font-size: 16px; color: #3a2f23; text-indent: 2em; line-height: 1.9; }
.original-toggle { color: #8b6914; font-size: 13px; cursor: pointer; margin: 6px 0; user-select: none; }
.original-text { display: none; background: #f5f0e6; padding: 10px 14px; border-radius: 4px; margin-top: 6px; font-size: 14.5px; line-height: 1.8; color: #6b5c45; font-family: "Noto Serif SC", serif; }
.original-text.show { display: block; }
</style>
</head>
<body class="bg-buddha-paper text-buddha-ink font-sans bg-paper-texture min-h-screen">

<!-- 顶部导航（原版） -->
<header class="sticky top-0 z-50 bg-buddha-dark/95 backdrop-blur-sm border-b border-buddha-primary/20 shadow-md">

        <a href="javascript:void(0)" class="hover:text-buddha-secondary nav-dropdown-toggle">佛学知识<span class="nav-caret">▾</span></a>

          <a href="panjiao.html">宗派判教</a>

<!-- 主体：左侧树形经目 + 右侧阅读区 -->
<div class="flex h-[calc(100vh-62px)]">

  <!-- ===== 左侧：树形经目 ===== -->
  <aside class="w-72 flex-shrink-0 border-r border-buddha-primary/20 bg-white/60 flex flex-col">
    <div class="p-3 border-b border-buddha-primary/10 bg-buddha-light/30">
      <h2 class="text-base font-serif font-bold text-buddha-dark flex items-center">
        <i class="fa fa-book mr-2 text-buddha-primary"></i>大正藏经目
      </h2>
      <input id="treeSearch" type="text" placeholder="搜索经名/译者/经号…" class="mt-2 w-full px-2 py-1.5 text-sm rounded border border-buddha-primary/30 bg-white focus:outline-none focus:border-buddha-primary">
      <div class="mt-2 flex gap-1 text-xs">
        <button onclick="expandAll()" class="px-2 py-1 bg-buddha-light/50 rounded hover:bg-buddha-light">全部展开</button>
        <button onclick="collapseAll()" class="px-2 py-1 bg-buddha-light/50 rounded hover:bg-buddha-light">全部收起</button>
        <span class="ml-auto text-buddha-ink/60 self-center"><span id="translatedCount">0</span>/<span id="totalCount">0</span>（译）</span>
      </div>
    </div>
    <div id="treeBox" class="flex-1 overflow-y-auto scrollbar-thin p-2"></div>
  </aside>

  <!-- ===== 右侧：阅读区 ===== -->
  <main class="flex-1 overflow-y-auto scrollbar-thin" id="reader">
    <div id="welcome" class="h-full flex flex-col items-center justify-center text-buddha-ink/60 p-8">
      <i class="fa fa-book text-6xl text-buddha-primary/30 mb-6"></i>
      <h2 class="text-2xl font-serif text-buddha-dark mb-3">请从左侧经目选择一部经典</h2>
      <p class="text-center max-w-lg leading-relaxed">收录 CBETA 大正藏 2414 部经律论，点击左侧部类/册号展开树形目录；<br>经名旁红色「<span class="text-red-600 font-bold">（译）</span>」标记表示已有白话译文，可切换「原文/对照/白话」视图。</p>
    </div>
    <div id="sutraView" class="hidden p-6 md:p-10 max-w-4xl mx-auto">
      <!-- 经题信息条 -->
      <div id="sutraHeader"></div>
      <!-- 工具栏 -->
      <div class="flex flex-wrap items-center gap-3 py-3 border-y border-buddha-primary/20 my-4 text-sm">
        <span class="view-toggle">视图：
          <button class="on" data-view="original" onclick="setView('original')">原文</button>
          <button data-view="baihua" onclick="setView('baihua')">白话</button>
          <button data-view="dual" onclick="setView('dual')">对照</button>
        </span>
        <span class="ml-3">字号：
          <button onclick="setFs(15)">小</button>
          <button class="font-bold" onclick="setFs(17)">中</button>
          <button onclick="setFs(19)">大</button>
          <button onclick="setFs(22)">特大</button>
        </span>
        <button class="ml-auto text-buddha-primary hover:text-red-700" onclick="bookmark()"><i class="fa fa-bookmark-o mr-1"></i>书签</button>
      </div>
      <!-- 正文 -->
      <div id="sutraContent" class="sutra-text"></div>
    </div>
  </main>
</div>

<script>
let TREE = null, SUTRA_CACHE = {}, BAIHUA_CACHE = {}, CURRENT_VIEW = 'original';

async function init(){
  const resp = await fetch('../sutras/tree.json?'+Date.now());
  TREE = await resp.json();
  document.getElementById('totalCount').textContent = TREE.total;
  document.getElementById('translatedCount').textContent = TREE.translated;
  renderTree();
  document.getElementById('treeSearch').addEventListener('input', filterTree);
  // 恢复书签
  const last = localStorage.getItem('lastSutra');
  if(last) loadSutra(last);
}

function renderTree(filter=''){
  const box = document.getElementById('treeBox');
  const kw = filter.trim().toLowerCase();
  let html = '<ul class="tree">';
  TREE.tree.forEach((cat, ci)=>{
    let catHas = false, volHtml = '';
    cat.children.forEach((vol, vi)=>{
      let sutraHtml = '', volHas = false;
      vol.children.forEach(s=>{
        const title = s.title || '';
        const trans = s.translator || '';
        const t = (s.taisho||'').toLowerCase();
        const hit = !kw || title.toLowerCase().includes(kw) || trans.toLowerCase().includes(kw) || t.includes(kw);
        if(hit){
          volHas = true;
          sutraHtml += `<li><div class="node sutra" data-id="${s.id}" onclick="loadSutra('${s.id}', event)">
            <i class="fa fa-file-text-o icon"></i>
            <span>${s.taisho} ${title}</span>
            ${s.translated?'<span class="yi-tag">（译）</span>':''}
            <span class="meta">${s.juan?`${s.juan}卷`:'', s.chars?`${(s.chars/10000).toFixed(1)}万`:''}</span>
          </div></li>`;
        }
      });
      if(volHas || !kw){
        catHas = true;
        volHtml += `<li class="${kw?'open':''}"><div class="node vol" onclick="toggleNode(this, event)">
          <i class="fa fa-caret-right caret"></i><i class="fa fa-folder-o icon"></i><span>${vol.name}</span>
          <span class="meta">${vol.children.length}部</span>
        </div><ul>${sutraHtml}</ul></li>`;
      }
    });
    if(catHas || !kw){
      html += `<li class="${kw?'open':''}"><div class="node cat" onclick="toggleNode(this, event)">
        <i class="fa fa-caret-right caret"></i><i class="fa fa-book icon"></i><span>${cat.name}</span>
        <span class="meta">${cat.children.reduce((a,v)=>a+v.children.length,0)}部</span>
      </div><ul>${volHtml}</ul></li>`;
    }
  });
  html += '</ul>';
  box.innerHTML = html;
}
function toggleNode(el, e){
  e.stopPropagation();
  el.parentElement.classList.toggle('open');
}
function expandAll(){ document.querySelectorAll('#treeBox li').forEach(li=>li.classList.add('open')); }
function collapseAll(){ document.querySelectorAll('#treeBox li').forEach(li=>li.classList.remove('open')); }
function filterTree(){ renderTree(this.value); }

async function loadSutra(id, e){
  if(e) e.stopPropagation();
  document.querySelectorAll('.node.sutra').forEach(n=>n.classList.remove('active'));
  if(e) e.currentTarget.classList.add('active');
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('sutraView').classList.remove('hidden');
  document.getElementById('sutraHeader').innerHTML = '<div class="text-center py-6 text-buddha-ink/50"><i class="fa fa-spinner fa-spin mr-2"></i>正在加载经文…</div>';
  document.getElementById('sutraContent').innerHTML = '';

  let data = SUTRA_CACHE[id];
  if(!data){
    try {
      const r = await fetch(`../sutras/${id}.json?`+Date.now());
      data = await r.json();
      SUTRA_CACHE[id] = data;
    } catch(err){
      document.getElementById('sutraHeader').innerHTML = `<div class="text-center py-6 text-red-600">经文加载失败：${id}</div>`;
      return;
    }
  }
  // 白话
  let baihua = null;
  try {
    const br = await fetch(`../data/modern-translation/${id}.json?`+Date.now());
    if(br.ok) baihua = await br.json();
  } catch(e){}
  BAIHUA_CACHE[id] = baihua;

  // 标题
  const h = document.getElementById('sutraHeader');
  h.innerHTML = `
    <h1 class="text-2xl md:text-3xl font-serif font-bold text-buddha-dark text-center">${data.title||id}</h1>
    ${data.alt_title?`<p class="text-center text-buddha-ink/60 text-sm mt-1">又名：${data.alt_title}</p>`:''}
    <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 text-sm text-buddha-ink/70 mt-3">
      <span><i class="fa fa-hashtag mr-1"></i>${data.taisho||''}</span>
      ${data.translator?`<span><i class="fa fa-user-o mr-1"></i>${data.translator}</span>`:''}
      ${data.juan_count||data.juan?`<span><i class="fa fa-bookmark-o mr-1"></i>${data.juan_count||data.juan}卷</span>`:''}
      ${data.chars?`<span><i class="fa fa-file-text-o mr-1"></i>${(data.chars/10000).toFixed(1)}万字</span>`:''}
      ${baihua?`<span class="text-red-600"><i class="fa fa-language mr-1"></i>含白话译文 ${baihua.total_segments} 段</span>`:''}
    </div>`;
  localStorage.setItem('lastSutra', id);
  renderContent(id, data, baihua);
}

function renderContent(id, data, baihua){
  const c = document.getElementById('sutraContent');
  c.style.fontSize = '17px';
  let html = '';
  // 简单处理content（每段一个pin），同时匹配白话
  const segs = baihua && baihua.segments ? baihua.segments : [];
  const baihuaMap = {};
  segs.forEach(s=>{
    const key = (s.original_preview||'').replace(/\s/g,'').slice(0,12);
    if(key) baihuaMap[key] = s;
  });
  let buf = [];
  const flush = (juanTitle)=>{
    if(juanTitle) html += `<div class="juan-title">${juanTitle}</div>`;
    const text = buf.join('');
    if(text.trim()){
      html += renderDual(text, baihuaMap);
    }
    buf = [];
  };
  const content = data.content || [];
  content.forEach(p=>{
    if(typeof p === 'string'){
      if(/^卷[第一二三四五六七八九十百千0-9]+$/.test(p.trim()) || /^[A-Za-z\s·]+$/.test(p.trim())){
        flush(null);
        html += `<div class="juan-title">${p}</div>`;
      } else {
        buf.push(p);
      }
    } else if(p && typeof p === 'object'){
      if(p.title || p.juan){
        flush(null);
        html += `<div class="juan-title">${p.title||p.juan}</div>`;
      } else if(p.text){
        buf.push(p.text);
      }
    }
  });
  flush(null);
  c.innerHTML = html;
  // 绑定原文折叠
  c.querySelectorAll('.original-toggle').forEach(el=>{
    el.addEventListener('click', ()=>{
      const t = el.nextElementSibling;
      t.classList.toggle('show');
      el.textContent = t.classList.contains('show') ? '▲ 收起原文' : '▼ 查看原文';
    });
  });
  setView(CURRENT_VIEW);
}

function renderDual(origText, baihuaMap){
  // 将原文分段（按。！？换行），逐段匹配白话
  const paras = origText.split(/(?<=[。！？])\s*/).filter(x=>x.trim());
  let pending = '', out = '';
  paras.forEach(p=>{
    pending += p;
    const key = pending.replace(/\s/g,'').slice(0,12);
    if(baihuaMap[key]){
      const bh = baihuaMap[key];
      out += `<div class="seg-block">`;
      if(CURRENT_VIEW !== 'baihua'){
        out += `<div class="sutra-block"><p class="pin">${pending}</p></div>`;
      }
      if(CURRENT_VIEW !== 'original'){
        out += `<div class="baihua-block">`;
        if(bh.subtitle) out += `<div class="xb">${bh.subtitle}</div>`;
        if(bh.explanation) out += `<div class="yj">${bh.explanation}</div>`;
        if(bh.text) out += `<div class="zw">${bh.text}</div>`;
        if(CURRENT_VIEW !== 'baihua') out += `<div class="original-toggle">▼ 查看原文（《大正藏》原典）</div><div class="original-text">${pending}</div>`;
        out += `</div>`;
      }
      out += `</div>`;
      pending = '';
    }
  });
  if(pending.trim()){
    out += `<div class="sutra-block"><p class="pin">${pending}</p></div>`;
  }
  return out;
}

function setView(v){
  CURRENT_VIEW = v;
  document.querySelectorAll('.view-toggle button').forEach(b=>{
    b.classList.toggle('on', b.dataset.view === v);
  });
  // 重新渲染
  const id = localStorage.getItem('lastSutra');
  if(id && SUTRA_CACHE[id]) renderContent(id, SUTRA_CACHE[id], BAIHUA_CACHE[id]);
}
function setFs(px){
  document.getElementById('sutraContent').style.fontSize = px+'px';
}
function bookmark(){
  const id = localStorage.getItem('lastSutra');
  if(!id) return;
  let marks = JSON.parse(localStorage.getItem('bookmarks')||'[]');
  if(!marks.includes(id)){ marks.push(id); localStorage.setItem('bookmarks', JSON.stringify(marks)); alert('已添加书签'); }
  else alert('已在书签中');
}

init();
</script>
