<script>
let allSutras = [];
let currentSutra = null;
let loadedChapters = 0;
let NOTES = {};   // 学者注解：sutra_id -> {anchors:[...]}
let KEPAN = null; // 科判数据
let H2S = {};     // 繁->简单字映射
let DICT_TERMS = null;
let DICT_MAP = new Map();
let DICT_AUTO_SET = new Set(); // 自动划线用的词条（不含人物/地名/太通用词）
let DICT_MAX_LEN = 8;
let CROSS = null; // 跨页关联数据，懒加载
const CHAPTERS_PER_PAGE = 10; // 每次加载10章（大约几卷）

// ===== 学术工具：收藏/笔记/引用/书签 =====
const LS_FAV = 'buddhist_favs';
const LS_NOTE = 'buddhist_notes';
const LS_BM = 'buddhist_bookmarks';
function LS_get(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){return [];} }
function LS_set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let favs = LS_get(LS_FAV);
let notes = LS_get(LS_NOTE);
let bookmarks = LS_get(LS_BM);
let curSBtab = 'fav';

// ===== 跨页关联 =====
let CROSS_LOADED = false;
async function ensureCrossLoaded(){
  if(!CROSS){
    try{
      const r = await fetch('../data/cross-links.json');
      CROSS = await r.json();
      // 按sutra_id建立科判索引方便查找

// 段末加所属科判小标签
function annotateParaKepanTags(){
  if(!CROSS || !currentSutra) return;
  const sutraKepan = (CROSS._kepanBySutra && CROSS._kepanBySutra[currentSutra.id]) || [];
  if(!sutraKepan.length) return;
  // 对每个科判节点，quote在段落里出现就给该段加标签
  const wraps = document.querySelectorAll('.para-wrap');
  wraps.forEach(wrap => {
    const p = wrap.querySelector('.sutra-content');
    if(!p) return;
    const ptxt = p.textContent;
    const hits = [];
    sutraKepan.forEach(k=>{
      if(!k.quote) return;
      // 截取科判原文前20字作为匹配key
      const key = k.quote.replace(/\s+/g,'').slice(0, Math.min(20, k.quote.length));
      if(key && ptxt.replace(/\s+/g,'').includes(key)){
        hits.push(k);
      }
    });
    if(hits.length){
      // 去重
      const seen = new Set();
      const tags = [];
      hits.forEach(h=>{
        if(!seen.has(h.kepan_id)){
          seen.add(h.kepan_id);
          tags.push(h);
        }
      });
      const tagHtml = `<span class="kepan-tag-wrap" style="margin-left:8px;display:inline-flex;gap:4px;flex-wrap:wrap;">${
        tags.slice(0,3).map(t=>`<a class="kepan-pill" href="kepan.html?sid=${currentSutra.id}&node=${encodeURIComponent(t.kepan_id)}" target="_blank" title="${(t.path||t.title).replace(/"/g,'&quot;')}"><i class="fa fa-sitemap"></i> ${t.title}</a>`).join('')
      }</span>`;
      const tools = wrap.querySelector('.para-tools');
      if(tools){
        // 在工具按钮前插入标签
        tools.insertAdjacentHTML('beforebegin', tagHtml);
      }
    }
  });
}

function jumpToPara(pid) {
  const [,sutra,c,p] = pid.match(/^(.+)_c(\d+)_p(\d+)$/) || [];
  if (!sutra) return;
  const needLoad = !currentSutra || currentSutra.id !== sutra;
  const go = () => {
    // 确保目标章节已加载
    const chapIdx = parseInt(c);
    const need = chapIdx + 1;
    function ensure() {
      if (loadedChapters < need && loadedChapters < currentSutra.content.length) {
        loadMoreChapters();
        setTimeout(ensure,80);
      } else {
        closeSB();
        setTimeout(()=>{
          const el = document.getElementById(pid);
          if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='#fff4c4'; setTimeout(()=>el.style.background='',1500); }
        },100);
      }
    }
    ensure();
  };
  if (needLoad) {
    const hit = allSutras.find(s=>s.id===sutra||s.file===sutra+'.json');
    if (hit) loadSutra(hit).then(go);
  } else go();
}

                }
            });
        }
        if (autoTerms && Array.isArray(autoTerms)) {

        } else {
            // 兜底：若未加载到autoterms，所有非人物非地名词条都可识别

// 将段落中词典词条自动加下划线可点击（仅对 DICT_AUTO_SET 中的术语词加下划线，避免人物名/地名全部划线）
function linkDictTerms(simpText, origText) {
    if (!DICT_MAP || !DICT_MAP.size) return origText;
    const n = simpText.length;
    const out = [];
    let i = 0;
    while (i < n) {
        let matched = null, matchLen = 0;
        // 从长到短尝试匹配
        for (let L = Math.min(DICT_MAX_LEN, n - i); L >= 2; L--) {
            const seg = simpText.substr(i, L);
            if (DICT_AUTO_SET.has(seg) && DICT_MAP.has(seg)) { matched = DICT_MAP.get(seg); matchLen = L; break; }
        }
        if (matched) {
            const chunk = origText.substr(i, matchLen);
            out.push(`<span class="dict-term" data-term="${esc(matched.name)}" title="点击查词典：${esc(matched.name)}">${esc(chunk)}</span>`);
            i += matchLen;
        } else {
            out.push(esc(origText[i]));
            i += 1;
        }
    }
    return out.join('');
}

// 渲染单段：繁简逐字对齐后高亮锚点句并插入「注」标记；同时自动识别佛学名词加词典链接

// 解析白话三段式
function parseModern(text) {
    if (!text) return '';
    // 保护：如果不是【...】格式，直接返回
    if (text.indexOf('【') === -1) return escHtml(text).replace(/\n/g,'<br>');
    // 按 【xxx】 切分
    let parts = [];
    let re = /【([^】]+)】/g;
    let last = 0, m;
    let segs = [];
    while ((m = re.exec(text)) !== null) {
        if (m.index > last) segs.push({type:'_body', text:text.slice(last,m.index)});
        segs.push({type:m[1], text:''});
        last = m.index + m[0].length;
    }
    if (last < text.length) segs.push({type:'_tail', text:text.slice(last)});
    // 把后续 text 挂到下一个标签前
    let html = '';
    let curType = null, curText = '';
    function flush(){
        if (curType === null && !curText.trim()) { curText=''; return; }
        let body = escHtml(curText.trim()).replace(/\n/g,'<br>');
        if (!body) { curType=null; curText=''; return; }
        if (curType === null) {
            html += `<div class="modern-zhengwen" style="margin:4px 0;color:#1f4d2f;">${body}</div>`;
        } else if (curType === '义解') {
            html += `<div class="modern-yijie-body"><b class="modern-tag-yijie">【义解】</b>${body.replace(/^【义解】/,'')}</div>`;
        } else {
            // 小标题 + 正文；小标题绿色加粗
            html += `<div class="modern-xiaobiaoti"><b>【${curType}】</b></div>`;
            html += `<div class="modern-zhengwen" style="color:#1f4d2f;margin:2px 0 8px 0;">${body}</div>`;
        }
        curType=null; curText='';
    }
    for (let i=0;i<segs.length;i++){
        const s = segs[i];
        if (s.type === '_body' || s.type === '_tail') {
            curText += s.text;
        } else {
            flush();
            curType = s.type;
        }
    }
    flush();
    return html;
}
function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function renderParagraph(p) {
    if (!p) return '';
    const noteSet = (currentSutra && NOTES[currentSutra.id]) ? NOTES[currentSutra.id] : null;
    const simp = toSimp(p);

    // 第一步：将文本切成"普通文本"和"学者注高亮片段"区间
    const seg = []; // [{s,e,isNote,anchor}]
    if (noteSet) {
        const hits = [];
        noteSet.anchors.forEach(a => {
            let from = 0, idx;
            while ((idx = simp.indexOf(a.text, from)) !== -1) {
                hits.push({ s: idx, e: idx + a.text.length, a });
                from = idx + a.text.length;
            }
        });
        hits.sort((x,y)=>x.s-y.s);
        let cur = 0;
        hits.forEach(h => {
            if (h.s < cur) return;
            if (h.s > cur) seg.push({s:cur, e:h.s, isNote:false});
            seg.push({s:h.s, e:h.e, isNote:true, a:h.a});
            cur = h.e;
        });
        if (cur < p.length) seg.push({s:cur, e:p.length, isNote:false});
    } else {
        seg.push({s:0, e:p.length, isNote:false});
    }

    // 第二步：每个片段内：若是注片段加学者标记；否则应用词典词条自动链接
    let out = '';
    seg.forEach(part => {
        const partOrig = p.slice(part.s, part.e);
        const partSimp = simp.slice(part.s, part.e);
        if (part.isNote) {
            out += `<span class="scholar-hi">${linkDictTerms(partSimp, partOrig)}</span>`;
            out += `<sup class="scholar-mark" data-note="${encodeURIComponent(JSON.stringify(part.a))}" title="查看学者解读">注</sup>`;
        } else {
            out += linkDictTerms(partSimp, partOrig);
        }
    });
    return out;
}

function showNote(json) {
    const a = JSON.parse(decodeURIComponent(json));
    const box = document.getElementById('note-pop');
    // 学者注内容自动添加词典链接
    const linkify = (text)=>{
      if(!text) return '';
      // 用 linkDictTerms 同样算法做简单词链
      const out = [];
      let i=0;
      while(i<text.length){
        let matched = null, matchLen=1;
        for(let L=DICT_MAX_LEN; L>=2; L--){
          if(i+L > text.length) continue;
          const seg = text.substr(i, L);
          if(DICT_AUTO_SET.has(seg) && DICT_MAP.has(seg)){ matched = DICT_MAP.get(seg); matchLen=L; break; }
        }
        if(matched){
          out.push(`<span class="dict-term-in-note" data-term="${esc(matched.name)}">${esc(text.substr(i,matchLen))}</span>`);
          i += matchLen;
        } else {
          out.push(esc(text[i]));
          i += 1;
        }
      }
      return out.join('');
    };
    box.innerHTML = `<div class="flex justify-between items-start mb-2">
            <div class="text-sm text-primary font-bold">「${a.text}」· 学者解读</div>
            <button onclick="document.getElementById('note-pop').classList.add('hidden')" class="text-ink/40 hover:text-primary">✕</button>
        </div>` +
        (a.scholars || []).map(s => `<div class="mb-2 pb-2 border-b border-paper last:border-0">
            <div class="text-sm font-bold text-ink">${esc(s.name)} <span class="text-xs font-normal text-ink/50">${esc(s.work || '')}</span></div>
            <div class="text-sm text-ink/75 leading-relaxed mt-1">${linkify(s.note)}</div>
        </div>`).join('') +
        `<div class="mt-2 pt-2 border-t border-paper text-xs text-stone-500"><i class="fa fa-lightbulb-o"></i> 提示：棕色虚线下划线为佛学名词，点击可查词典</div>`;
    box.classList.remove('hidden');
}

// 2. 初始化筛选器
function parseTranslator(raw) {
    // 从 "朝代 译者譯/造/集" 等格式中拆出朝代与首译者
    const t = (raw || '').trim();
    if (!t || t === '失譯' || t === '失译') return { dynasty: '失译', translator: '失译' };
    const m = t.match(/^(\S+)\s+(.+)$/);
    let dyn = '其他', tr = t;
    if (m) { dyn = m[1]; tr = m[2]; }
    // 去掉尾缀
    tr = tr.replace(/(譯|译|造|集|撰|說|说|作|糅|製|制|頌|本)$/g, '').trim();
    // 多人译者取首位
    const first = tr.split(/共|及|等/)[0].trim();
    return { dynasty: dyn, translator: first || '其他' };
}
function initFilters() {
    // 预计算每部经的朝代/译者
    allSutras.forEach(s => {
        const p = parseTranslator(s.translator);
        s._dyn = p.dynasty;
        s._tr = p.translator;
    });

    // 部类下拉（去掉敦煌重复标签，主部类优先）
    const cats = [...new Set(allSutras.map(s => s.category).filter(Boolean))];
    // 排序：先单部类（按经数倒序），再多部类
    const catCount = {};
    cats.forEach(c => { catCount[c] = allSutras.filter(s => s.category === c).length; });
    cats.sort((a,b) => {
        const am = (a.match(/,/g)||[]).length, bm = (b.match(/,/g)||[]).length;
        if (am !== bm) return am - bm;
        return catCount[b] - catCount[a];
    });
    const catSel = document.getElementById('cat-filter');
    cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c;
        opt.textContent = `${c}（${catCount[c]}）`;
        catSel.appendChild(opt);
    });
    catSel.addEventListener('change', applyFilters);

    // 册号下拉
    const vols = [...new Set(allSutras.map(s => s.vol).filter(Boolean))].sort((a,b)=>{
        const na = parseInt(a.replace(/\D/g,''),10), nb = parseInt(b.replace(/\D/g,''),10);
        return na-nb;
    });
    const volSelect = document.getElementById('vol-filter');
    vols.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        const n = allSutras.filter(s => s.vol === v).length;
        opt.textContent = `${v}（${n}部）`;
        volSelect.appendChild(opt);
    });
    volSelect.addEventListener('change', applyFilters);

    // 朝代下拉（按年代顺序）
    const DYN_ORDER = ['後漢','後汉','曹魏','吳','吴','西晉','西晋','東晉','东晋','前秦','符秦','姚秦','後秦','后秦','西秦','乞伏秦','前涼','北涼','北凉','元魏','後魏','北魏','東魏','西魏','北周','宇文周','北齊','北齐','高齊','蕭齊','梁','陳','陈','隋','唐','宋','劉宋','元','清','高麗','失译','其他'];
    const dyns = [...new Set(allSutras.map(s => s._dyn).filter(Boolean))];
    dyns.sort((a,b) => {
        const ia = DYN_ORDER.indexOf(a), ib = DYN_ORDER.indexOf(b);
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0) return -1;
        if (ib >= 0) return 1;
        return catCountDyn(b)-catCountDyn(a);
    });
    function catCountDyn(d){ return allSutras.filter(s=>s._dyn===d).length; }
    const dynSel = document.getElementById('dyn-filter');
    dyns.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = `${d}（${catCountDyn(d)}）`;
        dynSel.appendChild(opt);
    });
    dynSel.addEventListener('change', applyFilters);

    // 译者下拉（按经数倒序，前80）
    const trCount = {};
    allSutras.forEach(s => { if(s._tr) trCount[s._tr] = (trCount[s._tr]||0)+1; });
    const trs = Object.keys(trCount).sort((a,b)=>trCount[b]-trCount[a]).slice(0, 120);
    const trSel = document.getElementById('tr-filter');
    trs.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = `${t}（${trCount[t]}）`;
        trSel.appendChild(opt);
    });
    trSel.addEventListener('change', applyFilters);

    // 搜索框：防抖
    let searchTimer;
    document.getElementById('search-input').addEventListener('input', e => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(applyFilters, 200);
    });

}

function renderSutraList(list) {
    const container = document.getElementById('sutra-list');

    const frag = document.createDocumentFragment();
    for(let i = 0; i < list.length; i++) {

        item.className = 'px-1 py-0 rounded cursor-pointer hover:bg-primary/5 border-b border-dotted border-gold3 flex justify-between items-center sutra-item';
        item.dataset.id = s.id;

// 4. 筛选逻辑
function applyFilters() {
    const keyword = document.getElementById('search-input').value.trim().toLowerCase();
    const vol = document.getElementById('vol-filter').value;
    const cat = document.getElementById('cat-filter').value;
    const dyn = document.getElementById('dyn-filter').value;
    const tr  = document.getElementById('tr-filter').value;
    let filtered = allSutras.filter(s => {
        if(cat && s.category !== cat) return false;
        if(vol && s.vol !== vol) return false;
        if(dyn && s._dyn !== dyn) return false;
        if(tr && s._tr !== tr) return false;
        if(keyword) {
            const match = (s.title||'').toLowerCase().includes(keyword)
                || (s.translator||'').toLowerCase().includes(keyword)
                || (s.id||'').toLowerCase().includes(keyword);
            if(!match) return false;
        }
        return true;
    });
    renderSutraList(filtered);
    document.getElementById('list-stats').textContent = `显示 ${filtered.length} / ${allSutras.length} 部经`;
}

        (currentSutra.content||[]).forEach((chap, ci)=>{
            const lines=(chap.text||'').split(/\n+/).map(l=>l.trim()).filter(Boolean);

        });
    }, { rootMargin: '500px' }); // 提前500px加载
    observer.observe(document.getElementById('load-more'));
}

// 6. 分批加载章节（大经如大般若经不会一次渲染所有DOM）
function paraId(tid, ci, pi){ return 'p-'+tid+'-'+ci+'-'+pi; }

function loadMoreChapters() {
    if(!currentSutra) return;
    const textContainer = document.getElementById('sutra-text');
    const end = Math.min(loadedChapters + CHAPTERS_PER_PAGE, currentSutra.content.length);
    for(let i = loadedChapters; i < end; i++) {
        const chap = currentSutra.content[i];
        const chapDiv = document.createElement('div');
        chapDiv.id = 'chap-' + i;
        chapDiv.className = 'sutra-chapter';
        const rawLines = (chap.text || '').split(/\n+/).map(l=>l.trim()).filter(Boolean);
        // 白话段已在loadSutra时整经匹配到_lineMod[chapIdx_lineIdx]
        const lineModMap = currentSutra._lineMod || {};
        const parasHtml = [];
        rawLines.forEach((line, li)=>{
            const pid = paraId(currentSutra.id, i, li);
            const hasFav = favs.some(f=>f.pid===pid);
            const hasNote = notes.some(n=>n.pid===pid);
            const mode = window._viewMode || 'orig';
            const showOrig = (mode === 'orig' || mode === 'both') ? '' : 'display:none;';
            const showMod = (mode === 'modern' || mode === 'both') ? '' : 'display:none;';
            let modHtml = '';
            const t = lineModMap[i+'_'+li];
            if (t && t.modern) {
                const parsed = parseModern(t.modern);
                modHtml = `<div class="para-modern" style="${showMod}">${parsed}</div>`;
            }
            parasHtml.push(`<div class="para-wrap" id="${pid}-wrap">
                <p class="sutra-content para-orig" id="${pid}" style="${showOrig}">${renderParagraph(line)}</p>
                ${modHtml}
                <span class="para-tools">
                    <button class="pt-fav ${hasFav?'on':''}" onclick="toggleFav('${pid}')" title="${hasFav?'取消收藏':'收藏'}">${hasFav?'★':'☆'}</button>
                    <button class="pt-note ${hasNote?'on':''}" onclick="openNoteEditor('${pid}')" title="笔记">📝${hasNote?'<span class="note-dot"></span>':''}</button>
                    <button onclick="citePara('${pid}')" title="复制引用">📋</button>
                </span>
            </div>`);
        });
        chapDiv.innerHTML = `
            <div class="chapter-title">${chap.chapter || chap.title || ''}</div>
            <div>${parasHtml}</div>
        `;
        textContainer.appendChild(chapDiv);
    }
    loadedChapters = end;
    // 给新加载的段落标注科判标签
    if(window.CROSS_LOADED) annotateParaKepanTags();
    // 若注音已开启，给新加载的段落注入ruby
    if(PRON_READY && isPronOn()) annotatePronIn(textContainer);
    // 更新阅读进度
    const progEl = document.getElementById('read-progress');
    if(progEl) progEl.textContent = `已读 ${loadedChapters}/${currentSutra.content.length} 章`;
    // 显示/隐藏加载更多按钮
    const loadMore = document.getElementById('load-more');
    if(loadedChapters < currentSutra.content.length) {
        loadMore.classList.remove('hidden');
        document.getElementById('load-more-btn').textContent = `继续加载后续内容（${loadedChapters}/${currentSutra.content.length}）`;
    } else {
        loadMore.classList.add('hidden');
        // 全文加载完提示
        if(currentSutra.content.length > CHAPTERS_PER_PAGE) {
            const endTip = document.createElement('div');
            endTip.className = 'text-center text-ink/40 py-8 mt-8 border-t border-paper';
            endTip.textContent = '—— 全文完 ——';
            textContainer.appendChild(endTip);
        }
    }
}

// 词典弹窗
function showDictTerm(termName, anchorEl) {
    const term = DICT_MAP.get(termName);
    const pop = document.getElementById('dict-pop');
    if (!term) { pop.classList.add('hidden'); return; }
    const catName = term.category || '术语';
    const def = term.definition || term.desc || '暂无详细释义';
    pop.innerHTML = `
        <span class="dt-close" onclick="closeDict()">×</span>
        <div><span class="dt-name">${esc(term.name)}</span><span class="dt-type">${esc(catName)}</span></div>
        <div class="dt-desc">${esc(def.length>240 ? def.slice(0,240)+'…' : def)}</div>
        <div class="text-right mt-2"><a href="dict.html?q=${encodeURIComponent(term.name)}" target="_blank" class="text-xs text-amber-700 hover:underline">在大词典中查看 →</a></div>
    `;
    pop.classList.remove('hidden');
    // 定位
    const rect = anchorEl.getBoundingClientRect();
    let top = rect.bottom + window.scrollY + 6;
    let left = rect.left + window.scrollX;
    const popW = 340;
    if (left + popW > window.scrollX + window.innerWidth - 10) left = window.scrollX + window.innerWidth - popW - 10;
    if (top + 240 > window.scrollY + window.innerHeight) top = rect.top + window.scrollY - 240;
    pop.style.top = top + 'px';
    pop.style.left = Math.max(10, left) + 'px';
}
function closeDict() { document.getElementById('dict-pop').classList.add('hidden'); }

// 划词查词典：选中文字后在光标位置显示「查词典」按钮
document.addEventListener('mouseup', e => {
    if (e.target.closest('#dict-pop') || e.target.closest('input,textarea')) return;
    setTimeout(() => {
        const sel = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        removeSelBtn();
        if (!text || text.length < 2 || text.length > 12) return;
        // 去标点
        const key = text.replace(/[，。、；：！？「」『』（）()\s.,;!?\[\]\""'']/g,'');
        let hit = null;
        if (DICT_MAP.has(key)) hit = key;
        else {
            // 尝试简体/包含匹配
            const simp = toSimp(key);
            for (const k of DICT_MAP.keys()) {
                if (k === simp || k === key || k.includes(key) || simp.includes(k)) { hit = k; break; }
            }
        }
        if (!hit) return;
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        const btn = document.createElement('button');
        btn.id = 'dict-sel-btn';
        btn.textContent = `📖 查「${hit.length > 6 ? hit.slice(0,6)+'…' : hit}」`;
        btn.style.cssText = `position:absolute;top:${rect.bottom + window.scrollY + 4}px;left:${rect.left + window.scrollX}px;background:#8B4513;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);`;
        btn.onclick = (ev) => {
            // 伪造一个anchorEl
            const span = document.createElement('span');
            span.getBoundingClientRect = () => rect;
            showDictTerm(hit, span);
            removeSelBtn();
            window.getSelection().removeAllRanges();
            ev.stopPropagation();
        };
        document.body.appendChild(btn);
    }, 10);
});

// ===== 生僻字/音译字注音（ruby 旁注）=====
const PRON_KEY = 'buddhist_read_pron';
let PRONOUNCE = null;
let PRONOUNCE_SINGLE = null;
let PRONOUNCE_PHRASES = [];
let PRON_READY = false;
let PRON_PENDING = false;
function isPronOn(){
  try {
    const v = localStorage.getItem(PRON_KEY);
    // 默认开启（拼音显示在字顶）
    if(v===null) return true;
    return v==='1';
  }catch(e){ return true; }
}
function setPronOn(on){
  try { localStorage.setItem(PRON_KEY, on?'1':'0'); }catch(e){}
  // 默认显示，只有关闭时加 mode-no-pron 类隐藏 rt
  document.body.classList.toggle('mode-no-pron', !on);
  document.body.classList.toggle('mode-pinyin', !!on);
  const btn = document.getElementById('btn-pron');
  if(btn) btn.classList.toggle('on', !!on);
}
function initPronounceUI(){
  const btn = document.getElementById('btn-pron');
  if(!btn || btn._bound) return;
  btn._bound = true;
  // 初始按钮状态
  setPronOn(isPronOn());
  btn.addEventListener('click', async () => {
    const on = !isPronOn();
    setPronOn(on);
    if(on){
      // 开启时：等数据就绪后注入ruby
      if(!PRON_READY){
        btn.title = '注音数据加载中...';
        await waitForPronData();
        btn.title = '点击可关闭注音';
      } else {
        btn.title = '点击可关闭注音';
      }
      annotateAllPron();
    } else {
      btn.title = '点击开启注音';
    }
  });
}
function waitForPronData(){
  if(PRON_READY) return Promise.resolve();
  if(PRON_PENDING) return PRON_PENDING;
  PRON_PENDING = new Promise(resolve=>{
    const t0 = Date.now();
    const tick = setInterval(()=>{
      if(PRON_READY || Date.now()-t0>8000){ clearInterval(tick); resolve(); }
    },100);
  });
  return PRON_PENDING;
}
function escHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pronounceHtml(txt){
  // 词组优先匹配（用占位符保护已替换的ruby）
  const placeholders = [];
  let work = txt;
  (PRONOUNCE_PHRASES||[]).forEach(ph=>{
    const w = ph.w; if(!w) return;
    let idx;
    while((idx = work.indexOf(w)) !== -1){
      const key = '\u0001PH'+placeholders.length+'\u0001';
      placeholders.push(`<ruby class="pr-ruby" data-cat="${escHtml(ph.cat||'')}" title="${escHtml(ph.mean||'')}">${escHtml(w)}<rt>${escHtml(ph.py)}</rt></ruby>`);
      work = work.slice(0,idx) + key + work.slice(idx+w.length);
    }
  });
  let out = '';
  for(let i=0;i<work.length;i++){
    const ch = work[i];
    if(ch==='\u0001'){
      let j=i+1; while(j<work.length && work[j]!=='\u0001') j++;
      const idx = parseInt(work.slice(i+2,j),10);
      out += placeholders[idx] || '';
      i = j; continue;
    }
    const m = PRONOUNCE_SINGLE[ch];
    if(m){
      out += `<ruby class="pr-ruby" data-cat="${escHtml(m.cat||'')}" title="${escHtml(m.mean||'')}">${escHtml(ch)}<rt>${escHtml(m.py)}</rt></ruby>`;
    } else {
      out += escHtml(ch);
    }
  }
  return out;
}
function rubyWalk(el){
  // 遍历文本节点，跳过已在ruby/rt/sup/a/按钮/.scholar-mark/.para-tools 内的节点
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || !n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentNode; if(!p) return NodeFilter.FILTER_REJECT;
      const tag = p.nodeName;
      if(tag==='RUBY'||tag==='RT'||tag==='RP') return NodeFilter.FILTER_REJECT;
      if(p.closest && p.closest('sup,a,button,.scholar-mark,.para-tools,.chapter-title,.dict-term,rt,ruby')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes=[]; let nd;
  while((nd=walker.nextNode())) nodes.push(nd);
  nodes.forEach(tn=>{
    const frag = document.createDocumentFragment();
    const tmp = document.createElement('span');
    tmp.innerHTML = pronounceHtml(tn.nodeValue);
    while(tmp.firstChild) frag.appendChild(tmp.firstChild);
    tn.parentNode.replaceChild(frag, tn);
  });
}
function annotatePronIn(container){
  if(!PRON_READY || !PRONOUNCE_SINGLE) return;
  const paras = container.querySelectorAll ? container.querySelectorAll('.para-orig, .para-modern') : [];
  paras.forEach(p=>{
    if(p.dataset.pronounced==='1') return;
    rubyWalk(p);
    p.dataset.pronounced='1';
  });
}
function annotateAllPron(){
  const area = document.getElementById('sutra-text');
  if(!area) return;
  annotatePronIn(area);
}
// 每次懒加载新章后，如果注音开启，就给新加载的段注入ruby
const _origLoadMore = loadMoreChapters;
// 使用 MutationObserver 监听新段落插入（避免侵入原函数）
(function(){
  const area = document.getElementById('sutra-text');
  if(!area) return;
  const mo = new MutationObserver(()=>{
    if(isPronOn() && PRONOUNCE_SINGLE) annotatePronIn(area);
  });

})();
