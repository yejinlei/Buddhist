const VOLS = ['阿含部','本缘·般若','般若部','法华·华严','宝积·涅槃·大集','经集部','密教部','律部','释经论·毗昙','中观·瑜伽·论集','诸宗·史传·目录·事汇·外教·索引'];
const listEl = document.getElementById('sutraList');
const volFiltersEl = document.getElementById('volFilters');
const searchInput = document.getElementById('searchInput');
const totalBadge = document.getElementById('totalBadge');
const welcomeCount = document.getElementById('welcomeCount');
const welcome = document.getElementById('welcome');
const view = document.getElementById('sutraView');
let currentVol = '';
let currentKw = '';
VOLS.forEach(v=>{
  const btn=document.createElement('button');
  btn.className='vol-filter px-2 py-1 rounded border border-buddha-primary/30 hover:bg-buddha-primary/10';
  btn.dataset.vol=v; btn.textContent=v;
  volFiltersEl.appendChild(btn);
});
volFiltersEl.addEventListener('click',e=>{
  const btn=e.target.closest('.vol-filter'); if(!btn) return;
  currentVol=btn.dataset.vol;
  [...volFiltersEl.children].forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); renderList();
});
function renderList(){
  const kw=currentKw.trim().toLowerCase();
  const f=SUTRAS.filter(s=>{
    if(currentVol&&s.vol!==currentVol) return false;
    if(kw&&!(s.id.toLowerCase().includes(kw)||s.title.toLowerCase().includes(kw)||(s.author||'').toLowerCase().includes(kw))) return false;
    return true;
  });
  totalBadge.textContent=f.length+' / '+SUTRAS.length;
  listEl.innerHTML=f.map(s=>`<div class="sutra-item" data-id="${s.id}"><span class="sid">${s.id}</span>${s.title}<span class="yi-badge">（译）</span></div>`).join('');
}
listEl.addEventListener('click',e=>{
  const it=e.target.closest('.sutra-item'); if(!it) return;
  [...listEl.children].forEach(c=>c.classList.remove('active'));
  it.classList.add('active'); loadSutra(it.dataset.id);
});
searchInput.addEventListener('input',e=>{currentKw=e.target.value;renderList();});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function loadSutra(id){
  fetch('../data/modern-translation/'+id+'.json').then(r=>r.json()).then(data=>{
    welcome.classList.add('hidden'); view.classList.remove('hidden');
    const s=SUTRAS.find(x=>x.id===id);
    document.getElementById('sVol').textContent=s.vol;
    document.getElementById('sId').textContent=id;
    document.getElementById('sAuthor').textContent=data.author||'';
    document.getElementById('sTitle').textContent='《'+data.title+'》';
    document.getElementById('sOpenLink').href='../'+id+'.html';
    const c=document.getElementById('sutraContent');
    c.innerHTML=(data.segments||[]).map(seg=>`
      <div class="mb-6 pb-4 border-b border-dashed border-buddha-primary/20">
        <div class="font-bold text-buddha-primary mb-2">【${esc(seg.subtitle||'')}】</div>
        ${seg.explanation?`<div class="bg-buddha-light/60 p-3 mb-2 border-l-4 border-buddha-primary/40 text-sm leading-relaxed"><strong>【义解】</strong>${esc(seg.explanation)}</div>`:''}
        <div class="leading-loose text-[15px]" style="text-indent:2em;">${esc(seg.translation||'')}</div>
        ${seg.original?`<details class="mt-2 text-sm text-buddha-dark/60"><summary>查看原文</summary><pre class="whitespace-pre-wrap bg-buddha-light/30 p-3 mt-1 border-l-2 border-gray-300 leading-relaxed" style="font-family:inherit;">${esc(seg.original)}</pre></details>`:''}
      </div>`).join('');
    c.scrollTop=0;
  });
}
welcomeCount.textContent=SUTRAS.length;
renderList();
</script>
