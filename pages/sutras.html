<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全藏原典 · 佛学本体论</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
<script>
tailwind.config={theme:{extend:{colors:{buddha:{primary:'#8B5A2B',secondary:'#D4AF37',dark:'#3A2E1F',light:'#F5F0E6',paper:'#F8F4E9'}}}}}
</script>
<style>
body{font-family:"Noto Serif SC","Source Han Serif SC",serif;background:#F8F4E9;}
.sutra-text p{text-indent:2em;line-height:2;margin:0.8em 0;font-size:17px;white-space: pre-wrap;}
.vol-tag{display:inline-block;padding:2px 8px;border-radius:4px;background:#8B5A2B;color:white;font-size:12px;margin-right:6px;}
.cat-tag{display:inline-block;padding:2px 8px;border-radius:4px;background:#D4AF37;color:#3A2E1F;font-size:12px;margin-right:6px;}
.scroll-thin::-webkit-scrollbar{width:6px;height:6px;}
.scroll-thin::-webkit-scrollbar-thumb{background:rgba(139,90,43,.3);border-radius:3px;}
.filter-btn.active{background:#8B5A2B;color:white;}
.chapter-title{font-weight:bold;font-size:18px;color:#8B5A2B;margin-top:2rem;padding-bottom:0.5rem;border-bottom:1px solid #D4AF37;}
.loading{text-align:center;padding:2rem;color:#8B5A2B;}
</style>
</head>
<body class="text-buddha-dark">

<!-- 导航 -->
<header class="sticky top-0 z-50 bg-buddha-dark/95 backdrop-blur-sm border-b border-buddha-primary/20 text-white shadow-md">
  <div class="container mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <i class="fa fa-leaf text-buddha-secondary text-xl"></i>
      <a href="../index.html" class="font-serif font-bold text-lg">佛学本体论</a>
      <span class="mx-2 text-white/30">|</span>
      <span class="text-white/70">全藏原典</span>
    </div>
    <nav class="flex gap-4 text-sm">
      <a href="../index.html" class="hover:text-buddha-secondary">首页</a>
      <a href="graph.html" class="hover:text-buddha-secondary">义理图谱</a>
      <a href="translation.html" class="hover:text-buddha-secondary">佛典译学</a>
      <a href="kepan.html" class="hover:text-buddha-secondary">科判导航</a>
      <a href="panjiao.html" class="hover:text-buddha-secondary">判教对比</a>
      <a href="inference.html" class="hover:text-buddha-secondary">概念推演</a>
      <a href="timeline.html" class="hover:text-buddha-secondary">译传时间轴</a>
    </nav>
  </div>
</header>

<div class="container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
  <!-- 左侧经目 -->
  <aside class="lg:col-span-1">
    <div class="bg-white rounded-lg shadow p-4 sticky top-20 max-h-[calc(100vh-100px)] overflow-auto scroll-thin">
      <h3 class="font-bold text-buddha-primary mb-3 flex items-center gap-2">
        <i class="fa fa-book"></i>
        <span>大正藏经目</span>
        <span id="totalBadge" class="ml-auto text-xs bg-buddha-primary/10 text-buddha-primary px-2 py-0.5 rounded">加载中</span>
      </h3>
      
      <div class="mb-3">
        <input id="searchInput" type="text" placeholder="搜索经名/译者/经号..."
               class="w-full px-3 py-2 border border-buddha-primary/20 rounded text-sm focus:outline-none focus:border-buddha-primary">
      </div>
      
      <!-- 部类筛选 -->
      <div class="mb-3">
        <div class="text-xs text-buddha-dark/60 mb-1">按部类筛选：</div>
        <div class="flex flex-wrap gap-1 text-xs" id="catFilters">
          <button class="filter-btn px-2 py-1 rounded border border-buddha-primary/30 hover:bg-buddha-primary/10 active" data-cat="">全部部类</button>
        </div>
      </div>
      
      <!-- 册号筛选 -->
      <div class="mb-3">
        <div class="text-xs text-buddha-dark/60 mb-1">按册号筛选：</div>
        <div class="flex flex-wrap gap-1 text-xs" id="volFilters">
          <button class="filter-btn px-2 py-1 rounded border border-buddha-primary/30 hover:bg-buddha-primary/10 active" data-vol="">全部册</button>
        </div>
      </div>
      
      <div id="sutraList" class="space-y-1 text-sm">
        <div class="loading">正在加载经目...</div>
      </div>
    </div>
  </aside>
  
  <!-- 右侧正文 -->
  <main class="lg:col-span-3">
    <div id="welcome" class="bg-white rounded-lg shadow p-8 text-center">
      <i class="fa fa-book text-buddha-primary text-5xl mb-4 opacity-30"></i>
      <h2 class="text-2xl font-serif font-bold mb-3">CBETA大正藏全文在线阅读</h2>
      <p class="text-buddha-dark/60 max-w-lg mx-auto mb-4">
        从左侧选择一部经典开始阅读。当前已收录
        <span class="text-buddha-primary font-bold" id="welcomeCount">加载中</span>部
        共<span class="text-buddha-primary font-bold" id="welcomeChars">加载中</span>，
        数据来自 <a href="https://www.cbeta.org/" target="_blank" class="text-blue-600 underline">CBETA</a> 电子佛典。
      </p>
    </div>
    
    <div id="sutraContent" class="hidden bg-white rounded-lg shadow p-8">
      <div class="mb-6 pb-4 border-b border-buddha-primary/20">
        <h1 id="sutraTitle" class="text-3xl font-serif font-bold text-buddha-dark mb-2"></h1>
        <div class="flex flex-wrap items-center gap-2 text-sm text-buddha-dark/70">
          <span id="sutraId"></span>
          <span id="sutraVol"></span>
          <span id="sutraTranslator"></span>
          <span id="sutraJuanCount"></span>
          <span id="sutraChars" class="ml-auto"></span>
        </div>
      </div>
      <div id="sutraText" class="sutra-text"></div>
    </div>
  </main>
</div>

<script>
let allSutras = [];
let currentFilter = { cat: '', vol: '', search: '' };

// 从实际JSON文件动态加载经目元数据
async function buildIndex() {
  // 生成t0001到t2920的经号列表（大正藏T01-T55, T85范围）
  const ids = [];
  // 正藏T01-T55
  for (let n = 1; n <= 2200; n++) {
    ids.push('t' + String(n).padStart(4, '0'));
  }
  // 古逸部T85
  for (let n = 2731; n <= 2920; n++) {
    ids.push('t' + String(n).padStart(4, '0'));
  }
  
  // 并发加载元数据（只取头部）
  const results = [];
  const batchSize = 50;
  for (let i = 0; i < ids.length; i += batchSize) {
    const batch = ids.slice(i, i+batchSize);
    const batchResults = await Promise.allSettled(batch.map(async id => {
      try {
        const res = await fetch(`../sutras/${id}.json`);
        if (!res.ok) return null;
        const data = await res.json();
        // 只提取列表需要的元数据，不加载正文
        return {
          id: data.id || id,
          title: data.title,
          translator: data.translator,
          vol: data.vol || (data.taisho ? data.taisho.substr(0,3) : ''),
          chars: data.chars || data.actual_char_count || 0,
          juan: data.juan || data.juan_count || 0,
          category: data.category || '其他'
        };
      } catch(e) { return null; }
    }));
    batchResults.forEach(r => { if (r.status === 'fulfilled' && r.value) results.push(r.value); });
  }
  
  allSutras = results;
  return allSutras;
}

async function loadIndex() {
  await buildIndex();
  
  // 统计总字数
  const totalChars = allSutras.reduce((sum, s) => sum + (s.chars || 0), 0);
  document.getElementById('welcomeCount').textContent = allSutras.length;
  document.getElementById('welcomeChars').textContent = (totalChars / 10000).toFixed(0) + '万字';
  document.getElementById('totalBadge').textContent = allSutras.length + '部';
  
  // 生成部类筛选器
  const mainCats = {};
  allSutras.forEach(s => {
    const cat = s.category || '未分类';
    mainCats[cat] = (mainCats[cat] || 0) + 1;
  });
  const catContainer = document.getElementById('catFilters');
  Object.entries(mainCats).sort((a,b) => b[1]-a[1]).forEach(([cat, cnt]) => {
    if (!cat) return;
    const btn = document.createElement('button');
    btn.className = 'filter-btn px-2 py-1 rounded border border-buddha-primary/30 hover:bg-buddha-primary/10';
    btn.dataset.cat = cat;
    btn.textContent = `${cat.replace('部类','')}(${cnt})`;
    btn.onclick = () => setFilter('cat', cat);
    catContainer.appendChild(btn);
  });
  
  // 生成册号筛选器
  const vols = {};
  allSutras.forEach(s => {
    const vol = s.vol || '';
    if (vol) vols[vol] = (vols[vol] || 0) + 1;
  });
  const volContainer = document.getElementById('volFilters');
  Object.keys(vols).sort().forEach(vol => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn px-2 py-1 rounded border border-buddha-primary/30 hover:bg-buddha-primary/10';
    btn.dataset.vol = vol;
    btn.textContent = vol.replace('T', '') + '册';
    btn.onclick = () => setFilter('vol', vol);
    volContainer.appendChild(btn);
  });
  
  renderList();
}

function setFilter(type, value) {
  if (currentFilter[type] === value) value = '';
  currentFilter[type] = value;
  
  // 更新按钮状态
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.remove('active');
    const t = btn.dataset.cat !== undefined ? 'cat' : 'vol';
    if (currentFilter[t] === (btn.dataset.cat || btn.dataset.vol)) {
      btn.classList.add('active');
    }
  });
  if (currentFilter.cat === '' && currentFilter.vol === '') {
    document.querySelector('.filter-btn[data-cat=""]').classList.add('active');
    document.querySelector('.filter-btn[data-vol=""]').classList.add('active');
  }
  
  renderList();
}

function renderList() {
  const search = currentFilter.search.toLowerCase();
  const filtered = allSutras.filter(s => {
    const matchCat = !currentFilter.cat || (s.category || '') === currentFilter.cat;
    const matchVol = !currentFilter.vol || (s.vol || '') === currentFilter.vol;
    const matchSearch = !search || 
      (s.title || '').toLowerCase().includes(search) ||
      (s.translator || '').toLowerCase().includes(search) ||
      (s.id || '').toLowerCase().includes(search);
    return matchCat && matchVol && matchSearch;
  });
  
  const container = document.getElementById('sutraList');
  container.innerHTML = '';
  
  filtered.slice(0, 200).forEach(s => {
    const item = document.createElement('div');
    item.className = 'px-2 py-1.5 rounded hover:bg-buddha-light cursor-pointer border border-transparent hover:border-buddha-primary/20';
    item.innerHTML = `
      <div class="font-medium text-buddha-dark">${s.title}</div>
      <div class="text-xs text-buddha-dark/50 flex flex-wrap gap-1">
        <span class="text-buddha-primary/70">${s.id.toUpperCase()}</span>
        <span>·</span>
        <span>${s.translator || '失译'}</span>
        ${s.juan ? `<span>· ${s.juan}卷</span>` : ''}
        <span class="ml-auto">${((s.chars||0)/10000).toFixed(1)}万字</span>
      </div>
    `;
    item.onclick = () => loadSutra(s.id);
    container.appendChild(item);
  });
  
  if (filtered.length > 200) {
    const more = document.createElement('div');
    more.className = 'text-xs text-center text-buddha-dark/50 py-2';
    more.textContent = `共${filtered.length}部，显示前200部，请使用搜索或筛选缩小范围`;
    container.appendChild(more);
  }
}

async function loadSutra(id) {
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('sutraContent').classList.remove('hidden');
  
  // 显示加载中
  const textContainer = document.getElementById('sutraText');
  textContainer.innerHTML = '<div class="loading">正在加载经文正文...</div>';
  
  const res = await fetch(`../sutras/${id}.json`);
  const sutra = await res.json();
  
  // 适配实际数据格式
  const title = sutra.title;
  const sutraId = sutra.id || id;
  const vol = sutra.vol || (sutra.taisho ? sutra.taisho.substr(0,3) : '');
  const translator = sutra.translator || '失译';
  const juan = sutra.juan || sutra.juan_count || 0;
  const chars = sutra.chars || sutra.actual_char_count || 0;
  const content = sutra.content || sutra.chapters || [];
  
  document.getElementById('sutraTitle').textContent = title;
  document.getElementById('sutraId').innerHTML = `<span class="vol-tag">${sutraId.toUpperCase()}</span>`;
  document.getElementById('sutraVol').innerHTML = vol ? `<span>📖 ${vol}</span>` : '';
  document.getElementById('sutraTranslator').textContent = translator;
  document.getElementById('sutraJuanCount').textContent = juan ? `${juan}卷` : '';
  document.getElementById('sutraChars').textContent = chars ? `${(chars/10000).toFixed(2)}万字` : '';
  
  textContainer.innerHTML = '';
  if (content.length === 0) {
    textContainer.innerHTML = '<div class="text-center py-8 text-buddha-dark/50">该经正文加载中...</div>';
    return;
  }
  
  content.forEach(ch => {
    const chTitle = ch.chapter || ch.title;
    const chText = ch.text || ch.content;
    if (chTitle) {
      const h = document.createElement('div');
      h.className = 'chapter-title';
      h.textContent = chTitle;
      textContainer.appendChild(h);
    }
    if (chText) {
      const p = document.createElement('p');
      p.textContent = chText;
      textContainer.appendChild(p);
    }
  });
  
  window.scrollTo(0, 0);
}

document.getElementById('searchInput').addEventListener('input', (e) => {
  currentFilter.search = e.target.value;
  renderList();
});

// 页面加载完成后开始建索引
loadIndex().catch(err => {
  document.getElementById('sutraList').innerHTML = `<div class="text-red-600 p-2">加载失败：${err.message}</div>`;
});
</script>
</body>
</html>
