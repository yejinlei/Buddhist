<script>
let allSutras = [];
let currentSutra = null;
let loadedChapters = 0;
let NOTES = {};   // 学者注解：sutra_id -> {anchors:[...]}
let KEPAN = null; // 科判数据
let H2S = {};     // 繁->简单字映射
let DICT_TERMS = null;
let DICT_MAP = new Map();
let DICT_AUTO_SET = new Set(); // 自动划线用的词条（不含人物/地名/太通用词）
let DICT_MAX_LEN = 8;
let CROSS = null; // 跨页关联数据，懒加载
const CHAPTERS_PER_PAGE = 10; // 每次加载10章（大约几卷）

// ===== 学术工具：收藏/笔记/引用/书签 =====
const LS_FAV = 'buddhist_favs';
const LS_NOTE = 'buddhist_notes';
const LS_BM = 'buddhist_bookmarks';
function LS_get(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){return [];} }
function LS_set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let favs = LS_get(LS_FAV);
let notes = LS_get(LS_NOTE);
let bookmarks = LS_get(LS_BM);
let curSBtab = 'fav';

// 段落唯一 ID：经号-章序-段序（用于收藏/笔记/引用定位）
function paraId(sutraId, chapIdx, paraIdx){ return `${sutraId}-c${chapIdx}-p${paraIdx}`; }

// ===== 跨页关联 =====
let CROSS_LOADED = false;
async function ensureCrossLoaded(){
  if(!CROSS){
    try{
      const r = await fetch('../data/cross-links.json');
      CROSS = await r.json();
      // 按sutra_id建立科判索引方便查找
      if(CROSS.kepan_to_sutra){
        CROSS._kepanBySutra = {};
        Object.values(CROSS.kepan_to_sutra).forEach(k=>{
          if(!CROSS._kepanBySutra[k.sutra_id]) CROSS._kepanBySutra[k.sutra_id] = [];
          CROSS._kepanBySutra[k.sutra_id].push(k);
        });
      }
      CROSS_LOADED = true;
    }catch(e){
      console.warn('跨页关联加载失败', e);
      CROSS = {};
      CROSS_LOADED = true;
    }
  }
  return CROSS;
}

// 异译本提示条
function updateParallelBar(){
  const bar = document.getElementById('parallel-bar');
  if(!bar || !currentSutra || !CROSS) return;

// 段末加所属科判小标签
function annotateParaKepanTags(){
  if(!CROSS || !currentSutra) return;
  const sutraKepan = (CROSS._kepanBySutra && CROSS._kepanBySutra[currentSutra.id]) || [];
  if(!sutraKepan.length) return;
  // 对每个科判节点，quote在段落里出现就给该段加标签
  const wraps = document.querySelectorAll('.para-wrap');
  wraps.forEach(wrap => {
    const p = wrap.querySelector('.sutra-content');
    if(!p) return;
    const ptxt = p.textContent;
    const hits = [];
    sutraKepan.forEach(k=>{
      if(!k.quote) return;
      // 截取科判原文前20字作为匹配key
      const key = k.quote.replace(/\s+/g,'').slice(0, Math.min(20, k.quote.length));
      if(key && ptxt.replace(/\s+/g,'').includes(key)){
        hits.push(k);
      }
    });
    if(hits.length){
      // 去重
      const seen = new Set();
      const tags = [];
      hits.forEach(h=>{
        if(!seen.has(h.kepan_id)){
          seen.add(h.kepan_id);
          tags.push(h);
        }
      });
      const tagHtml = `<span class="kepan-tag-wrap" style="margin-left:8px;display:inline-flex;gap:4px;flex-wrap:wrap;">${
        tags.slice(0,3).map(t=>`<a class="kepan-pill" href="kepan.html?sid=${currentSutra.id}&node=${encodeURIComponent(t.kepan_id)}" target="_blank" title="${(t.path||t.title).replace(/"/g,'&quot;')}"><i class="fa fa-sitemap"></i> ${t.title}</a>`).join('')
      }</span>`;
      const tools = wrap.querySelector('.para-tools');
      if(tools){
        // 在工具按钮前插入标签
        tools.insertAdjacentHTML('beforebegin', tagHtml);
      }
    }
  });
}

function getParaKepanPath(pid) {
  const el = document.getElementById(pid);
  if(!el) return null;
  const p = el.closest('.para-wrap');
  if(!p) return null;
  // 优先读已加在段末的 kepan-pill
  const pill = p.querySelector('.kepan-pill');
  if(pill && pill.title) return pill.title;
  // 兜底：实时匹配
  const sutraKepan = (CROSS && CROSS._kepanBySutra && CROSS._kepanBySutra[currentSutra.id]) || [];
  const ptxt = p.querySelector('.sutra-content')?.textContent?.replace(/\s+/g,'') || '';
  for(const k of sutraKepan){
    if(!k.quote) continue;
    const key = k.quote.replace(/\s+/g,'').slice(0, 20);
    if(key && ptxt.includes(key)) return k.path || k.title;
  }
  return null;
}
function getSutraTaishoVol(sid) {
  // 从经号算大正藏册号：T01-T17 阿含、T18-T33 本缘、T34-T55 般若等
  const num = parseInt((sid||'').replace(/^t/i,'').replace(/[a-z].*$/i,''),10);
  if(isNaN(num)) return null;
  const volMap = [
    [122,1],[219,2],[322,3],[452,4],[573,5],[784,6],[912,7],[1041,8],
    [1163,9],[1274,10],[1338,11],[1404,12],[1462,13],[1526,14],[1586,15],
    [1692,16],[1803,17],[1886,18],[1955,19],[2027,20],[2084,21],[2127,22],
    [2144,23],[2157,24],[2184,25],[2201,26],[2220,27],[2250,28],[2290,29],
    [2342,30],[2409,31],[2472,32],[2603,33],[2646,34],[2698,35],[2723,36],
    [2753,37],[2773,38],[2788,39],[2823,40],[2848,41],[2866,42],[2896,43],
    [2920,44],[2942,45],[2961,46],[2980,47],[3048,48],[3048,49],[3048,50],
    [3048,51],[3048,52],[3048,53],[3048,54],[3048,55]
  ];
  for(const [end, vol] of volMap){ if(num<=end) return vol; }
  return 55;
}

function citePara(pid) {
  const paraText = getParaText(pid);
  const sutraId = currentSutra ? (currentSutra.id || '').toUpperCase() : '';
  const title = getSutraTitle();
  const transRaw = getTranslator() || '失译';
  // 译者朝代解析：形如 "[姚秦]鸠摩罗什 译" / "[唐]玄奘 译"
  const transM = transRaw.match(/^\s*\[?([^\]\s]*)?\]?\s*([^\s译]+)/);
  const dynasty = transM ? (transM[1]||'') : '';
  const translator = transM ? transM[2] : transRaw.replace(/译$/,'').trim();
  // 章节号：cN_pN → §(N+1).(N+1)
  const m = pid.match(/c(\d+)_p(\d+)/);
  const chIdx = m ? parseInt(m[1]) : -1;
  const pIdx = m ? parseInt(m[2]) : -1;
  const chapterName = (chIdx>=0 && currentSutra && currentSutra.chapters && currentSutra.chapters[chIdx])
    ? currentSutra.chapters[chIdx].title : '';
  const sec = m ? `§${chIdx+1}.${pIdx+1}` : '';
  // 科判位置
  const kepanPath = getParaKepanPath(pid);
  // 大正藏册号（T08n0251 → 册8）
  const vol = getSutraTaishoVol(sutraId);
  const taishoLoc = vol ? `T${vol}, ${sutraId}` : sutraId;

  // 三种格式
  const quotePart = paraText.length>180 ? paraText.slice(0,178)+'……' : paraText;
  const transLabel = dynasty ? `[${dynasty}]${translator}` : translator;
  const locParts = [taishoLoc];
  if(chapterName) locParts.push(`〈${chapterName}〉`);
  if(sec) locParts.push(sec);
  if(kepanPath) locParts.push(`[科判：${kepanPath}]`);

  // 1. 纯文本标准学术引用（默认）
  const plainCite = `「${quotePart}」——《${title}》，${transLabel}译，${locParts.join('，')}。`;

  // 2. Markdown（适合笔记软件/Obsidian/Notion）
  const mdCite = `> ${quotePart}
>
> ——《${title}》，${transLabel}译，${locParts.join('，')}。`;

  // 3. 国际佛学界引用格式（近似 CBETA 引用法）
  const intlCite = `"${quotePart.slice(0,150)}${quotePart.length>150?'…':''}"《${title}》, tr. ${translator} (${dynasty||'—'}), ${taishoLoc}${chapterName?' 〈'+chapterName+'〉':''}${sec?' '+sec:''}${kepanPath?' [Kepan: '+kepanPath+']':''}. CBETA.`;

  // 弹出格式选择菜单
  showCiteMenu(pid, {plainCite, mdCite, intlCite});
}

function showCiteMenu(pid, cites){
  let menu = document.getElementById('cite-menu');
  if(menu) menu.remove();
  const el = document.getElementById(pid);
  if(!el) return;
  const r = el.getBoundingClientRect();
  menu = document.createElement('div');
  menu.id = 'cite-menu';
  menu.style.cssText = `position:fixed;z-index:400;background:#fff;border:1px solid #d4b58a;border-radius:10px;box-shadow:0 6px 20px rgba(93,54,16,.25);padding:8px;font-size:13px;width:240px;left:${Math.min(r.left, window.innerWidth-250)}px;top:${Math.min(r.bottom+6, window.innerHeight-200)}px;`;
  menu.innerHTML = `
    <div style="font-weight:bold;color:#5d3610;padding:6px 8px 4px;border-bottom:1px dashed #e6d2a9;margin-bottom:4px;">📋 选择引用格式</div>
    <button class="cite-opt" data-fmt="plain" style="display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:none;cursor:pointer;border-radius:6px;color:#3d2914;">📄 纯文本（标准学术引用）</button>
    <button class="cite-opt" data-fmt="md" style="display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:none;cursor:pointer;border-radius:6px;color:#3d2914;">📝 Markdown（Obsidian/Notion）</button>
    <button class="cite-opt" data-fmt="intl" style="display:block;width:100%;text-align:left;padding:8px 10px;border:none;background:none;cursor:pointer;border-radius:6px;color:#3d2914;">🌐 国际佛学引用格式</button>
    <div style="border-top:1px dashed #e6d2a9;margin-top:4px;padding-top:6px;"><button class="cite-opt" data-fmt="preview" style="display:block;width:100%;text-align:left;padding:6px 10px;border:none;background:none;cursor:pointer;border-radius:6px;color:#8b7b55;font-size:12px;">👁 预览完整引文</button></div>
  `;
  document.body.appendChild(menu);
  menu.querySelectorAll('.cite-opt').forEach(b=>{
    b.addEventListener('mouseenter', ()=>b.style.background='#faf3e2');
    b.addEventListener('mouseleave', ()=>b.style.background='none');
    b.addEventListener('click', ()=>{
      const fmt = b.dataset.fmt;
      if(fmt==='preview'){
        alert(
`【纯文本】
${cites.plainCite}

【Markdown】
${cites.mdCite}

【国际佛学格式】
${cites.intlCite}`);
        return;
      }
      const text = cites[fmt==='plain'?'plainCite':fmt==='md'?'mdCite':'intlCite'];
      doCopy(text);
      menu.remove();
      document.removeEventListener('click', outsideClose);
    });
  });
  const outsideClose = (e)=>{ if(!menu.contains(e.target)){ menu.remove(); document.removeEventListener('click', outsideClose); }};
  setTimeout(()=>document.addEventListener('click', outsideClose), 10);
}
function doCopy(text){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>toast('✅ 引用已复制到剪贴板')).catch(()=>fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('✅ 引用已复制'); }catch(e){alert(text);}
  ta.remove();
}
let toastTimer;
function toast(msg) {
  let t = document.getElementById('buddha-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'buddha-toast';
    t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(62,39,35,.92);color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:300;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:80vw;';
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity='1';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ t.style.transition='opacity .4s'; t.style.opacity='0'; },1800);
}

function jumpToPara(pid) {
  const [,sutra,c,p] = pid.match(/^(.+)_c(\d+)_p(\d+)$/) || [];
  if (!sutra) return;
  const needLoad = !currentSutra || currentSutra.id !== sutra;
  const go = () => {
    // 确保目标章节已加载
    const chapIdx = parseInt(c);
    const need = chapIdx + 1;
    function ensure() {
      if (loadedChapters < need && loadedChapters < currentSutra.content.length) {
        loadMoreChapters();
        setTimeout(ensure,80);
      } else {
        closeSB();
        setTimeout(()=>{
          const el = document.getElementById(pid);
          if (el) { el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.background='#fff4c4'; setTimeout(()=>el.style.background='',1500); }
        },100);
      }
    }
    ensure();
  };
  if (needLoad) {
    const hit = allSutras.find(s=>s.id===sutra||s.file===sutra+'.json');
    if (hit) loadSutra(hit).then(go);
  } else go();
}

const BAIHUA_KEY = 'buddhist_show_baihua';
let showBaihua = false;
try { showBaihua = localStorage.getItem(BAIHUA_KEY) === '1'; } catch(e) {}
let baihuaData = null;

async function toggleBaihua() {
    showBaihua = !showBaihua;
    try { localStorage.setItem(BAIHUA_KEY, showBaihua?'1':'0'); } catch(e) {}
    const btn = document.getElementById('btn-baihua');
    if (btn) btn.classList.toggle('active', showBaihua);
    if (showBaihua) {
        if (!baihuaData) await loadBaihua(currentSutra.id);
        applyBaihua();
    } else {
        removeBaihua();
    }
}

async function loadBaihua(tid) {
    try {
        const r = await fetch(`../data/modern-translation/${tid}.json`);
        if (r.ok) {
            baihuaData = await r.json();
        } else {
            baihuaData = null;
        }
    } catch(e) { baihuaData = null; }
}

function applyBaihua() {
    if (!baihuaData) {
        // 无白话数据
        const tip = document.createElement('div');
        tip.className = 'baihua-tip';
        tip.id = 'baihua-tip';
        tip.innerHTML = '📘 本经白话翻译正在整理中。目前已提供白话：<b>心经、金刚经、阿弥陀经、八大人觉经、佛遗教经</b>。';
        const textEl = document.getElementById('sutra-text');
        if (textEl) textEl.insertBefore(tip, textEl.firstChild);
        return;
    }
    const textEl = document.getElementById('sutra-text');
    if (!textEl) return;
    // 移除旧的，重新插入
    removeBaihua();

    // 先加导读卡
    if (baihuaData.intro) {
        const intro = document.createElement('div');
        intro.className = 'baihua-intro';
        intro.id = 'baihua-intro';
        intro.innerHTML = `<div class="baihua-head">📘 白话导读${baihuaData.title?` · ${esc(baihuaData.title)}`:''}</div>
            <div class="baihua-intro-text">${esc(baihuaData.intro)}</div>`;
        textEl.insertBefore(intro, textEl.firstChild);
    }

    // 全经文本用于匹配位置
    const allParas = textEl.querySelectorAll('.sutra-content');
    const translations = baihuaData.translations || [];
    translations.forEach((tr, idx) => {
        const preview = (tr.original_preview || '').replace(/\s+/g,'');
        // 找最匹配的段落
        let target = null;
        for (const p of allParas) {
            const pt = (p.textContent || '').replace(/\s+/g,'');
            if (pt.includes(preview.slice(0,12)) || preview.includes(pt.slice(0,12))) { target = p; break; }
        }
        // 没有精确匹配就按位置比例找
        if (!target && allParas.length) {
            const ratio = idx / Math.max(1, translations.length-1);
            const ti = Math.min(allParas.length-1, Math.round(ratio * (allParas.length-1)));
            target = allParas[ti];
        }
        if (target) {
            const card = document.createElement('div');
            card.className = 'baihua-card';

// 将段落中词典词条自动加下划线可点击（仅对 DICT_AUTO_SET 中的术语词加下划线，避免人物名/地名全部划线）
function linkDictTerms(simpText, origText) {
    if (!DICT_MAP || !DICT_MAP.size) return origText;
    const n = simpText.length;
    const out = [];
    let i = 0;
    while (i < n) {
        let matched = null, matchLen = 0;
        // 从长到短尝试匹配
        for (let L = Math.min(DICT_MAX_LEN, n - i); L >= 2; L--) {
            const seg = simpText.substr(i, L);
            if (DICT_AUTO_SET.has(seg) && DICT_MAP.has(seg)) { matched = DICT_MAP.get(seg); matchLen = L; break; }
        }
        if (matched) {
            const chunk = origText.substr(i, matchLen);
            out.push(`<span class="dict-term" data-term="${esc(matched.name)}" title="点击查词典：${esc(matched.name)}">${esc(chunk)}</span>`);
            i += matchLen;
        } else {
            out.push(esc(origText[i]));
            i += 1;
        }
    }
    return out.join('');
}

// 渲染单段：繁简逐字对齐后高亮锚点句并插入「注」标记；同时自动识别佛学名词加词典链接
function renderParagraph(p) {
    if (!p) return '';
    const noteSet = (currentSutra && NOTES[currentSutra.id]) ? NOTES[currentSutra.id] : null;
    const simp = toSimp(p);

    // 第一步：将文本切成"普通文本"和"学者注高亮片段"区间
    const seg = []; // [{s,e,isNote,anchor}]
    if (noteSet) {
        const hits = [];
        noteSet.anchors.forEach(a => {
            let from = 0, idx;
            while ((idx = simp.indexOf(a.text, from)) !== -1) {
                hits.push({ s: idx, e: idx + a.text.length, a });
                from = idx + a.text.length;
            }
        });
        hits.sort((x,y)=>x.s-y.s);
        let cur = 0;
        hits.forEach(h => {
            if (h.s < cur) return;
            if (h.s > cur) seg.push({s:cur, e:h.s, isNote:false});
            seg.push({s:h.s, e:h.e, isNote:true, a:h.a});
            cur = h.e;
        });
        if (cur < p.length) seg.push({s:cur, e:p.length, isNote:false});
    } else {
        seg.push({s:0, e:p.length, isNote:false});
    }

    // 第二步：每个片段内：若是注片段加学者标记；否则应用词典词条自动链接
    let out = '';
    seg.forEach(part => {
        const partOrig = p.slice(part.s, part.e);
        const partSimp = simp.slice(part.s, part.e);
        if (part.isNote) {
            out += `<span class="scholar-hi">${linkDictTerms(partSimp, partOrig)}</span>`;
            out += `<sup class="scholar-mark" data-note="${encodeURIComponent(JSON.stringify(part.a))}" title="查看学者解读">注</sup>`;
        } else {
            out += linkDictTerms(partSimp, partOrig);
        }
    });
    return out;
}

function showNote(json) {
    const a = JSON.parse(decodeURIComponent(json));
    const box = document.getElementById('note-pop');
    // 学者注内容自动添加词典链接
    const linkify = (text)=>{
      if(!text) return '';
      // 用 linkDictTerms 同样算法做简单词链
      const out = [];
      let i=0;
      while(i<text.length){
        let matched = null, matchLen=1;
        for(let L=DICT_MAX_LEN; L>=2; L--){
          if(i+L > text.length) continue;
          const seg = text.substr(i, L);
          if(DICT_AUTO_SET.has(seg) && DICT_MAP.has(seg)){ matched = DICT_MAP.get(seg); matchLen=L; break; }
        }
        if(matched){
          out.push(`<span class="dict-term-in-note" data-term="${esc(matched.name)}">${esc(text.substr(i,matchLen))}</span>`);
          i += matchLen;
        } else {
          out.push(esc(text[i]));
          i += 1;
        }
      }
      return out.join('');
    };
    box.innerHTML = `<div class="flex justify-between items-start mb-2">
            <div class="text-sm text-primary font-bold">「${a.text}」· 学者解读</div>

const CAT_SIMP = {
  '經集部类':'经集部类','史傳部类':'史传部类','華嚴部类':'华严部类','法華部类':'法华部类',
  '論集部类':'论集部类','寶積部类':'宝积部类','本緣部类':'本缘部类','淨土宗部类':'净土宗部类',
  '禪宗部类':'禅宗部类','毘曇部类':'毗昙部类','中觀部类':'中观部类','事彙部类':'事汇部类',
  '敦煌寫本部类':'敦煌写本部类'
};
const CAT_ORDER = ['阿含部类','本缘部类','般若部类','法华部类','华严部类','宝积部类','涅槃部类','大集部类','经集部类','律部类','毗昙部类','中观部类','瑜伽部类','论集部类','史传部类','事汇部类','密教部类','净土宗部类','禅宗部类','敦煌写本部类'];
// 朝代繁体归一 + 顺序
const DYNASTY_SIMP = {
  '後漢':'后汉','西晉':'西晋','東晉':'东晋','劉宋':'刘宋','元魏':'元魏','苻秦':'苻秦',
  '大隋':'隋','趙宋':'宋','北涼':'北凉','蕭齊':'萧齐','蕭梁':'梁'
};
const DYNASTY_ORDER = ['后汉','吴','曹魏','西晋','东晋','苻秦','姚秦','北凉','萧齐','梁','刘宋','元魏','高齐','陈','隋','唐','周','宋','辽','金','元','明','清','失译'];
const TR_CH = {'經':'经','傳':'传','華':'华','論':'论','寶':'宝','積':'积','緣':'缘','淨':'净','禪':'禅','毘':'毗','曇':'昙','觀':'观','彙':'汇','寫':'写','嚴':'严','後':'后','晉':'晋','東':'东','劉':'刘','趙':'赵','齊':'齐','蕭':'萧','涼':'凉','譯':'译','門':'门','實':'实','賢':'贤','難':'难','護':'护','義':'义','淨':'净','連':'连','揵':'揵','陀':'陀'};
function simpCh(s){ return String(s||'').replace(/[經傳華論寶積緣淨禪毘曇觀彙寫嚴後晉東劉趙齊蕭涼譯]/g, ch => TR_CH[ch] || ch); }
function simpCat(c){ return CAT_SIMP[c] || simpCh(c) || c; }
function catsOf(s){ return String(s.category||'').split(/[,，]/).map(x=>x.trim()).filter(Boolean).map(simpCat); }
function primaryCat(s){ const cs=catsOf(s); if(!cs.length) return '其他部类'; return cs.find(c=>c!=='敦煌写本部类') || cs[0]; }
function extraCats(s){ const cs=catsOf(s); const p=primaryCat(s); return cs.filter(c=>c!==p); }
function catLabel(c){ return c.replace(/部类$/,''); }
const TR_CAT = {'經':'经','傳':'传','華':'华','論':'论','寶':'宝','積':'积','緣':'缘','淨':'净','禪':'禅','毘':'毗','曇':'昙','觀':'观','彙':'汇','寫':'写','嚴':'严'};
function simpAll(s){ return String(s||'').replace(/[經傳華論寶積緣淨禪毘曇觀彙寫嚴]/g, ch => TR_CAT[ch] || ch); }

// 从 translator 字段解析"朝代 + 译师名"
// translator 形如："唐 玄奘譯"、"西晉 竺法護譯"、"失譯"、"鸠摩罗什"，dynasty 可能已独立给
function parseDynasty(s){
  let d = simpCh(s.dynasty || '').trim();
  let t = simpCh(s.translator || '').trim();
  if(!t) t='失译';
  if(!d){
    // 从 translator 前缀尝试解析
    const m = t.match(/^([^\s]{1,3}\s)/);
    if(m){
      const cand = m[1].trim();
      if(['后汉','吴','曹魏','西晋','东晋','苻秦','姚秦','北凉','萧齐','梁','刘宋','元魏','高齐','陈','隋','唐','周','宋','辽','金','元','明','清'].includes(cand) || /^[\u4e00-\u9fff]{1,2}$/.test(cand) && cand.length<=2){
        // 找匹配
        const known = DYNASTY_ORDER.find(kd => kd.startsWith(cand) || cand.includes(kd));
        if(known){ d=known; t=t.replace(m[1],'').trim(); }
      }
    }
  }
  if(!d) d='失译';
  d = DYNASTY_SIMP[d] || d;
  // 清理译师名里的"译"字
  t = t.replace(/譯$/,'').replace(/译$/,'').trim();
  return { dynasty: d, trans_name: t || '失译' };
}

let TREE = [];
let VIEW_MODE = 'tree';
const TREE_OPEN = new Set(); // 'c:阿含' / 'v:阿含|T01'，记忆持久化
let DYNASTY_FILTER = '';
let TRANS_FILTER = '';
let DYNASTY_LIST = [];   // [{dynasty, name}]
let TRANS_MAP = {};     // dynasty -> [translator names]
const LS_OPEN_KEY = 'fo_tree_open_v2';

function loadTreeState(){
  try{
    const s = localStorage.getItem(LS_OPEN_KEY);
    if(s){
      JSON.parse(s).forEach(k=>TREE_OPEN.add(k));
    }
  }catch(e){}
}
function saveTreeState(){
  try{ localStorage.setItem(LS_OPEN_KEY, JSON.stringify([...TREE_OPEN])); }catch(e){}
}

function buildCatalog(){
  // 先给每部经解析朝代/译者
  allSutras.forEach(s=>{
    const p = parseDynasty(s);
    s._dynasty = p.dynasty;
    s._trans = p.trans_name;
  });
  const m = new Map();
  const dySet = new Set();
  const trMap = {}; // d -> Set(trans)
  allSutras.forEach(s=>{
    const cat = primaryCat(s);
    const vol = s.vol || '未分册';
    if(!m.has(cat)) m.set(cat, new Map());
    const vm = m.get(cat);
    if(!vm.has(vol)) vm.set(vol, []);
    vm.get(vol).push(s);
    dySet.add(s._dynasty);
    if(!trMap[s._dynasty]) trMap[s._dynasty] = new Set();
    trMap[s._dynasty].add(s._trans);
  });
  const cats = [...m.keys()].sort((a,b)=>{
    const ia = CAT_ORDER.indexOf(a), ib = CAT_ORDER.indexOf(b);
    if(ia>=0 && ib>=0) return ia-ib;
    if(ia>=0) return -1;
    if(ib>=0) return 1;
    return m.get(b).size - m.get(a).size;
  });
  TREE = cats.map(cat=>{
    const vm = m.get(cat);
    const vols = [...vm.keys()].sort();
    vols.forEach(v=> vm.get(v).sort((a,b)=> String(a.id||'').localeCompare(String(b.id||''))));
    return { cat, total: [...vm.values()].reduce((n,a)=>n+a.length,0),
             vols: vols.map(v=>({ vol:v, list:vm.get(v) })) };
  });
  // 朝代顺序
  DYNASTY_LIST = [...dySet].sort((a,b)=>{
    const ia=DYNASTY_ORDER.indexOf(a), ib=DYNASTY_ORDER.indexOf(b);
    if(ia>=0 && ib>=0) return ia-ib;
    if(ia>=0) return -1;
    if(ib>=0) return 1;
    return a.localeCompare(b,'zh');
  });
  TRANS_MAP = {};
  Object.keys(trMap).forEach(d=>{
    TRANS_MAP[d] = [...trMap[d]];
  });
  // 译者计数
  const trCount = {};
  allSutras.forEach(s=>{ const k=s._dynasty+'|'+s._trans; trCount[k]=(trCount[k]||0)+1; });
  Object.keys(TRANS_MAP).forEach(d=>{
    TRANS_MAP[d].sort((a,b)=>{
      if(a==='失译') return 1; if(b==='失译') return -1;
      return (trCount[d+'|'+b]||0) - (trCount[d+'|'+a]||0) || a.localeCompare(b,'zh');
    });
  });
}

function matchKw(s, kw){
  return (s.title||'').toLowerCase().includes(kw)
      || (s._trans||'').toLowerCase().includes(kw)
      || (s.translator||'').toLowerCase().includes(kw)
      || (s._dynasty||'').includes(kw)
      || (s.id||'').toLowerCase().includes(kw);
}

function passFilter(s){
  if(DYNASTY_FILTER && s._dynasty !== DYNASTY_FILTER) return false;
  if(TRANS_FILTER && s._trans !== TRANS_FILTER) return false;
  return true;
}

function leafEl(s, flat, showCrumb){
  const el = document.createElement('div');
  el.className = 'sutra-item tleaf' + (flat ? ' flat' : '');
  el.dataset.id = s.id;
  if(currentSutra && String(currentSutra.id||'').toLowerCase() === String(s.id||'').toLowerCase()) el.classList.add('sel');
  const tags = extraCats(s).map(c=>`<span class="tl-tag">${catLabel(c)}</span>`).join('');
  const crumb = showCrumb ? `<div class="flat-crumb">${catLabel(primaryCat(s))}部${s.vol?' · '+s.vol:''}</div>` : '';
  el.innerHTML = `${crumb}<div style="display:flex;justify-content:space-between;gap:6px;align-items:center" class="tl-row">
      <span class="tl-title">${s.title}${tags}</span>
      <span class="tl-meta">${s._dynasty&&s._dynasty!=='失译'?s._dynasty:''}${(s._trans&&s._trans!=='失译')?s._trans.substring(0,4):''}</span></div>`;
  el.addEventListener('click', ()=> loadSutra(s));
  return el;
}

function populateFilterSelects(){
  const dySel = document.getElementById('filter-dynasty');
  const trSel = document.getElementById('filter-translator');
  dySel.innerHTML = '<option value="">全部朝代</option>' +
    DYNASTY_LIST.map(d=>`<option value="${d}"${d===DYNASTY_FILTER?' selected':''}>${d==='失译'?'失译/佚名':d}</option>`).join('');
  // 译者下拉：若选了朝代则只列该朝代，否则列top60
  let list = [];
  if(DYNASTY_FILTER){
    list = TRANS_MAP[DYNASTY_FILTER] || [];
  } else {
    const cnt = {};
    allSutras.forEach(s=>{ if(!TRANS_FILTER || s._trans===TRANS_FILTER) cnt[s._trans]=(cnt[s._trans]||0)+1; });
    list = Object.keys(cnt).filter(t=>t!=='失译').sort((a,b)=>cnt[b]-cnt[a]).slice(0,80);
  }
  trSel.innerHTML = '<option value="">全部译者</option>' +
    list.map(t=>`<option value="${t}"${t===TRANS_FILTER?' selected':''}>${t}</option>`).join('') +
    (list.length===0 ? '' : '<option value="__shiyi__"'+(TRANS_FILTER==='失译'?' selected':'')+'>失译/佚名</option>');
  // 渲染当前筛选chip
  const chipBox = document.getElementById('filter-active');
  const chips = [];
  if(DYNASTY_FILTER) chips.push(`<span class="filter-chip">朝代：${DYNASTY_FILTER}<span class="x" data-f="d">×</span></span>`);
  if(TRANS_FILTER) chips.push(`<span class="filter-chip">译者：${TRANS_FILTER}<span class="x" data-f="t">×</span></span>`);
  chipBox.innerHTML = chips.join('');
  chipBox.querySelectorAll('.x').forEach(b=>b.addEventListener('click',()=>{
    if(b.dataset.f==='d'){ DYNASTY_FILTER=''; TRANS_FILTER=''; }
    else { TRANS_FILTER=''; }
    populateFilterSelects(); renderCatalog();
  }));
}

function initFilters(){
  loadTreeState();
  buildCatalog();
  populateFilterSelects();
  document.querySelectorAll('.cat-seg-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      VIEW_MODE = b.dataset.mode;
      document.querySelectorAll('.cat-seg-btn').forEach(x=>x.classList.toggle('active', x===b));
      renderCatalog();
    });
  });
  document.getElementById('tree-expand').addEventListener('click', ()=>{
    VIEW_MODE = 'tree';
    document.querySelectorAll('.cat-seg-btn').forEach(x=>x.classList.toggle('active', x.dataset.mode==='tree'));
    TREE.forEach(t=>{ TREE_OPEN.add('c:'+t.cat); t.vols.forEach(v=>TREE_OPEN.add('v:'+t.cat+'|'+v.vol)); });
    saveTreeState(); renderCatalog();
  });
  document.getElementById('tree-collapse').addEventListener('click', ()=>{
    TREE_OPEN.clear(); saveTreeState(); renderCatalog();
  });
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', ()=>{
    clearTimeout(searchTimer); searchTimer = setTimeout(renderCatalog, 180);
  });
  document.getElementById('filter-dynasty').addEventListener('change', e=>{
    DYNASTY_FILTER = e.target.value;
    TRANS_FILTER = ''; // 切朝代重置译者
    populateFilterSelects(); renderCatalog();
  });
  document.getElementById('filter-translator').addEventListener('change', e=>{
    const v = e.target.value;
    TRANS_FILTER = v==='__shiyi__' ? '失译' : v;
    populateFilterSelects(); renderCatalog();
  });
  renderCatalog();
}

function renderCatalog(){
  const container = document.getElementById('sutra-tree');
  const kw = document.getElementById('search-input').value.trim().toLowerCase();
  container.innerHTML = '';
  const statsEl = document.getElementById('list-stats');

  // 经筛选过滤
  const filteredSutras = allSutras.filter(s => passFilter(s) && (!kw || matchKw(s, kw)));

  if(kw){
    if(!filteredSutras.length){ container.innerHTML = '<div class="text-center text-ink/50 py-8">未找到匹配的经典</div>'; }
    else filteredSutras.slice(0,300).forEach(s => container.appendChild(leafEl(s, true, true)));
    statsEl.textContent = `命中 ${filteredSutras.length} 部经${DYNASTY_FILTER||TRANS_FILTER?'（已筛选）':''}`;
    return;
  }
  if(VIEW_MODE === 'flat'){
    filteredSutras.forEach(s => container.appendChild(leafEl(s, true, false)));
    statsEl.textContent = `共 ${filteredSutras.length} 部经 · 平铺列表${DYNASTY_FILTER||TRANS_FILTER?'（已筛选）':''}`;
    return;
  }
  // 树形：按筛选后的集合重建可见子集
  let visibleTotal = 0;
  TREE.forEach(t=>{
    // 此部类下，按筛选过滤后的册
    const visibleVols = t.vols.map(v=>({...v, list:v.list.filter(passFilter)})).filter(v=>v.list.length>0);
    if(!visibleVols.length) return;
    const catTotal = visibleVols.reduce((n,v)=>n+v.list.length,0);
    visibleTotal += catTotal;
    // 若有筛选条件，自动展开该部类
    const autoOpen = !!(DYNASTY_FILTER || TRANS_FILTER);
    const open = autoOpen || TREE_OPEN.has('c:'+t.cat);
    const head = document.createElement('div');
    head.className = 'tcat' + (open ? ' open' : '');
    head.innerHTML = `<span class="caret">▶</span><span class="truncate">${catLabel(t.cat)}部</span><span class="cnt">${catTotal}</span>`;
    head.addEventListener('click', ()=>{
      const k='c:'+t.cat;
      if(TREE_OPEN.has(k)) TREE_OPEN.delete(k); else TREE_OPEN.add(k);
      saveTreeState(); renderCatalog();
    });
    container.appendChild(head);
    if(!open) return;
    visibleVols.forEach(v=>{
      const vkey = 'v:'+t.cat+'|'+v.vol;
      const vopen = autoOpen || TREE_OPEN.has(vkey);
      const vh = document.createElement('div');
      vh.className = 'tvol' + (vopen ? ' open' : '');
      vh.innerHTML = `<span class="caret">▶</span><span>${v.vol}</span><span class="cnt">${v.list.length}</span>`;
      vh.addEventListener('click', (ev)=>{
        ev.stopPropagation();
        if(TREE_OPEN.has(vkey)) TREE_OPEN.delete(vkey); else TREE_OPEN.add(vkey);
        saveTreeState(); renderCatalog();
      });
      container.appendChild(vh);
      if(vopen) v.list.forEach(s => container.appendChild(leafEl(s, false, false)));
    });
  });
  if(!visibleTotal){
    container.innerHTML = '<div class="text-center text-ink/50 py-8">当前筛选条件下无经典，请清空筛选</div>';
  }
  statsEl.textContent = `显示 ${visibleTotal} / ${allSutras.length} 部经 · ${TREE.length} 大部类 · 点击逐级展开`;
}

// 5. 加载单部经文（用户点击才加载，不预加载）
async function loadSutra(meta) {
    // 高亮当前选中
    document.querySelectorAll('.sutra-item').forEach(i => i.classList.remove('sel'));
    const curEl = document.querySelector(`[data-id="${meta.id}"]`);
    if (curEl) { curEl.classList.add('sel'); curEl.scrollIntoView({block:'nearest'}); }
    
    // 先检查缓存
    const cacheKey = CACHE_KEY + meta.id;
    let sutraData = null;
    try {
        const cached = localStorage.getItem(cacheKey);
        if(cached) {
            const { data, timestamp } = JSON.parse(cached);
            if(Date.now() - timestamp < CACHE_EXPIRY) {
                sutraData = data;
                console.log('从缓存加载：' + meta.title);
            }
        }
    } catch(e) {}

    // 显示加载状态
    const contentArea = document.getElementById('content-area');
    contentArea.innerHTML = `
        <div class="text-center py-20">
            <div class="text-4xl mb-4 animate-pulse">📖</div>
            <p class="text-ink/70">正在加载《${meta.title}》...</p>
            <p class="text-sm text-ink/40 mt-2">${meta.word_count}字，首次加载需几秒，后续秒开</p>
        </div>
    `;
    document.getElementById('load-more').classList.add('hidden');

    // 没有缓存就从服务器拉
    if(!sutraData) {
        try {
            const res = await fetch(`../sutras/${meta.file}?v=2`);
            sutraData = await res.json();
            // 写入缓存
            try {
                localStorage.setItem(cacheKey, JSON.stringify({
                    data: sutraData,
                    timestamp: Date.now()
                }));
            } catch(e) {
                console.warn('缓存写入失败（存储空间不足），不影响阅读');
            }
        } catch(e) {
            contentArea.innerHTML = `<div class="text-center py-20 text-red-600">加载失败，请刷新重试</div>`;
            return;
        }
    }

    currentSutra = sutraData;
    // 读经辅助重置（切换新经时重新抓取原文）
    if(window.__readingAid && window.__readingAid.reset) window.__readingAid.reset();
    // 补一下归一化字段（sutraData 来自单经 JSON，没有 _dynasty/_trans）
    if(allSutras && allSutras.length){
      const metaHit = allSutras.find(s=>s.id===sutraData.id);
      if(metaHit){ sutraData._dynasty=metaHit._dynasty; sutraData._trans=metaHit._trans; }
    }
    if(!sutraData._dynasty){ const p=parseDynasty(sutraData); sutraData._dynasty=p.dynasty; sutraData._trans=p.trans_name; }
    loadedChapters = 0;
    updateKepanBtn();
    // 加载跨页关联数据（若未加载）
    ensureCrossLoaded().then(()=>{
      // 数据到位后给段加科判标签（等DOM渲染完）
      setTimeout(annotateParaKepanTags, 200);
      updateParallelBar();
    });
    // 渲染经文头部信息
    let headerHtml = `
        <div class="mb-8 pb-6 border-b-2 border-primary/20">
            <h1 class="text-3xl font-bold text-ink mb-2">${sutraData.title || sutraData.sutra_title}</h1>
            <div class="flex gap-4 text-sm text-ink/70 flex-wrap">
                <span>📜 ${sutraData.id?.toUpperCase()}</span>
                <span>👤 ${(sutraData._trans||sutraData.translator||'失译')}${sutraData._dynasty&&sutraData._dynasty!=='失译'?'（'+sutraData._dynasty+'）':(sutraData.dynasty?'（'+sutraData.dynasty+'）':'')}</span>
                <span>📚 ${sutraData.vol}册 · ${sutraData.juan_count || sutraData.content.length}卷</span>
                <span>📖 ${simpAll(sutraData.category || '')}</span>
                <span>✍️ ${(sutraData.word_count||sutraData.content.reduce((sum,c)=>sum+(c.text||'').length,0)).toLocaleString()} 字</span>
            </div>`;
    // 异译对照提示条（由ensureCross加载后updateParallelBar更新，先占位）
    headerHtml += `<div id="parallel-bar"></div>`;
    headerHtml += `</div>`;
    contentArea.innerHTML = headerHtml + `
        <div class="read-toolbar">
            <button id="btn-overview" title="返回部类总览"><i class="fa fa-th-large"></i> <span class="rt-label">部类总览</span></button>
            <button id="toc-toggle" title="章节目录"><i class="fa fa-list-ul"></i> <span class="rt-label">章节目录</span></button>
            <span class="rt-label" style="margin-left:.5rem">字号</span>
            <button data-fs="sm">小</button>
            <button data-fs="md" class="active">中</button>
            <button data-fs="lg">大</button>
            <button data-fs="xl">特大</button>
            <button id="btn-baihua" title="白话文翻译/导读" class="${showBaihua?'active':''}"><i class="fa fa-book"></i> <span class="rt-label">白话</span></button>
            <button id="bookmark-btn" title="添加书签" style="margin-left:.5rem"><i class="fa fa-bookmark"></i> <span class="rt-label">书签</span></button>
            <button id="btn-kepan" title="本科判结构" style="display:none;margin-left:.3rem"><i class="fa fa-sitemap"></i> <span class="rt-label">科判</span></button>
            <button id="study-btn" title="我的收藏与笔记"><i class="fa fa-star"></i> <span class="rt-label">学术工具</span></button>
            <span class="rt-label" id="read-progress" style="margin-left:auto"></span>
        </div>
        <div id="toc-panel" class="hidden mb-4"></div>
        <div id="sutra-text" class="sutra-container"></div>
    `;
    // 绑定阅读工具条
    document.getElementById('btn-overview')?.addEventListener('click', () => { renderOverview(); window.scrollTo({top:0,behavior:'smooth'}); });
    document.getElementById('toc-toggle')?.addEventListener('click', () => {
        buildToc();
        document.getElementById('toc-panel')?.classList.toggle('hidden');
    });
    document.querySelectorAll('.read-toolbar button[data-fs]').forEach(b =>
        b.addEventListener('click', () => applyFs(b.dataset.fs)));
    applyFs(curFs);
    // 白话按钮
    document.getElementById('btn-baihua')?.addEventListener('click', toggleBaihua);
    // 若默认开启白话
    if (showBaihua) {
        (async () => {
            await loadBaihua(currentSutra.id);
            // 等章节首屏加载后再插入
            setTimeout(applyBaihua, 500);
        })();
    }
    // 先加载前N章
    loadMoreChapters();
    // 监听滚动，懒加载更多章节
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if(entry.isIntersecting && loadedChapters < currentSutra.content.length) {
                loadMoreChapters();
            }
        });
    }, { rootMargin: '500px' }); // 提前500px加载
    observer.observe(document.getElementById('load-more'));
}

// 6. 分批加载章节（大经如大般若经不会一次渲染所有DOM）
function loadMoreChapters() {
    if(!currentSutra) return;
    const textContainer = document.getElementById('sutra-text');
    const end = Math.min(loadedChapters + CHAPTERS_PER_PAGE, currentSutra.content.length);
    for(let i = loadedChapters; i < end; i++) {
        const chap = currentSutra.content[i];
        const chapDiv = document.createElement('div');
        chapDiv.id = 'chap-' + i;
        chapDiv.className = 'sutra-chapter';
        const paras = (chap.text || '').split(/\n+/).filter(Boolean);
        const parasHtml = paras.map((p, pIdx) => {
            const trimmed = p.trim();
            if (!trimmed) return '';
            const pid = paraId(currentSutra.id, i, pIdx);
            const hasFav = favs.some(f=>f.pid===pid);
            const hasNote = notes.some(n=>n.pid===pid);
            return `<div class="para-wrap" id="${pid}-wrap">
                <p class="sutra-content" id="${pid}">${renderParagraph(trimmed)}</p>
                <span class="para-tools">
                    <button class="pt-fav ${hasFav?'on':''}" onclick="toggleFav('${pid}')" title="${hasFav?'取消收藏':'收藏'}">${hasFav?'★':'☆'}</button>
                    <button class="pt-note ${hasNote?'on':''}" onclick="openNoteEditor('${pid}')" title="笔记">📝${hasNote?'<span class="note-dot"></span>':''}</button>
                    <button onclick="citePara('${pid}')" title="复制引用">📋</button>
                </span>
            </div>`;
        }).join('');
        chapDiv.innerHTML = `
            <div class="chapter-title">${chap.chapter || chap.title || ''}</div>
            <div>${parasHtml}</div>
        `;
        textContainer.appendChild(chapDiv);
    }
    loadedChapters = end;
    // 给新加载的段落标注科判标签
    if(window.CROSS_LOADED) annotateParaKepanTags();
    // 更新阅读进度
    const progEl = document.getElementById('read-progress');
    if(progEl) progEl.textContent = `已读 ${loadedChapters}/${currentSutra.content.length} 章`;
    // 显示/隐藏加载更多按钮
    const loadMore = document.getElementById('load-more');
    if(loadedChapters < currentSutra.content.length) {
        loadMore.classList.remove('hidden');
        document.getElementById('load-more-btn').textContent = `继续加载后续内容（${loadedChapters}/${currentSutra.content.length}）`;
    } else {
        loadMore.classList.add('hidden');
        // 全文加载完提示
        if(currentSutra.content.length > CHAPTERS_PER_PAGE) {
            const endTip = document.createElement('div');
            endTip.className = 'text-center text-ink/40 py-8 mt-8 border-t border-paper';
            endTip.textContent = '—— 全文完 ——';
            textContainer.appendChild(endTip);
        }
    }
}

// 词典弹窗
function showDictTerm(termName, anchorEl) {
    const term = DICT_MAP.get(termName);
    const pop = document.getElementById('dict-pop');
    if (!term) { pop.classList.add('hidden'); return; }
    const catName = term.category || '术语';
    const def = term.definition || term.desc || '暂无详细释义';
    pop.innerHTML = `
        <span class="dt-close" onclick="closeDict()">×</span>
        <div><span class="dt-name">${esc(term.name)}</span><span class="dt-type">${esc(catName)}</span></div>
        <div class="dt-desc">${esc(def.length>240 ? def.slice(0,240)+'…' : def)}</div>
        <div class="text-right mt-2"><a href="dict.html?q=${encodeURIComponent(term.name)}" target="_blank" class="text-xs text-amber-700 hover:underline">在大词典中查看 →</a></div>
    `;
    pop.classList.remove('hidden');
    // 定位
    const rect = anchorEl.getBoundingClientRect();
    let top = rect.bottom + window.scrollY + 6;
    let left = rect.left + window.scrollX;
    const popW = 340;
    if (left + popW > window.scrollX + window.innerWidth - 10) left = window.scrollX + window.innerWidth - popW - 10;
    if (top + 240 > window.scrollY + window.innerHeight) top = rect.top + window.scrollY - 240;
    pop.style.top = top + 'px';
    pop.style.left = Math.max(10, left) + 'px';
}
function closeDict() { document.getElementById('dict-pop').classList.add('hidden'); }

// 划词查词典：选中文字后在光标位置显示「查词典」按钮
document.addEventListener('mouseup', e => {
    if (e.target.closest('#dict-pop') || e.target.closest('input,textarea')) return;
    setTimeout(() => {
        const sel = window.getSelection();
        const text = sel ? sel.toString().trim() : '';
        removeSelBtn();
        if (!text || text.length < 2 || text.length > 12) return;
        // 去标点
        const key = text.replace(/[，。、；：！？「」『』（）()\s.,;!?\[\]\""'']/g,'');
        let hit = null;
        if (DICT_MAP.has(key)) hit = key;
        else {
            // 尝试简体/包含匹配
            const simp = toSimp(key);
            for (const k of DICT_MAP.keys()) {
                if (k === simp || k === key || k.includes(key) || simp.includes(k)) { hit = k; break; }
            }
        }
        if (!hit) return;
        const range = sel.getRangeAt(0);
        const rect = range.getBoundingClientRect();
        const btn = document.createElement('button');
        btn.id = 'dict-sel-btn';
        btn.textContent = `📖 查「${hit.length > 6 ? hit.slice(0,6)+'…' : hit}」`;
        btn.style.cssText = `position:absolute;top:${rect.bottom + window.scrollY + 4}px;left:${rect.left + window.scrollX}px;background:#8B4513;color:#fff;border:none;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.2);`;
        btn.onclick = (ev) => {
            // 伪造一个anchorEl
            const span = document.createElement('span');
            span.getBoundingClientRect = () => rect;
            showDictTerm(hit, span);
            removeSelBtn();
            window.getSelection().removeAllRanges();
            ev.stopPropagation();
        };
        document.body.appendChild(btn);
    }, 10);
});
document.addEventListener('mousedown', e => { if(!e.target.closest('#dict-sel-btn')) removeSelBtn(); });
function removeSelBtn(){ const b=document.getElementById('dict-sel-btn'); if(b) b.remove(); }

// ===== 手机端：左侧经目可折叠 =====
(function () {
  if (window.matchMedia('(min-width: 768px)').matches) return;
  const left = document.querySelector('.w-72.flex-shrink-0');
  const right = document.querySelector('.flex-1');
  if (!left || !right) return;
  // 包裹成上下结构
  const parent = left.parentElement;
  parent.classList.add('mobile-layout');
  // 添加切换按钮
  const toggle = document.createElement('button');
  toggle.id = 'sutra-list-toggle';
  toggle.innerHTML = '📖 经目 <i class="fa fa-chevron-down" style="font-size:11px"></i>';
  toggle.style.cssText='display:block;width:100%;padding:10px;background:#8B4513;color:#F5F0E1;border:0;border-radius:8px;font-size:15px;margin-bottom:8px;cursor:pointer;';
  parent.insertBefore(toggle, left);
  left.style.display = 'none';
  toggle.addEventListener('click', ()=>{
    const open = left.style.display !== 'none';
    left.style.display = open ? 'none' : 'block';
    toggle.innerHTML = open ? '📖 经目 <i class="fa fa-chevron-down" style="font-size:11px"></i>' : '📖 收起经目 <i class="fa fa-chevron-up" style="font-size:11px"></i>';
  });
  // 选中经文后自动收起经目
  document.addEventListener('click', e=>{
    if (e.target.closest('#sutra-tree a, #sutra-tree .sutra-item')) {
      setTimeout(()=>{ left.style.display='none'; toggle.innerHTML='📖 经目 <i class="fa fa-chevron-down" style="font-size:11px"></i>'; },100);
    }
  });
})();
