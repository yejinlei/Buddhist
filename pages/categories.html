<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>部类总览 - 佛学本体论</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/tailwind.min.css">
    <link rel="stylesheet" href="../css/tailwind-extra.css">
    <link rel="stylesheet" href="../css/custom.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/tailwind-fixes.css">
    <style>
        body { font-family: -apple-system, "Noto Serif SC", "Songti SC", serif; background-color: #F5F0E1; color: #2C1810; }
        .nav-active { background-color: rgba(184,134,11,0.2); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d4c8b0; border-radius: 3px; }
        .cat-tree-head { display:flex; align-items:center; gap:10px; padding:12px 16px; background:linear-gradient(90deg,#fdf8ec,#fff); border:1px solid #e5d9c3; border-radius:12px; cursor:pointer; margin-bottom:6px; user-select:none; transition:all .15s; }
        .cat-tree-head:hover { background:#f5ecd0; box-shadow:0 4px 12px rgba(139,69,19,.08); }
        .cat-tree-head .t-caret { transition:transform .18s; font-size:11px; color:#B8860B; width:14px; flex-shrink:0; }
        .cat-tree-head.open .t-caret { transform:rotate(90deg); }
        .cat-tree-head .t-ico { font-size:22px; }
        .cat-tree-head .t-name { flex:1; font-weight:700; color:#3E2723; font-size:16px; }
        .cat-tree-head .t-desc { font-size:12px; color:#8B4513; font-weight:400; margin-left:6px; }
        .cat-tree-head .t-cnt { font-size:12px; color:#8B4513; background:rgba(184,134,11,.12); border-radius:8px; padding:2px 10px; font-weight:600; }
        .cat-tree-head .t-char { font-size:12px; color:#8B4513; margin-right:4px; }
        .cat-tree-body { margin:0 0 14px 18px; padding:10px 14px; border-left:2px solid #e5d9c3; background:#fffdf7; border-radius:0 8px 8px 0; }
        .cat-tree-body.collapsed { display:none; }
        .vol-chunk { margin-bottom:12px; }
        .vol-chunk:last-child { margin-bottom:0; }
        .vol-chunk-title { font-size:13px; color:#8B4513; padding:4px 8px; font-weight:600; border-bottom:1px dashed #e5d9c3; margin-bottom:6px; display:flex; align-items:center; gap:6px; }
        .vol-chunk-title .v-char { font-size:11px; color:#8B4513; opacity:.7; font-weight:400; margin-left:auto; }
        .vol-sutras { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:4px; }
        .sutra-link { display:block; padding:5px 8px; border-radius:6px; font-size:13px; color:#3E2723; text-decoration:none; transition:all .12s; border:1px solid transparent; }
        .sutra-link:hover { background:rgba(184,134,11,.1); border-color:#e5d9c3; color:#8B4513; }
        .sutra-link .sl-meta { font-size:11px; color:#8B4513; opacity:.65; margin-left:4px; }
        .summary-bar { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin:14px 0 20px; }
        .summary-card { background:#fff; border:1px solid #e5d9c3; border-radius:10px; padding:8px 18px; text-align:center; min-width:100px; }
        .summary-card .num { font-size:22px; font-weight:700; color:#B8860B; }
        .summary-card .lbl { font-size:12px; color:#8B4513; }
        .tool-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:14px; justify-content:center; }
        .tool-row button { padding:6px 14px; border:1px solid #e5d9c3; border-radius:8px; background:#fff; color:#8B4513; cursor:pointer; font-family:inherit; font-size:13px; }
        .tool-row button:hover { background:#fdf8ec; border-color:#B8860B; }
        .jump-btn { font-size:11px; color:#B8860B; background:rgba(184,134,11,.1); border-radius:4px; padding:0 5px; margin-left:6px; text-decoration:none; }
        .jump-btn:hover { background:#B8860B; color:#fff; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-ink text-paper py-4 px-6 flex items-center gap-6 sticky top-0 z-50 flex-wrap">
        <a href="../index.html" class="text-xl font-bold flex items-center gap-2 text-gold"><span>🍃</span> 佛学本体论</a>
        <span class="text-paper/60">|</span>
        <a href="categories.html" class="text-paper font-medium nav-active">部类总览</a>
        <div class="ml-auto flex gap-4 text-sm text-paper/80 flex-wrap">
            <a href="../index.html" class="hover:text-gold">首页</a>
            <a href="categories.html" class="hover:text-gold">部类总览</a>
            <a href="sutras.html" class="hover:text-gold">全藏原典</a>
            <a href="search.html" class="hover:text-gold">全文检索</a>
            <a href="dict.html" class="hover:text-yellow-400">佛学词典</a>
            <a href="parallel.html" class="hover:text-gold">异译对照</a>
            <a href="graph.html" class="hover:text-gold">义理图谱</a>
            <a href="kepan.html" class="hover:text-gold">科判导航</a>
            <a href="panjiao.html" class="hover:text-gold">宗派判教</a>
            <a href="inference.html" class="hover:text-gold">概念推演</a>
            <a href="timeline.html" class="hover:text-gold">译传时间轴</a>
            <a href="translation.html" class="hover:text-gold">佛典译学</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="text-center mb-4">
            <h1 class="text-3xl font-bold text-ink mb-3">大正藏部类总览</h1>
            <p class="text-ink/70">按 <span class="text-primary font-bold" id="cat-count">—</span> 大部类聚合浏览</p>
        </div>
        <div class="summary-bar">
            <div class="summary-card"><div class="num" id="sutra-total">—</div><div class="lbl">部经典</div></div>
            <div class="summary-card"><div class="num" id="chars-total">—</div><div class="lbl">字原文</div></div>
            <div class="summary-card"><div class="num" id="vol-total">—</div><div class="lbl">大正藏册</div></div>
        </div>
        <div class="tool-row">
            <input id="cat-search" type="text" placeholder="搜索部类或经名..." class="border border-primary/20 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-primary/30 text-sm w-60 max-w-full">
            <button id="expand-all">📖 展开全部</button>
            <button id="collapse-all">📕 折叠全部</button>
            <a href="sutras.html" class="jump-btn" style="border:1px solid #e5d9c3;padding:6px 12px;border-radius:8px;font-size:13px;color:#8B4513;">前往树形经目 →</a>
        </div>

        <div id="cat-tree"></div>
    </div>

    <script>
        let ALL = [];
        let CATS = [];
        const TR_CH = {'經':'经','傳':'传','華':'华','論':'论','寶':'宝','積':'积','緣':'缘','淨':'净','禪':'禅','毘':'毗','曇':'昙','觀':'观','彙':'汇','寫':'写','嚴':'严'};
        const CAT_SIMP = {'經集部类':'经集部类','史傳部类':'史传部类','華嚴部类':'华严部类','法華部类':'法华部类','論集部类':'论集部类','寶積部类':'宝积部类','本緣部类':'本缘部类','淨土宗部类':'净土宗部类','禪宗部类':'禅宗部类','毘曇部类':'毗昙部类','中觀部类':'中观部类','事彙部类':'事汇部类','敦煌寫本部类':'敦煌写本部类'};
        const CAT_ORDER = ['阿含部类','本缘部类','般若部类','法华部类','华严部类','宝积部类','涅槃部类','大集部类','经集部类','律部类','毗昙部类','中观部类','瑜伽部类','论集部类','史传部类','事汇部类','密教部类','净土宗部类','禅宗部类','敦煌写本部类'];
        const CAT_ICO = {
            '阿含部类':'📜','本缘部类':'🌱','般若部类':'✨','法华部类':'🪷','华严部类':'🌌','宝积部类':'💎','涅槃部类':'🔥','大集部类':'📚',
            '经集部类':'📖','律部类':'⚖️','毗昙部类':'🔍','中观部类':'☯️','瑜伽部类':'🧘','论集部类':'📝','史传部类':'🏛️','事汇部类':'🗂️',
            '密教部类':'🕉️','净土宗部类':'🌸','禅宗部类':'🧘‍♂️','敦煌写本部类':'📜'
        };
        const CAT_DESC = {
            '阿含部类':'根本圣典 · 四阿含','本缘部类':'本生·因缘·譬喻','般若部类':'般若系空典','法华部类':'一乘妙法',
            '华严部类':'圆教大法','宝积部类':'菩萨宝积','涅槃部类':'常住佛性','大集部类':'方等大集',
            '经集部类':'诸经丛集','律部类':'戒律三藏','毗昙部类':'说一切有部','中观部类':'龙树空宗',
            '瑜伽部类':'唯识法相','论集部类':'诸论撰述','史传部类':'僧传·史地','事汇部类':'佛学类书',
            '密教部类':'真言密典','净土宗部类':'极乐往生','禅宗部类':'祖师语录','敦煌写本部类':'敦煌遗书'
        };
        function simpCh(s){ return String(s||'').replace(/[經傳華論寶積緣淨禪毘曇觀彙寫嚴]/g, c => TR_CH[c] || c); }
        function simpCat(c){ return CAT_SIMP[c] || simpCh(c); }
        const OPEN = new Set(); // 默认展开部类，不展开册

        async function load() {
            const res = await fetch('../sutras/index-light.json?' + Date.now());
            const raw = await res.json();
            const list = Array.isArray(raw) ? raw : (raw.sutras || []);
            ALL = list.filter(s => s && s.id);
            // 统一部类名 + 拆复合部类（一部经主属第一部类，其他作标签）
            const map = new Map();
            const volSet = new Set();
            ALL.forEach(s => {
                const cats = String(s.category || '未分类').split(/[,，]/).map(x => simpCat(x.trim())).filter(Boolean);
                const prim = cats.length ? (cats.find(c=>c!=='敦煌写本部类') || cats[0]) : '其他部类';
                s._prim = prim; s._other = cats.filter(c=>c!==prim);
                s._dytr = (s.translator||'失译').replace(/譯$/,'').replace(/译$/,'').trim();
                if(s.vol) volSet.add(s.vol);
                if(!map.has(prim)) map.set(prim, new Map());
                const vm = map.get(prim);
                const vol = s.vol || '未分册';
                if(!vm.has(vol)) vm.set(vol, []);
                vm.get(vol).push(s);
            });
            CATS = [...map.entries()].map(([name, vm]) => {
                const vols = [...vm.keys()].sort();
                vols.forEach(v=>vm.get(v).sort((a,b)=>(a.id||'').localeCompare(b.id||'')));
                const sutras = [].concat(...vols.map(v=>vm.get(v)));
                return { name, vols: vols.map(v=>({vol:v, list:vm.get(v)})), sutras, total: sutras.length };
            }).sort((a,b)=>{
                const ia=CAT_ORDER.indexOf(a.name), ib=CAT_ORDER.indexOf(b.name);
                if(ia>=0&&ib>=0) return ia-ib;
                if(ia>=0) return -1; if(ib>=0) return 1;
                return b.total - a.total;
            });
            document.getElementById('cat-count').textContent = CATS.length;
            document.getElementById('sutra-total').textContent = ALL.length.toLocaleString();
            document.getElementById('chars-total').textContent = (ALL.reduce((n,s)=>n+(s.word_count||s.chars||0),0)/10000).toFixed(0)+'万';
            document.getElementById('vol-total').textContent = volSet.size;
            // 默认展开前4个部类
            CATS.slice(0,4).forEach(c=>OPEN.add('c:'+c.name));
            render();
        }

        function volChunkChars(list){
            return (list.reduce((n,s)=>n+(s.word_count||s.chars||0),0)/10000).toFixed(1);
        }

        function render() {
            const kw = (document.getElementById('cat-search').value||'').trim().toLowerCase();
            const root = document.getElementById('cat-tree');
            let html = '';
            let shownCount = 0;
            CATS.forEach(c=>{
                // 过滤：按关键词搜部类名/经名/译者
                let vols = c.vols;
                if(kw){
                    const hitCat = c.name.toLowerCase().includes(kw) || c.name.replace(/部类$/,'').includes(kw);
                    vols = c.vols.map(v=>({...v, list: v.list.filter(s=>
                        hitCat || (s.title||'').toLowerCase().includes(kw) || (s._dytr||'').includes(kw) || (s.id||'').includes(kw)
                    )})).filter(v=>v.list.length>0);
                    if(!vols.length) return;
                }
                shownCount++;
                const totalChars = c.sutras.reduce((n,s)=>n+(s.word_count||s.chars||0),0);
                const cKey = 'c:'+c.name;
                const open = OPEN.has(cKey) || !!kw;
                const label = c.name.replace(/部类$/,'');
                html += `<div class="cat-tree-head${open?' open':''}" data-key="${cKey}">
                    <span class="t-caret">▶</span>
                    <span class="t-ico">${CAT_ICO[c.name]||'📚'}</span>
                    <span class="t-name">${label}部<span class="t-desc">${CAT_DESC[c.name]||''}</span></span>
                    <span class="t-char">${(totalChars/10000).toFixed(0)}万字</span>
                    <span class="t-cnt">${kw?vols.reduce((n,v)=>n+v.list.length,0):c.total} 部</span>
                </div>
                <div class="cat-tree-body${open?'':' collapsed'}" data-body="${cKey}">`;
                vols.forEach(v=>{
                    const vKey = 'v:'+c.name+'|'+v.vol;
                    const vopen = OPEN.has(vKey) || !!kw;
                    html += `<div class="vol-chunk">
                        <div class="vol-chunk-title" data-vkey="${vKey}" style="cursor:pointer">
                            <span style="transition:transform .15s;display:inline-block;font-size:10px;color:#B8860B;width:10px" class="v-caret${vopen?'':''}">${vopen?'▼':'▶'}</span>
                            <span>📚 ${v.vol}</span>
                            <span class="v-char">${v.list.length}部 · ${volChunkChars(v.list)}万字</span>
                        </div>
                        <div class="vol-sutras" data-vbody="${vKey}" style="${vopen?'':'display:none'}">`;
                    v.list.forEach(s=>{
                        const tags = s._other && s._other.length ? s._other.slice(0,1).map(x=>`<span style="font-size:10px;color:#8B4513;background:rgba(139,69,19,.08);border-radius:4px;padding:0 4px;margin-left:3px">${x.replace(/部类$/,'')}</span>`).join('') : '';
                        html += `<a class="sutra-link" href="sutras.html?load=${encodeURIComponent(s.file||s.id)}">
                            <span>${s.title}</span>${tags}
                            <span class="sl-meta">${(s._dytr==='失译'?'':s._dytr)}</span>
                        </a>`;
                    });
                    html += `</div></div>`;
                });
                html += `</div>`;
            });
            if(!shownCount){
                html = `<div class="text-center text-ink/50 py-12">未找到匹配「${kw}」的部类或经典</div>`;
            }
            root.innerHTML = html;
            // 绑定
            root.querySelectorAll('.cat-tree-head').forEach(h=>{
                h.addEventListener('click', e=>{
                    if(e.target.closest('a')) return;
                    const k = h.dataset.key;
                    if(OPEN.has(k)) OPEN.delete(k); else OPEN.add(k);
                    render();
                });
            });
            root.querySelectorAll('.vol-chunk-title').forEach(h=>{
                h.addEventListener('click', ()=>{
                    const k = h.dataset.vkey;
                    if(OPEN.has(k)) OPEN.delete(k); else OPEN.add(k);
                    render();
                });
            });
        }

        document.getElementById('cat-search').addEventListener('input', ()=>{
            clearTimeout(window._t);
            window._t = setTimeout(render, 180);
        });
        document.getElementById('expand-all').onclick = ()=>{
            CATS.forEach(c=>{
                OPEN.add('c:'+c.name);
                c.vols.forEach(v=>OPEN.add('v:'+c.name+'|'+v.vol));
            });
            render();
        };
        document.getElementById('collapse-all').onclick = ()=>{
            OPEN.clear(); render();
        };
        load();
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
