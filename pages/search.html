<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全文检索 - 佛学本体论</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">

    <link rel="stylesheet" href="../css/tailwind-extra.css">
    <link rel="stylesheet" href="../css/custom.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/tailwind-fixes.css">
    <style>
        body { font-family: -apple-system, "Noto Serif SC", "Songti SC", serif; background-color: #F5F0E1; color: #2C1810; }
        .nav-active { background-color: rgba(184,134,11,0.2); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #d4c8b0; border-radius: 3px; }
        .hit { color: #B8860B; font-weight: 700; background: rgba(218,165,32,.15); padding:0 2px; border-radius:3px; }
        .res-item:hover { border-color: #8B4513; background: rgba(139,69,19,.04); }
        .grp-head { display:flex; align-items:center; gap:8px; padding:10px 10px; margin-top:10px; background:linear-gradient(90deg,#fdf8ec,#fff); border:1px solid #e5d9c3; border-radius:10px; cursor:pointer; user-select:none; font-weight:600; color:#5c3317; }
        .grp-head:hover { background:#f5ecd0; }
        .grp-head .g-caret { transition:transform .15s; font-size:10px; color:#B8860B; width:12px; flex-shrink:0; }
        .grp-head.open .g-caret { transform:rotate(90deg); }
        .grp-head .g-name { flex:1; }
        .grp-head .g-cnt { font-weight:400; font-size:12px; color:#8B4513; background:rgba(184,134,11,.12); border-radius:8px; padding:1px 8px; }
        .grp-body { padding:4px 0 4px 14px; border-left:2px solid #e5d9c3; margin-left:10px; }
        .grp-body.collapsed { display:none; }
        .view-seg { display:inline-flex; border:1px solid #e5d9c3; border-radius:8px; overflow:hidden; font-size:13px; }
        .view-seg button { padding:5px 12px; background:#fff; border:0; color:#3E2723; cursor:pointer; font-family:inherit; }
        .view-seg button.active { background:#B8860B; color:#fff; font-weight:600; }
    </style>
</head>
<body class="min-h-screen">
    <nav class="bg-ink text-paper py-4 px-6 flex items-center gap-6 sticky top-0 z-50 flex-wrap">
        <a href="../index.html" class="text-xl font-bold flex items-center gap-2 text-gold"><span>🍃</span> 佛学本体论</a>
        <span class="text-paper/60">|</span>
        <a href="search.html" class="text-paper font-medium nav-active">全文检索</a>
            <a href="dict.html" class="hover:text-yellow-400">佛学词典</a>
        <div class="ml-auto flex gap-4 text-sm text-paper/80 flex-wrap">
            <a href="../index.html" class="hover:text-gold">首页</a>
            <a href="sutras.html" class="hover:text-gold">全藏原典</a>
            <a href="search.html" class="hover:text-gold">全文检索</a>
            <a href="parallel.html" class="hover:text-gold">异译对照</a>
            <a href="graph.html" class="hover:text-gold">义理图谱</a><a href="ontology.html" class="hover:text-gold">本体总纲</a>
            <a href="kepan.html" class="hover:text-gold">科判导航</a>
            <div class="nav-dropdown"><a href="javascript:void(0)" class="hover:text-gold nav-dropdown-toggle" role="button" aria-haspopup="true">佛学知识<span class="nav-caret">▾</span></a><div class="nav-dropdown-menu nav-dropdown-menu--dark"><a href="panjiao.html">宗派判教</a><a href="translation.html">佛典译学</a><a href="timeline.html">译传时间轴</a></div></div>
            <a href="inference.html" class="hover:text-gold">概念推演</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto px-4 py-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-ink mb-2">大藏经全文检索</h1>
            <p class="text-ink/60 text-sm">在 2,400+ 部佛典、约 9,180 万字全文中检索义理词语 · <span id="idx-status" class="text-primary">正在准备索引…</span></p>
        </div>

        <div class="flex gap-2 mb-4">
            <input id="q" type="text" placeholder="输入关键词，如：缘起、佛性、般若、明心见性、一念三千"
                   class="flex-1 border border-primary/25 rounded-lg px-4 py-3 text-lg focus:outline-none focus:ring-2 focus:ring-primary/30">
            <button id="btn" class="bg-primary text-white px-8 rounded-lg hover:bg-primary/90 font-medium">检索</button>
        </div>
        <div class="flex flex-wrap gap-2 mb-4 items-center text-sm" id="hot"></div>
        <div class="flex items-center justify-between flex-wrap gap-3 mb-3">
            <div id="stat" class="text-sm text-ink/70"></div>
            <div class="view-seg" id="view-seg">
                <button data-view="group" class="active">📂 按部类分组</button>
                <button data-view="list">📋 平铺列表</button>
            </div>
        </div>
        <div id="onto-hits" class="mb-4"></div>
        <div id="results" class="space-y-2"></div>
    </div>

    <script>
        // 词级精确索引（约400KB）+ 繁简映射（35KB）先加载；字级索引（约8.8MB）后台加载
        let WORD = null, CHAR = null, H2S = null, ORDER = null, META = new Map();
        let ONTO_LIST = [], ONTO_MAP = new Map();
        const ONTO_TYPE_LABEL = {concept:'义理概念', person:'人物', sutra:'核心经典', sect:'宗派'};
        const ONTO_TYPE_COLOR = {concept:'#1E4D2B', person:'#B8860B', sutra:'#8B2500', sect:'#4A148C'};
        const SUTRA_ABBR = {
            '金刚经':'金刚', '法华经':'莲华', '华严经':'华严', '维摩经':'维摩', '维摩诘经':'维摩',
            '楞伽经':'楞伽', '圆觉经':'圆觉', '地藏经':'地藏', '药师经':'药师', '无量寿经':'无量寿',
            '观无量寿经':'观无量寿', '解深密经':'解深密', '起信论':'起信', '俱舍论':'俱舍',
            '智度论':'智度', '唯识论':'唯识', '大日经':'大日', '坛经':'坛经', '楞严经':'楞严'
        };
        let charReady = false;
        let VIEW = 'group';
        const COLLAPSE = new Set(); // 折叠的部类key
        const TR_CH = {'經':'经','傳':'传','華':'华','論':'论','寶':'宝','積':'积','緣':'缘','淨':'净','禪':'禅','毘':'毗','曇':'昙','觀':'观','彙':'汇','寫':'写','嚴':'严'};
        const CAT_SIMP = {'經集部类':'经集部类','史傳部类':'史传部类','華嚴部类':'华严部类','法華部类':'法华部类','論集部类':'论集部类','寶積部类':'宝积部类','本緣部类':'本缘部类','淨土宗部类':'净土宗部类','禪宗部类':'禅宗部类','毘曇部类':'毗昙部类','中觀部类':'中观部类','事彙部类':'事汇部类','敦煌寫本部类':'敦煌写本部类'};
        const CAT_ORDER = ['阿含部类','本缘部类','般若部类','法华部类','华严部类','宝积部类','涅槃部类','大集部类','经集部类','律部类','毗昙部类','中观部类','瑜伽部类','论集部类','史传部类','事汇部类','密教部类','净土宗部类','禅宗部类','敦煌写本部类'];
        function simpCh(s){ return String(s||'').replace(/[經傳華論寶積緣淨禪毘曇觀彙寫嚴]/g, c => TR_CH[c] || c); }
        function simpCat(c){ return CAT_SIMP[c] || simpCh(c); }
        function primaryCat(s){
            const cs = String(s.category||'未分类').split(/[,，]/).map(x=>simpCat(x.trim())).filter(Boolean);
            if(!cs.length) return '其他部类';
            return cs.find(c=>c!=='敦煌写本部类') || cs[0];
        }
        function catLabel(c){ return c.replace(/部类$/,''); }

        async function boot() {
            const st = document.getElementById('idx-status');
            try {
                const [w, h, m] = await Promise.all([
                    fetch('../sutras/search-word-index.json').then(r => r.json()),
                    fetch('../sutras/hant2simp.json').then(r => r.json()),
                    fetch('../sutras/index-light.json').then(r => r.json())
                ]);
                WORD = w; H2S = h;
                const list = Array.isArray(m) ? m : (m.sutras || []);
                list.forEach(s => META.set(s.id, s));
                st.textContent = '精确检索已就绪';
                st.className = 'text-green-700';
                fetch('../ontology/instances/m2_index.json').then(r => r.json()).then(idx => { buildOnto(idx); }).catch(()=>{});
                fetch('../sutras/search-order.json').then(r => r.json()).then(o => { ORDER = o; });
                fetch('../sutras/search-index.json').then(r => r.json()).then(c => {
                    CHAR = c; charReady = true;
                    if (document.getElementById('idx-status').textContent.indexOf('就绪') >= 0) {
                        document.getElementById('idx-status').textContent += ' · 模糊检索已就绪';
                    }
                });
            } catch (e) {
                st.textContent = '索引加载失败';
                st.className = 'text-red-600';
            }
        }

        function toSimp(s) { return [...s].map(c => (H2S && H2S[c]) ? H2S[c] : c).join(''); }
        function norm(s) { return (s || '').trim(); }

        function renderItem(id){
            const m = META.get(id) || {};
            const title = m.title || id;
            const file = m.file || (id + '.json');
            const cat = primaryCat(m);
            const dyTr = (m.translator||'失译').replace(/譯$/,'').replace(/译$/,'').trim();
            return `<a href="sutras.html?load=${encodeURIComponent(file)}" class="res-item block bg-white border border-paper rounded-lg px-4 py-2.5 transition">
                <div class="flex items-baseline justify-between gap-3">
                    <span class="font-medium text-ink">${title}</span>
                    <span class="text-xs text-ink/45 flex-shrink-0">${(m.word_count||m.chars||0).toLocaleString()}字</span>
                </div>
                <div class="text-xs text-ink/50 mt-0.5">${m.vol||''} · ${catLabel(cat)} · ${dyTr}</div>
            </a>`;
        }

        function buildOnto(idx) {
            ONTO_LIST = []; ONTO_MAP = new Map();
            const push = (arr, type) => (arr || []).forEach(o => ONTO_LIST.push(Object.assign({}, o, {_type: type})));
            push(idx.concepts, 'concept'); push(idx.persons, 'person'); push(idx.sutras, 'sutra'); push(idx.sects, 'sect');
            ONTO_LIST.forEach(o => {
                const keys = new Set();
                const nm = toSimp(o.name || '');
                if (nm) keys.add(nm);
                (o.alias || []).forEach(a => { const s = toSimp(a); if (s && s.length >= 2) keys.add(s); });
                keys.forEach(k => { if (!ONTO_MAP.has(k)) ONTO_MAP.set(k, []); ONTO_MAP.get(k).push(o); });
            });
        }
        function ontoHref(o) {
            if (o._type === 'sutra') {
                const t = o.taisho_id ? String(o.taisho_id).toLowerCase().replace('t0', 't0') : '';
                return t ? 'sutras.html?load=' + encodeURIComponent(t) : 'sutras.html';
            }
            return 'graph.html?view=m2&focus=' + encodeURIComponent(o.id);
        }
        function ontoDesc(o) {
            if (o._type === 'concept') return (o.layer_label || o.layer || '') + (o.primary_sect ? ' · ' + o.primary_sect : '') + (o.definition_short ? ' — ' + o.definition_short : '');
            if (o._type === 'person') return (o.category || '') + (o.era ? ' · ' + o.era : '') + (o.sect ? ' · ' + o.sect : '');
            if (o._type === 'sutra') return (o.category || '') + (o.translator ? ' · ' + o.translator : '');
            if (o._type === 'sect') return (o.founder || '') + (o.found_time ? ' · ' + o.found_time : '');
            return '';
        }
        function renderOntoHits(raw, q) {
            const box = document.getElementById('onto-hits');
            if (!box) return;
            if (!ONTO_LIST.length) { box.innerHTML = ''; return; }
            const seen = new Set(), hits = [];
            const add = o => { if (o && !seen.has(o._type + o.id)) { seen.add(o._type + o.id); hits.push(o); } };
            [raw, q].forEach(k => { if (!k) return; (ONTO_MAP.get(k) || []).forEach(add); });
            if (!hits.length) {
                const kk = q || raw;
                if (kk && kk.length >= 2) {
                    const terms = [kk];
                    if (SUTRA_ABBR[kk]) terms.push(SUTRA_ABBR[kk]);
                    ONTO_LIST.forEach(o => {
                        const nm = toSimp(o.name || '');
                        const core = nm.replace(/(大师|法师|菩萨|尊者|祖师|禅师|三藏|古佛|佛|王|祖)$/g, '');
                        const cands = [nm, core].filter(x => x.length >= 2);
                        if (cands.some(x => terms.some(t => x.includes(t) || t.includes(x)))) add(o);
                    });
                }
            }
            if (!hits.length) { box.innerHTML = ''; return; }
            const order = {concept:0, person:1, sect:2, sutra:3};
            hits.sort((a, b) => (order[a._type] - order[b._type]) || (a.name || '').length - (b.name || '').length);
            const shown = hits.slice(0, 8);
            box.innerHTML = `<div class="text-xs text-ink/50 mb-1.5">🧩 本体条目命中 <b>${hits.length}</b> 条${hits.length > 8 ? '（展示前 8）' : ''}</div>` +
                shown.map(o => {
                    const col = ONTO_TYPE_COLOR[o._type];
                    return `<a href="${ontoHref(o)}" class="res-item block bg-white border border-paper rounded-lg px-4 py-2.5 mb-2 transition" style="border-left:3px solid ${col}">
                        <div class="flex items-baseline justify-between gap-3">
                            <span class="font-medium text-ink">${o.name} <span class="text-xs font-normal" style="color:${col}">· ${ONTO_TYPE_LABEL[o._type]}</span></span>
                            <span class="text-xs text-ink/40 font-mono flex-shrink-0">${o.id}</span>
                        </div>
                        <div class="text-xs text-ink/55 mt-0.5">${ontoDesc(o)}</div>
                    </a>`;
                }).join('');
        }

        function search() {
            const raw = norm(document.getElementById('q').value);
            const q = toSimp(raw);
            const stat = document.getElementById('stat');
            const box = document.getElementById('results');
            if (!q) { stat.textContent = ''; box.innerHTML = ''; document.getElementById('onto-hits').innerHTML = ''; return; }
            renderOntoHits(raw, q);
            if (!WORD) { stat.textContent = '索引尚未就绪，请稍候'; return; }

            let ids = null, mode = '';
            if (WORD[q] && WORD[q].length) { ids = WORD[q]; mode = '词级精确匹配'; }
            else if (WORD[raw] && WORD[raw].length) { ids = WORD[raw]; mode = '词级精确匹配'; }
            else if (charReady || CHAR) {
                const chars = [...new Set([...q])].filter(c => /[\u4e00-\u9fff]/.test(c));
                const cols = chars.map(c => CHAR && CHAR[c]).filter(Boolean);
                if (cols.length) {
                    let set = new Set(cols[0]);
                    for (let i = 1; i < cols.length; i++) { const nx = new Set(); cols[i].forEach(x => { if (set.has(x)) nx.add(x); }); set = nx; }
                    ids = [...set]; mode = '字级模糊匹配（含全部字）';
                }
            }
            if (!ids) {
                stat.innerHTML = `未找到与「<b>${raw}</b>」匹配的经文${charReady ? '' : '（模糊索引加载中…）'}`;
                box.innerHTML = ''; return;
            }
            // 按字数排序
            ids = ids.slice().sort((a, b) => {
                const ma = META.get(ORDER ? ORDER[a] : a) || {}, mb = META.get(ORDER ? ORDER[b] : b) || {};
                return (ma.word_count || ma.chars || 9e9) - (mb.word_count || mb.chars || 9e9);
            });
            const topMeta = ids.slice(0, 300).map(i => META.get(ORDER ? ORDER[i] : i)).filter(Boolean);
            stat.innerHTML = `「<b>${raw}</b>」— ${mode}，命中 <span class="text-primary font-bold">${ids.length}</span> 部经典${ids.length>300?'，仅展示前 300':''}`;

            if(VIEW === 'list'){
                box.innerHTML = topMeta.map(m => renderItem(m.id)).join('');
                return;
            }
            // 按部类分组
            const groups = new Map();
            topMeta.forEach(m=>{
                const c = primaryCat(m);
                if(!groups.has(c)) groups.set(c, []);
                groups.get(c).push(m);
            });
            const orderedCats = [...groups.keys()].sort((a,b)=>{
                const ia=CAT_ORDER.indexOf(a), ib=CAT_ORDER.indexOf(b);
                if(ia>=0&&ib>=0) return ia-ib;
                if(ia>=0) return -1; if(ib>=0) return 1;
                return groups.get(b).length - groups.get(a).length;
            });
            let html = '';
            orderedCats.forEach(c=>{
                const list = groups.get(c);
                const key = 'g:'+c;
                const collapsed = COLLAPSE.has(key);
                html += `<div class="grp-head${collapsed?'':' open'}" data-key="${key}">
                    <span class="g-caret">▶</span>
                    <span class="g-name">${catLabel(c)}部</span>
                    <span class="g-cnt">${list.length} 部</span>
                </div>
                <div class="grp-body${collapsed?' collapsed':''}" data-body="${key}">
                    ${list.map(m=>renderItem(m.id)).join('')}
                </div>`;
            });
            box.innerHTML = html;
            box.querySelectorAll('.grp-head').forEach(h=>{
                h.addEventListener('click', ()=>{
                    const k = h.dataset.key;
                    if(COLLAPSE.has(k)) COLLAPSE.delete(k); else COLLAPSE.add(k);
                    h.classList.toggle('open');
                    box.querySelector(`[data-body="${k}"]`).classList.toggle('collapsed');
                });
            });
        }

        const HOT = ['缘起', '佛性', '般若', '空性', '真如', '涅槃', '菩提心', '明心见性', '一念三千', '法界缘起', '如来藏', '中道'];
        document.getElementById('hot').innerHTML = HOT.map(h => `<button class="hot-btn px-3 py-1 rounded-full bg-white border border-paper hover:border-primary text-ink/70">${h}</button>`).join('');
        document.querySelectorAll('.hot-btn').forEach(b => b.onclick = () => { document.getElementById('q').value = b.textContent; search(); });

        document.getElementById('btn').onclick = search;
        document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') search(); });
        document.querySelectorAll('#view-seg button').forEach(b=>{
            b.addEventListener('click', ()=>{
                VIEW = b.dataset.view;
                document.querySelectorAll('#view-seg button').forEach(x=>x.classList.toggle('active', x===b));
                search();
            });
        });
        boot();
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
