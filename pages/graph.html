    <script>
        /* ========== 通用：跨页数据 ========== */
        const chart = echarts.init(document.getElementById('graphChart'));
        const colorMap = {concept:'#1E4D2B',sutra:'#8B2500',buddha:'#DAA520',bodhisattva:'#DB7093',arhat:'#9370DB',master:'#2F4F4F',scholar:'#20B2AA',folk:'#CD853F',sect:'#4A148C',category:'#5D4037'};
        const nameMap = {concept:'义理概念',sutra:'经典',buddha:'佛',bodhisattva:'菩萨',arhat:'阿罗汉',master:'祖师译师',scholar:'学者',folk:'民间人物',sect:'宗派',category:'部类'};
        let CROSS = null;
        let DICT_LINKS = null;  // ontology_id -> link
        let DICT_TERMS = null;  // word -> entry
        let CUR_VIEW = 'ontology';
        let M2_FOCUS = null;

        async function getCross(){
          if(!CROSS){
            try{
              const r = await fetch('../data/cross-links.json');
              CROSS = await r.json();
              CROSS._sutraIds = new Set();
              if(CROSS.kepan_to_sutra) Object.values(CROSS.kepan_to_sutra).forEach(k=>CROSS._sutraIds.add(k.sutra_id));
              if(CROSS.sutra_to_parallel) Object.keys(CROSS.sutra_to_parallel).forEach(s=>CROSS._sutraIds.add(s));
              // 反向索引
              CROSS._notesByKepan = {}; CROSS._termsByKepan = {};
              if(CROSS.note_to_kepan){
                Object.entries(CROSS.note_to_kepan).forEach(([nid,ks])=>{
                  ks.forEach(k=>{
                    if(!CROSS._notesByKepan[k.kepan_id]) CROSS._notesByKepan[k.kepan_id]=[];
                    const nmeta=(CROSS.note_to_sutras && CROSS.note_to_sutras[nid])||[{}];
                    CROSS._notesByKepan[k.kepan_id].push({note_id:nid,...nmeta[0]});
                  });
                });
              }
              if(CROSS.term_to_kepan){
                Object.entries(CROSS.term_to_kepan).forEach(([t,ks])=>{
                  ks.forEach(k=>{
                    if(!CROSS._termsByKepan[k.kepan_id]) CROSS._termsByKepan[k.kepan_id]=[];
                    CROSS._termsByKepan[k.kepan_id].push(t);
                  });
                });
              }
            }catch(e){ console.warn('cross-links加载失败',e); CROSS={}; }
          }
          return CROSS;
        }

        /* ========== 科判数据（core + shards 按需加载） ========== */
        let KEPAN_INDEX = null;  // 索引 {meta,sutras}
        let KEPAN_CORE = null;   // 古德精判 73 部
        let KEPAN_SHARD_MAP = null;
        let KEPAN_SHARD_CACHE = {};  // {sid0: {...}, sid1: {...}}

        async function getKepanIndex(){
          if(!KEPAN_INDEX){
            try{
              const r = await fetch('../kepan/index.json',{cache:'no-cache'});
              KEPAN_INDEX = await r.json();
            }catch(e){ console.warn('科判索引加载失败',e); KEPAN_INDEX={meta:{},sutras:{}}; }
          }
          return KEPAN_INDEX;
        }
        async function getKepanCore(){
          if(!KEPAN_CORE){
            try{
              const r = await fetch('../kepan/core.json',{cache:'no-cache'});
              KEPAN_CORE = await r.json();
            }catch(e){ console.warn('科判core加载失败',e); KEPAN_CORE={}; }
          }
          return KEPAN_CORE;
        }
        async function getKepanShardMap(){
          if(!KEPAN_SHARD_MAP){
            try{
              const r = await fetch('../kepan/shard-map.json',{cache:'no-cache'});
              KEPAN_SHARD_MAP = await r.json();
            }catch(e){ console.warn('科判shard-map加载失败',e); KEPAN_SHARD_MAP={}; }
          }
          return KEPAN_SHARD_MAP;
        }
        async function loadKepanSutra(sid){
          // 1. 古德精判优先
          const core = await getKepanCore();
          if(core[sid]) return core[sid];
          // 2. 分片加载
          const map = await getKepanShardMap();
          const shardId = map[sid];
          if(shardId===undefined || shardId===null){
            // 回退：可能在 core 里用了别的键；尝试按 id 前缀匹配
            for(const k of Object.keys(core)){
              if(k===sid || k.replace(/^0*/,'')===sid.replace(/^0*/,'')){ return core[k]; }
            }
            return null;
          }
          if(!KEPAN_SHARD_CACHE[shardId]){
            try{
              const r = await fetch(`../kepan/shards/shard-${String(shardId).padStart(3,'0')}.json`,{cache:'no-cache'});
              KEPAN_SHARD_CACHE[shardId] = await r.json();
            }catch(e){ console.warn(`科判分片${shardId}加载失败`,e); KEPAN_SHARD_CACHE[shardId]={}; }
          }
          return KEPAN_SHARD_CACHE[shardId][sid] || null;
        }

        async function getDict(){
          if(!DICT_LINKS || !DICT_TERMS){
            try{
              const [linkR, dictR] = await Promise.all([
                fetch('../ontology/dict-links.json'),
                fetch('../data/buddhist_dict.json')
              ]);
              const ld = await linkR.json();
              const dd = await dictR.json();
              DICT_LINKS = {};
              for(const l of (ld.links||[])){ DICT_LINKS[l.ontology_id] = l; }
              DICT_TERMS = {};
              for(const t of (dd.terms||[])){ DICT_TERMS[t.name] = t; }
            }catch(e){ console.warn('dict加载失败', e); DICT_LINKS={}; DICT_TERMS={}; }
          }
          return {links:DICT_LINKS, terms:DICT_TERMS};
        }

        async function dictCard(oid, name){
          const {links, terms} = await getDict();
          const link = links[oid];
          if(!link) return '';
          let entry = terms[link.dict_word] || terms[name] || null;
          if(!entry){
            // 别名尝试：遍历 terms 找首个包含 name 或等于 dict_word 的
            for(const w of Object.keys(terms)){
              if(w === name || w === link.dict_word){ entry = terms[w]; break; }
            }
          }
          if(!entry){
            return `<div class="mt-2 p-2 bg-amber-50 border border-amber-200 rounded text-xs text-amber-800">📖 词典匹配：<a href="dict.html?q=${encodeURIComponent(link.dict_word||name)}" target="_blank" class="underline">「${link.dict_word||name}」（${link.dict_category||''}）→ 查看完整词条</a></div>`;
          }
          const def = (entry.definition||'').replace(/</g,'&lt;');
          const short = def.length>220 ? def.slice(0,220)+'…' : def;
          const more = def.length>220 ? `<a href="dict.html?q=${encodeURIComponent(entry.name)}" target="_blank" class="underline text-amber-700 ml-1">完整释义→</a>` : '';
          return `<div class="mt-2 p-3 bg-amber-50/70 border border-amber-200 rounded text-sm">
            <div class="text-amber-900 mb-1"><b>📖 佛学大词典 · 「${entry.name}」</b> <span class="text-xs text-amber-700 ml-1">[${entry.category||link.dict_category||''}]</span></div>
            <div class="text-stone-700 leading-relaxed">${short}${more}</div>
          </div>`;
        }

        /* ========== 视图切换 ========== */
        document.querySelectorAll('.view-tab').forEach(t=>{
          t.addEventListener('click',()=>{
            document.querySelectorAll('.view-tab').forEach(x=>x.classList.remove('active'));
            t.classList.add('active');
            CUR_VIEW = t.dataset.view;
            document.getElementById('ontologyControls').classList.toggle('hidden', CUR_VIEW!=='ontology');
            document.getElementById('m2Controls').classList.toggle('hidden', CUR_VIEW!=='m2');
            document.getElementById('kepanControls').classList.toggle('hidden', CUR_VIEW!=='kepan');
            if(CUR_VIEW==='ontology'){
              document.getElementById('graphDesc').textContent = '共收录义理概念、人物、宗派、部类、经典五类节点，支持拖拽缩放，点击节点查看详情；切换到"M2 本体实例"查看完整 221+125+96+8 实例全图';
              renderOntology();
            }else if(CUR_VIEW==='m2'){
              document.getElementById('graphDesc').textContent = 'M2 义理层 ABox 全图：义理概念 / 人物 / 核心经典 / 八宗四类节点，按 1088 条关系连线。左侧筛选控制显示类别；节点可拖拽缩放，点击查看详情。';
              renderM2Graph();
            }else{
              document.getElementById('graphDesc').textContent = '选择一部经典查看其三分科判树形结构（序分→正宗分→流通分）；节点颜色表示层级，悬停/点击节点可查看原文摘要、相关词条与学者解读';
              initKepanSelect();
              renderKepan();
            }
          });
        });

        /* ========== 义理图谱 ========== */
        function renderOntology() {
            const types = Array.from(document.querySelectorAll('.graph-filter:checked')).map(c=>c.dataset.type);
            const nodes = [], nodeMap = {}, links = [];
            ontologyGraphData.nodes.forEach(n=>{
                let include = false, catName, size=20, color='#666';
                if (n.type==='concept' && types.includes('concept')) { include=true; catName='concept'; size = n.layer==='L1'?28:20; color=colorMap.concept; }
                else if (n.type==='person' && types.includes('person')) { include=true; catName = n.class; size = n.class==='buddha'?30:n.class==='bodhisattva'?25:20; color = colorMap[n.class]||'#666'; }
                else if (n.type==='sect' && types.includes('sect')) { include=true; catName='sect'; size=28; color=colorMap.sect; }
                else if (n.type==='category' && types.includes('category')) { include=true; catName='category'; size=25; color=colorMap.category; }
                else if (n.type==='sutra' && types.includes('sutra')) { include=true; catName='sutra'; size=18; color=colorMap.sutra; }
                if (include) {
                    const gid = n.type+'_'+n.id;
                    nodes.push({id:gid, name:n.name, category:catName, symbolSize:size, itemStyle:{color}, data:n});
                    nodeMap[gid] = gid;
                }
            });
            ontologyGraphData.edges.forEach(r=>{
                const s = (r.sourceType||'concept')+'_'+r.source;
                const t = (r.targetType||'concept')+'_'+r.target;
                if (nodeMap[s] && nodeMap[t]) {
                    links.push({source:s, target:t, label:{show:false,formatter:r.label,fontSize:10},lineStyle:{width:1.2,opacity:0.6,curveness:0.1},data:r});
                }
            });
            const cats = Object.keys(colorMap).map(k=>({name:nameMap[k]||k,itemStyle:{color:colorMap[k]}}));
            chart.setOption({tooltip:{formatter:p=>p.dataType==='node'?`<b>${p.name}</b><br/>${p.data.data.definition||p.data.data.core_doctrine||p.data.data.translator||''}`:`<b>${p.data.data?(p.data.data.label||''):''}</b>`},legend:[{data:cats.map(c=>c.name),top:10,type:'scroll'}],series:[{type:'graph',layout:'force',data:nodes,links:links,categories:cats,roam:true,draggable:true,label:{show:true,position:'right',fontSize:11},force:{repulsion:350,edgeLength:[80,160],gravity:0.1},emphasis:{focus:'adjacency',lineStyle:{width:3}}}],animationDurationUpdate:400},true);
        }

        chart.on('click', async p=>{
            if (p.dataType==='node') {
                if (CUR_VIEW==='ontology') {
                    await handleOntoClick(p);
                } else {
                    await handleKepanClick(p);
                }
            }
        });

        async function handleOntoClick(p){
            const d = p.data.data;
            const cross = await getCross();
            const name = p.name;
            const dictLink = `<a href="dict.html?q=${encodeURIComponent(name)}" target="_blank" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;background:#fef3c7;color:#92400e;border:1px solid #fde68a;border-radius:6px;text-decoration:none;font-size:13px;">📖 佛学大词典查「${name}」</a>`;
            const sutraLinks = (cross.term_to_sutras && cross.term_to_sutras[name]) || [];
            let sutraHtml = '';
            if(sutraLinks.length){
              sutraHtml = `<div class="mt-2 text-sm"><div class="text-stone-600 mb-1">📖 <b>经文出处</b>（点击定位经文段落）：</div><div class="flex flex-wrap gap-1">`;
              sutraLinks.slice(0,5).forEach(s=>{
                const anchor=(s.anchor||'').slice(0,10);
                sutraHtml += `<a href="sutras.html?load=${s.sutra_id}#:~:text=${encodeURIComponent(anchor)}" target="_blank" class="px-2 py-1 bg-green-50 text-green-800 border border-green-200 rounded text-xs no-underline">《${s.sutra_title||s.sutra_id}》${s.chapter?'·'+s.chapter:''}</a>`;
              });
              sutraHtml += `</div></div>`;
            }
            const noteLinks = (cross.term_to_notes && cross.term_to_notes[name]) || [];
            let noteHtml = '';
            if(noteLinks.length){
              const seen=new Set();
              const uniq=noteLinks.filter(n=>{const k=n.scholar+'|'+(n.anchor||'');if(seen.has(k))return false;seen.add(k);return true;}).slice(0,4);
              noteHtml = `<div class="mt-2 text-sm"><div class="text-stone-600 mb-1">👤 <b>学者解读</b>：</div><div class="flex flex-wrap gap-1">`;
              uniq.forEach(n=>{
                noteHtml += `<a href="sutras.html?load=${n.sutra_id}#:~:text=${encodeURIComponent((n.anchor||'').slice(0,10))}" target="_blank" class="px-2 py-1 bg-blue-50 text-blue-800 border border-blue-200 rounded text-xs no-underline">${n.scholar||'学者'}《${n.work||''}》</a>`;
              });
              noteHtml += `</div></div>`;
            }
            const kepanLinks = (cross.term_to_kepan && cross.term_to_kepan[name]) || [];
            let kepanHtml = '';
            if(kepanLinks.length){
              kepanHtml = `<div class="mt-2 text-sm"><div class="text-stone-600 mb-1">📐 <b>相关科判</b>：</div><div class="flex flex-wrap gap-1">`;
              kepanLinks.slice(0,4).forEach(k=>{
                kepanHtml += `<a href="kepan.html?sid=${k.sutra_id}&node=${encodeURIComponent(k.kepan_id)}" target="_blank" class="px-2 py-1 bg-amber-50 text-amber-800 border border-amber-200 rounded text-xs no-underline">《${k.sutra_id}》· ${k.title}</a>`;
              });
              kepanHtml += `</div></div>`;
            }
            let sutraDirectHtml = '';
            if(d.type==='sutra' && d.sutra_id){
              const sid = d.sutra_id;
              sutraDirectHtml = `<div class="mt-2 flex flex-wrap gap-2">
                <a href="sutras.html?load=${sid}" target="_blank" class="px-3 py-1 bg-yellow-50 text-yellow-900 border border-yellow-200 rounded text-xs no-underline">📖 打开经文</a>
                <a href="kepan.html?sid=${sid}" target="_blank" class="px-3 py-1 bg-amber-50 text-amber-900 border border-amber-200 rounded text-xs no-underline">📐 本科判</a>`;
              if(cross.sutra_to_parallel && cross.sutra_to_parallel[sid]){
                const g = cross.sutra_to_parallel[sid][0];
                sutraDirectHtml += `<a href="parallel.html?grp=${encodeURIComponent(g.group_name)}" target="_blank" class="px-3 py-1 bg-blue-50 text-blue-900 border border-blue-200 rounded text-xs no-underline">🔄 异译对照</a>`;
              }
              sutraDirectHtml += `</div>`;
            }
            const typeLabel = nameMap[d.class||d.type] || (d.type==='concept'?'义理概念':d.type);
            const dCard = await dictCard(d.id, name);
            document.getElementById('detail').classList.remove('hidden');
            document.getElementById('detail').innerHTML = `<h3 class="font-bold text-lg text-buddha-primary mb-1">${name} <span class="text-xs font-normal text-stone-500 ml-1">[${typeLabel}]</span></h3>
              <div class="text-sm text-stone-700 leading-relaxed mb-2">${d.definition||d.core_doctrine||d.translator||''}</div>
              <div class="flex flex-wrap gap-2">${dictLink}</div>
              ${sutraDirectHtml}
              ${sutraHtml}
              ${kepanHtml}
              ${noteHtml}
              ${dCard}`;
        }

        /* ========== 科判图谱 ========== */
        let KEPAN_SID = null;

        async function initKepanSelect(){
          const sel = document.getElementById('kepanSutraSelect');
          if(sel.options.length>0) return;
          const idx = await getKepanIndex();
          const sutras = idx.sutras || {};
          const entries = Object.entries(sutras).sort((a,b)=>{
            const ta=(a[1].title||a[0]), tb=(b[1].title||b[0]);
            // 古德精判优先置顶，其余按标题拼音排序
            const aa = (a[1].ancient==='true'||a[1].ancient===true)?0:1;
            const bb = (b[1].ancient==='true'||b[1].ancient===true)?0:1;
            if(aa!==bb) return aa-bb;
            return ta.localeCompare(tb,'zh');
          });
          const optGrpAncient = document.createElement('optgroup');
          optGrpAncient.label = `📜 古德精判（${idx.meta?.ancient||73}部）`;
          const optGrpAuto = document.createElement('optgroup');
          optGrpAuto.label = `📐 结构科判（${(idx.meta?.structural||2433) + (idx.meta?.total||2506)-(idx.meta?.ancient||73)-(idx.meta?.structural||2433)}部，全藏）`;
          let ancientCount=0, autoCount=0;
          entries.forEach(([sid,s])=>{
            const opt=document.createElement('option');
            opt.value=sid;
            const ancient = s.ancient==='true'||s.ancient===true;
            const tag = ancient ? '【古德】' : '';
            const juan = s.juan ? `·${s.juan}卷` : '';
            opt.textContent = `${tag}${s.title||sid} (${(s.taisho||sid).toUpperCase()}${juan})`;
            if(ancient){ optGrpAncient.appendChild(opt); ancientCount++; }
            else { optGrpAuto.appendChild(opt); autoCount++; }
          });
          optGrpAncient.label = `📜 古德精判（${ancientCount}部）`;
          optGrpAuto.label = `📐 结构科判（${autoCount}部，全藏）`;
          sel.appendChild(optGrpAncient);
          sel.appendChild(optGrpAuto);
          // 默认选 t0251 心经（古德）
          sel.value = 't0251';
          KEPAN_SID = 't0251';
          sel.addEventListener('change', ()=>{ KEPAN_SID=sel.value; renderKepan(); });
          // 首次渲染
          renderKepan();
        }

        // 选中一部经后异步加载其科判并渲染
        // 递归构建ECharts tree数据
        function buildKepanTree(sid, sutra){
          let nodeCount=0, leafCount=0;
          function walk(item, depth, parentPath){
            nodeCount++;
            const fullPath = parentPath ? parentPath+' → '+item.name : item.name;
            const kepanId = sid+'__'+(item.id||item.name);
            const isRoot = depth===0;
            const isBig = depth<=1;
            const isMid = depth===2;
            let color='#81C784';
            let size=10;
            if(isRoot){ color='#DAA520'; size=36; }
            else if(item.type==='序分'||item.type==='正宗分'||item.type==='流通分'||depth===1){ color='#B8860B'; size=24; }
            else if(isMid){ color='#2E7D32'; size=16; }
            else { color='#81C784'; size=10; leafCount++; }

            const quote = item.content || item.position || item.description || item.summary || '';
            const children = (item.children||[]).map(c=>walk(c, depth+1, fullPath));
            if(children.length===0 && depth>1) leafCount++;
            return {
              name: item.name,
              _sid: sid,
              _sutraTitle: sutra.title,
              _kepanId: kepanId,
              _fullPath: fullPath,
              _quote: quote,
              _depth: depth,
              _type: item.type||(depth===1?'大科':(depth===2?'分科':'细目')),
              _juan: item.juan||'',
              children: children,
              itemStyle: {color: color, borderColor:'#fff', borderWidth: isRoot?2:1},
              symbolSize: size,
              label: {
                position: isRoot ? 'inside' : 'right',
                fontSize: isRoot?15:(isBig?13:(isMid?11:9)),
                fontWeight: isRoot?'bold':(isBig?600:400),
                color: isRoot?'#fff':(item.type==='正宗分'?'#8b4513':'#333')
              }
            };
          }
          const kepanList = sutra.kepan || sutra.children || [];
          const children = kepanList.map(c=>walk(c,1,c.name));
          const root = {
            name: sutra.title||sid,
            _sid: sid,
            _sutraTitle: sutra.title,
            _kepanId: sid+'__root',
            _fullPath: sutra.title,
            _quote: sutra.summary || sutra.description || '',
            _depth: 0,
            _type: 'root',
            children,
            itemStyle:{color:'#DAA520',borderColor:'#fff',borderWidth:2},
            symbolSize:36,
            label:{position:'inside',fontSize:15,fontWeight:'bold',color:'#fff'}
          };
          return {tree:root, nodeCount: nodeCount+1, leafCount};
        }
        function countNodes(node){
          let n=1;
          (node.children||[]).forEach(c=>n+=countNodes(c));
          return n;
        }

        // 选中一部经后异步加载其科判并渲染
        async function renderKepan(){
          const sid = KEPAN_SID;
          if(!sid) return;
          let chart = echarts.getInstanceByDom(document.getElementById('graphChart'));
          if(!chart){ chart = echarts.init(document.getElementById('graphChart')); }
          chart.showLoading({text:'加载中...', color:'#B8860B', textColor:'#8B4513', maskColor:'rgba(255,250,240,0.7)'});
          await getCross();
          const idx = await getKepanIndex();
          const meta = (idx.sutras||{})[sid] || {title: sid};
          const sutraData = await loadKepanSutra(sid);
          chart.hideLoading();
          if(!sutraData){
            document.getElementById('kepanStat').textContent = '暂无科判数据';
            chart.setOption({title:{text:`暂无科判数据：${meta.title||sid}`, left:'center', top:'center', textStyle:{color:'#999', fontSize:14}}, series:[]}, true);
            return;
          }
          const merged = Object.assign({}, meta, sutraData, {title: sutraData.title||meta.title});
          const {tree,nodeCount} = buildKepanTree(sid, merged);
          const bigKe = (merged.kepan||merged.children||[]).length;
          const ancient = meta.ancient==='true'||meta.ancient===true || sutraData.ancient===true;
          const tag = ancient ? '【古德精判】' : '【结构科判】';
          document.getElementById('kepanStat').textContent = `${tag} 共 ${nodeCount} 个科判节点 · ${bigKe} 大科${meta.juan?' · '+meta.juan+'卷':''}`;

          chart.setOption({
            tooltip:{
              trigger:'item',
              formatter: p=>{
                const d=p.data;
                if(!d._fullPath) return d.name;
                let html = `<b style="color:#8b2500;">${d._fullPath}</b>`;
                if(d._quote) html += `<br/><span style="color:#555;font-size:12px;">${String(d._quote).slice(0,100)}${String(d._quote).length>100?'…':''}</span>`;
                if(d._type!=='root') html += `<br/><span style="color:#888;font-size:11px;">层级：${d._type}${d._juan?' · 卷'+d._juan:''}</span>`;
                return html;
              }
            },
            legend:[{show:false}],
            series:[{
              type:'tree',
              data:[tree],
              top:'3%', left:'15%', bottom:'3%', right:'18%',
              symbol:'circle',
              edgeShape:'polyline',
              edgeForkPosition:'63%',
              initialTreeDepth: 3,
              roam:true,
              expandAndCollapse:true,
              lineStyle:{color:'#b8a078',width:1.2,curveness:0.2},
              label:{position:'right',fontSize:11},
              leaves:{label:{fontSize:10,color:'#555'},itemStyle:{color:'#81C784'}},
              emphasis:{focus:'descendant',itemStyle:{shadowBlur:8,shadowColor:'rgba(184,134,11,0.5)'}},
              animationDuration:500,
              animationDurationUpdate:600
            }]
          },true);
          chart.off('click');
          chart.on('click', handleKepanClick);
          // 展示根节点总览
          handleKepanClick({data:tree});
        }

        // 点击科判节点，右侧显示详情
        async function handleKepanClick(p){
          const d = p.data;
          if(!d) return;
          const sid = d._sid;
          const sutraTitle = d._sutraTitle;
          const kepanId = d._kepanId;
          const fullPath = d._fullPath;
          const quote = d._quote;
          const type = d._type;

          // 经文出处（kepan_to_sutra匹配）
          const km = CROSS.kepan_to_sutra && CROSS.kepan_to_sutra[kepanId];
          let quoteHtml = '';
          if(quote){
            quoteHtml = `<div class="bg-amber-50/60 border-l-4 border-amber-500 pl-3 py-2 my-2 text-stone-700 text-sm leading-relaxed">"${quote}"</div>`;
          }
          let actions = `<div class="flex flex-wrap gap-2 mt-2">
              <a href="sutras.html?load=${sid}" target="_blank" class="px-3 py-1 bg-yellow-50 text-yellow-900 border border-yellow-200 rounded text-xs no-underline">📖 打开经文</a>
              <a href="kepan.html?sid=${sid}${type!=='root'?'&node='+encodeURIComponent(kepanId):''}" target="_blank" class="px-3 py-1 bg-amber-50 text-amber-900 border border-amber-200 rounded text-xs no-underline">📐 科判页定位</a>`;
          if(CROSS.sutra_to_parallel && CROSS.sutra_to_parallel[sid]){
            const g=CROSS.sutra_to_parallel[sid][0];
            actions += `<a href="parallel.html?grp=${encodeURIComponent(g.group_name)}" target="_blank" class="px-3 py-1 bg-blue-50 text-blue-900 border border-blue-200 rounded text-xs no-underline">🔄 异译对照</a>`;
          }
          actions += `<a href="dict.html" target="_blank" class="px-3 py-1 bg-orange-50 text-orange-900 border border-orange-200 rounded text-xs no-underline">📚 佛学词典</a></div>`;

          // 相关词条
          let termsHtml = '';
          const terms = (CROSS._termsByKepan && CROSS._termsByKepan[kepanId]) || [];
          if(terms.length){
            termsHtml = `<div class="mt-3 text-sm"><div class="text-stone-600 mb-1">🔗 <b>相关义理词条</b>：</div><div class="flex flex-wrap gap-1">`;
            terms.slice(0,10).forEach(t=>{
              termsHtml += `<a href="dict.html?q=${encodeURIComponent(t)}" target="_blank" class="px-2 py-1 bg-orange-50 text-orange-800 border border-orange-200 rounded text-xs no-underline">${t}</a>`;
            });
            termsHtml += `</div></div>`;
          }

          // 学者解读
          let notesHtml = '';
          const notes = (CROSS._notesByKepan && CROSS._notesByKepan[kepanId]) || [];
          if(notes.length){
            notesHtml = `<div class="mt-2 text-sm"><div class="text-stone-600 mb-1">👤 <b>学者解读</b>：</div><div class="flex flex-wrap gap-1">`;
            notes.slice(0,4).forEach(n=>{
              notesHtml += `<a href="sutras.html?load=${n.sutra_id}#:~:text=${encodeURIComponent((n.anchor||'').slice(0,10))}" target="_blank" class="px-2 py-1 bg-blue-50 text-blue-800 border border-blue-200 rounded text-xs no-underline">${n.scholar||'学者'}${n.work?'《'+n.work+'》':''}</a>`;
            });
            notesHtml += `</div></div>`;
          }

          let rootInfo = '';
          if(type==='root'){
            rootInfo = `<div class="text-sm text-stone-600 mt-2">这是整部《${sutraTitle}》的科判树，根节点向外辐射三大科（序分/正宗分/流通分）。点击任意节点可查看该分科的原文摘要、相关词条与学者解读；滚轮缩放、拖拽平移画布。</div>`;
          }

          document.getElementById('detail').classList.remove('hidden');
          document.getElementById('detail').innerHTML = `
            <h3 class="font-bold text-lg text-buddha-primary mb-1">${fullPath.split(' → ').pop()} <span class="text-xs font-normal text-stone-500 ml-1">[${type==='root'?'《'+sutraTitle+'》·科判根节点':type}]</span></h3>
            ${type!=='root'?`<div class="text-xs text-stone-500">路径：${fullPath}</div>`:''}
            ${quoteHtml}
            ${rootInfo}
            ${actions}
            ${termsHtml}
            ${notesHtml}
          `;
        }

        /* ========== 初始化 ========== */
        document.querySelectorAll('.graph-filter').forEach(c=>c.addEventListener('change',()=>{ if(CUR_VIEW==='ontology') renderOntology(); }));

        /* ========== M2 本体实例图 ========== */
        let M2_CACHE = null;
        async function loadM2Data(){
          if(M2_CACHE) return M2_CACHE;
          const [idx, rels] = await Promise.all([
            fetch('../ontology/instances/m2_index.json',{cache:'no-cache'}).then(r=>r.json()),
            fetch('../ontology/instances/relations.json',{cache:'no-cache'}).then(r=>r.json())
          ]);
          M2_CACHE = {idx, rels: rels.relations};
          return M2_CACHE;
        }
        async function renderM2Graph(){
          const chart = echarts.init(document.getElementById('graphChart'));
          chart.showLoading({text:'加载 M2 实例…'});
          try{
            const {idx, rels} = await loadM2Data();
            const show = {};
            document.querySelectorAll('.m2-filter').forEach(f=>{
              const k = f.dataset.m2;
              show[k] = f.checked;
            });
            const prefix2type = {c:'concept', p:'person', s:'sutra', sec:'sect'};
            const type2color = {concept:'#1E4D2B', person:'#DAA520', sutra:'#8B2500', sect:'#4A148C'};
            const type2name = {concept:'义理概念', person:'人物', sutra:'经典', sect:'宗派'};
            const layerColor = {'L1':'#B71C1C','L2':'#E65100','L3':'#1B5E20'};
            // 节点
            const nodes = [];
            const nodeIdSet = new Set();
            function addNode(id, name, cat, extra){
              if(nodeIdSet.has(id)) return;
              nodeIdSet.add(id);
              let symSize = 14;
              let color = type2color[cat];
              if(cat==='concept'){
                color = layerColor[extra.layer]||type2color.concept;
                symSize = extra.layer==='L1'?28:(extra.layer==='L2'?20:12);
              } else if(cat==='sect'){ symSize = 26; }
              else if(cat==='person'){ symSize = 14; }
              else if(cat==='sutra'){ symSize = 12; }
              nodes.push({
                id, name, category: cat,
                symbolSize: symSize,
                itemStyle:{color},
                tooltip:{formatter:(p)=>`<b>${p.name}</b><br/>${type2name[cat]||''} ${p.data.extra&&p.data.extra.layer?'· '+p.data.extra.layer:''}<br/>${p.data.extra&&p.data.extra.desc?p.data.extra.desc:''}`},
                extra
              });
            }
            if(show.c) idx.concepts.forEach(c=>addNode(c.id,c.name,'concept',{layer:c.layer, desc:c.primary_sect+' · '+(c.definition_short||'')}));
            if(show.p) idx.persons.forEach(p=>addNode(p.id,p.name,'person',{desc:(p.category||'')+(p.era?' · '+p.era:'')}));
            if(show.s) idx.sutras.forEach(s=>addNode(s.id,s.name,'sutra',{desc:(s.category||'')+(s.translator?' · '+s.translator:'')}));
            if(show.sec) idx.sects.forEach(s=>addNode(s.id,s.name,'sect',{desc:(s.founder||'')+' · '+(s.found_time||'')}));
            // 边（只保留两端都在已选节点集的）
            const edges = [];
            const edgeSet = new Set();
            const edgeTypeColor = {
              subdivision:'#1B5E20', based_on:'#4A148C', translated_by:'#8B2500',
              propagates:'#DAA520', transmits_dharma_to:'#DAA520', parallel_translation:'#8B2500',
              founder:'#4A148C', refutes:'#B71C1C', identity:'#666'
            };
            rels.forEach(r=>{
              if(!nodeIdSet.has(r.source)||!nodeIdSet.has(r.target)) return;
              const k = r.source+'=>'+r.target;
              if(edgeSet.has(k)) return;
              edgeSet.add(k);
              edges.push({
                source:r.source, target:r.target,
                lineStyle:{color: edgeTypeColor[r.type]||'#ccc', width: r.type==='subdivision'?1.2:0.8, opacity: r.type==='subdivision'?0.5:0.3},
                label:{show:false},
                _type: r.type
              });
            });
            // 限制边数（点太多时裁剪）
            const MAX_EDGES = 2500;
            const shownEdges = edges.slice(0, MAX_EDGES);
            document.getElementById('m2Stat').textContent = `节点 ${nodes.length} · 关系 ${shownEdges.length}${edges.length>MAX_EDGES?'（截取'+MAX_EDGES+'）':''} · 共 ${rels.length} 条`;
            chart.hideLoading();
            chart.setOption({
              tooltip:{},
              legend:[{data:Object.keys(type2name).filter(t=>show[t.charAt(0)]||show[ t==='concept'?'c':t==='person'?'p':t==='sutra'?'s':'sec']).map(t=>({name:type2name[t],itemStyle:{color:type2color[t]}})), top:10}],
              series:[{
                type:'graph', layout:'force', roam:true, draggable:true,
                data:nodes, links:shownEdges,
                categories: Object.keys(type2name).map(t=>({name:type2name[t],itemStyle:{color:type2color[t]}})),
                force:{repulsion:180, edgeLength:[40,120], gravity:0.08},
                label:{show:true, position:'right', fontSize:10},
                emphasis:{focus:'adjacency', lineStyle:{width:2}},
                lineStyle:{curveness:0.1}
              }]
            }, true);
            if(M2_FOCUS){
              const fi = nodes.findIndex(n=>n.id===M2_FOCUS);
              if(fi>=0){
                try{ chart.dispatchAction({type:'highlight', seriesIndex:0, dataIndex:fi});
                     chart.dispatchAction({type:'showTip', seriesIndex:0, dataIndex:fi}); }catch(_){}
                const nd = nodes[fi];
                (async()=>{
                  const d = document.getElementById('detail');
                  const dCard = await dictCard(nd.id, nd.name);
                  d.classList.remove('hidden');
                  d.innerHTML = `<h3 class="font-bold text-lg text-buddha-primary mb-2">${nd.name} <span class="text-xs text-stone-500 font-mono">${nd.id}</span></h3>
                    <p class="text-sm text-buddha-dark/85 mb-2">${type2name[nd.category]||''} · ${(nd.extra&&nd.extra.desc)||''}</p>
                    <p class="text-xs text-stone-500">类型：${nd.category}${nd.extra&&nd.extra.layer?' · 层：'+nd.extra.layer:''}</p>
                    ${dCard}`;
                })();
              }
              M2_FOCUS = null;
            }
            chart.off('click');
            chart.on('click', async function(p){
              if(p.dataType!=='node') return;
              const d = document.getElementById('detail');
              const dCard = await dictCard(p.data.id, p.name);
              d.classList.remove('hidden');
              d.innerHTML = `<h3 class="font-bold text-lg text-buddha-primary mb-2">${p.name} <span class="text-xs text-stone-500 font-mono">${p.data.id}</span></h3>
                <p class="text-sm text-buddha-dark/85 mb-2">${type2name[p.data.category]||''} · ${(p.data.extra&&p.data.extra.desc)||''}</p>
                <p class="text-xs text-stone-500">类型：${p.data.category}${p.data.extra&&p.data.extra.layer?' · 层：'+p.data.extra.layer:''}</p>
                ${dCard}`;
            });
          }catch(e){
            chart.hideLoading();
            document.getElementById('graphChart').innerHTML = '<p class="p-8 text-red-600">加载失败：'+e.message+'</p>';
          }
        }
        document.querySelectorAll('.m2-filter').forEach(c=>c.addEventListener('change',()=>{ if(CUR_VIEW==='m2') renderM2Graph(); }));
        window.addEventListener('resize',()=>chart.resize());

        // 移动汉堡
        const mbtn=document.getElementById('mobileMenuBtn');
        if(mbtn){ mbtn.addEventListener('click',()=>document.getElementById('mobileMenu').classList.toggle('hidden')); }

        getCross();
        (function(){
          const usp = new URLSearchParams(location.search);
          const hash = (location.hash||'').replace(/^#/,'');
          // 支持 ?focus=c001 或 #onto=c001 两种形式
          const hashMatch = hash.match(/onto=([cps]\d+|sec\d+)/);
          const v = usp.get('view');
          if(v==='m2' || hashMatch){
            const f = usp.get('focus') || (hashMatch?hashMatch[1]:null);
            if(f){
              M2_FOCUS = f;
              const pre = f.startsWith('sec')?'sec':f.charAt(0);
              const cb = document.querySelector('.m2-filter[data-m2="'+pre+'"]');
              if(cb) cb.checked = true;
            }
            const tab = document.querySelector('.view-tab[data-view="m2"]');
            if(tab) tab.click();
          } else if(v==='kepan'){
            const tab = document.querySelector('.view-tab[data-view="kepan"]');
            if(tab) tab.click();
          } else {
            renderOntology();
          }
        })();
    </script>
