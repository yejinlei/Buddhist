<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>佛经科判导航 - 佛学本体论</title>
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <link rel="stylesheet" href="../css/tailwind.min.css">
    <link rel="stylesheet" href="../css/tailwind-extra.css">
    <link rel="stylesheet" href="../css/custom.css">
    <link rel="stylesheet" href="../css/mobile.css">
    <link rel="stylesheet" href="../css/tailwind-fixes.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .kepan-tree ul { list-style: none; padding-left: 1.25rem; border-left: 2px dashed rgba(139,90,43,0.2); margin-left: 0.5rem; margin-top: 0.25rem; }
        .kepan-tree li { position: relative; padding: 0.15rem 0; }
        .kepan-tree li::before {
            content: ''; position: absolute; left: -1.25rem; top: 0.85rem;
            width: 0.8rem; height: 2px; background: rgba(139,90,43,0.3);
        }
        .node-row { display: flex; align-items: flex-start; gap: 0.4rem; padding: 0.3rem 0.5rem; border-radius: 6px; cursor: pointer; }
        .node-row:hover { background: rgba(212,175,55,0.1); }
        .node-xu  { background: linear-gradient(90deg, rgba(34,139,34,0.08), transparent); border-left: 3px solid #228B22; }
        .node-zheng { background: linear-gradient(90deg, rgba(139,90,43,0.12), transparent); border-left: 3px solid #8B5A2B; }
        .node-liu  { background: linear-gradient(90deg, rgba(30,58,138,0.08), transparent); border-left: 3px solid #1E3A8A; }
        .node-sub  { background: rgba(139,90,43,0.04); }
        .toggle { width: 1.2rem; flex-shrink: 0; text-align: center; color: #8B5A2B; user-select: none; line-height: 1.4; }
        .collapsed > ul { display: none; }
        .collapsed .toggle::before { content: '▶'; font-size: 0.7rem; }
        .expanded .toggle::before { content: '▼'; font-size: 0.7rem; }
        .leaf .toggle::before { content: '·'; color: #bbb; font-size: 0.9rem; }
        .search-hit { background: rgba(212,175,55,0.25); font-weight: bold; }
        .node-meta-row { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; align-items:center; }
        .node-link { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; font-size:11px; border-radius:10px; text-decoration:none; cursor:pointer; }
        .node-link.sutra-go { background:#fef3c7; color:#92400e; border:1px solid #fde68a; }
        .node-link.sutra-go:hover { background:#fde68a; }
        .node-link.term-go { background:#ecfdf5; color:#065f46; border:1px solid #a7f3d0; }
        .node-link.term-go:hover { background:#a7f3d0; }
        .node-link.note-go { background:#eff6ff; color:#1e40af; border:1px solid #bfdbfe; }
        .node-link.note-go:hover { background:#bfdbfe; }
    </style>
</head>
<body class="bg-buddha-paper text-buddha-dark">
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="../index.html" class="text-xl font-bold text-buddha-primary">🏛️ 佛学本体论</a>
            <div class="flex gap-4 text-xs flex-wrap">
                <a href="../index.html" class="hover:text-buddha-secondary">首页</a>
                <a href="sutras.html" class="hover:text-buddha-secondary">全藏原典</a>
                <a href="search.html" class="hover:text-buddha-secondary">全文检索</a>
            <a href="dict.html" class="hover:text-yellow-400">佛学词典</a>
                <a href="parallel.html" class="hover:text-buddha-secondary">异译对照</a>
                <a href="graph.html" class="hover:text-buddha-secondary">义理图谱</a><a href="ontology.html" class="hover:text-buddha-secondary">本体总纲</a>
                <a href="kepan.html" class="text-buddha-primary font-bold">科判导航</a>
                <div class="nav-dropdown"><a href="javascript:void(0)" class="hover:text-buddha-secondary nav-dropdown-toggle" role="button" aria-haspopup="true">佛学知识<span class="nav-caret">▾</span></a><div class="nav-dropdown-menu"><a href="panjiao.html">宗派判教</a><a href="translation.html">佛典译学</a><a href="timeline.html">译传时间轴</a></div></div>
                <a href="inference.html" class="hover:text-buddha-secondary">概念推演</a>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold text-buddha-primary mb-2 font-serif">📚 佛经科判树形导航</h1>
        <p class="text-buddha-dark/70 mb-6">传统佛经三分科判：<span class="text-green-700 font-semibold">序分</span>（缘起）→<span class="text-amber-700 font-semibold">正宗分</span>（核心教义）→<span class="text-blue-800 font-semibold">流通分</span>（结劝流传）。共收录 <span id="cnt" class="text-buddha-primary font-bold">0</span> 部核心经典，点击节点可展开/折叠。</p>

        <div class="grid lg:grid-cols-[320px_1fr] gap-6">
            <div>
                <input id="search" placeholder="🔍 搜索经名 / 内容关键词..." class="w-full mb-3 px-3 py-2 rounded border border-buddha-light/60 bg-white text-sm focus:outline-none focus:border-buddha-primary" />
                <div id="sutraList" class="space-y-1 overflow-y-auto max-h-[70vh] pr-2"></div>
            </div>
            <div>
                <div id="kepanContainer" class="bg-white rounded-lg shadow p-6 min-h-[60vh]">
                    <p class="text-buddha-dark/60">请从左侧选择一部经典查看完整科判结构</p>
                </div>
            </div>
        </div>
    </main>

    <script>
    (function(){
        const list = document.getElementById('sutraList');
        const container = document.getElementById('kepanContainer');
        const search = document.getElementById('search');
        let data = {};
        let CROSS = null;
        let CUR_SID = null;

        async function getCross(){
          if(!CROSS){
            try{
              const r = await fetch('../data/cross-links.json');
              CROSS = await r.json();
              // 反向索引：kepan_id → notes/terms
              CROSS._notesByKepan = {};
              if(CROSS.note_to_kepan){
                Object.entries(CROSS.note_to_kepan).forEach(([nid, ks])=>{
                  ks.forEach(k=>{
                    if(!CROSS._notesByKepan[k.kepan_id]) CROSS._notesByKepan[k.kepan_id]=[];
                    // note_to_sutras 补全信息
                    const nmeta = (CROSS.note_to_sutras && CROSS.note_to_sutras[nid]) || [{}];
                    CROSS._notesByKepan[k.kepan_id].push({note_id:nid, ...nmeta[0]});
                  });
                });
              }
              // 反向索引：kepan_id → terms
              CROSS._termsByKepan = {};
              if(CROSS.term_to_kepan){
                Object.entries(CROSS.term_to_kepan).forEach(([t, ks])=>{
                  ks.forEach(k=>{
                    if(!CROSS._termsByKepan[k.kepan_id]) CROSS._termsByKepan[k.kepan_id]=[];
                    CROSS._termsByKepan[k.kepan_id].push(t);
                  });
                });
              }
            }catch(e){ console.warn('cross-links加载失败', e); CROSS = {}; }
          }
          return CROSS;
        }

        function nodeTypeClass(t) {
            if (t === '序分') return 'node-xu';
            if (t === '正宗分') return 'node-zheng';
            if (t === '流通分') return 'node-liu';
            return 'node-sub';
        }

        function hasChildren(n){ return n.children && n.children.length > 0; }

        function buildNodeMeta(nodeId, content){
            if(!CROSS || !CUR_SID) return '';
            const kid = `${CUR_SID}__${nodeId}`;
            const parts = [];
            // 1) 经文跳转
            const sutraAnchor = content ? content.slice(0, 20) : '';
            if(sutraAnchor){
              parts.push(`<a class="node-link sutra-go" href="sutras.html?load=${CUR_SID}#:~:text=${encodeURIComponent(sutraAnchor)}" target="_blank" title="在经文阅读页定位此段"><i class="fa fa-book"></i> 查经文</a>`);
            }
            // 2) 相关词条（最多3个）
            const terms = (CROSS._termsByKepan && CROSS._termsByKepan[kid]) || [];
            terms.slice(0,3).forEach(t=>{
              parts.push(`<a class="node-link term-go" href="dict.html?q=${encodeURIComponent(t)}" target="_blank" title="在词典中查：${t}"><i class="fa fa-bookmark"></i> ${t}</a>`);
            });
            // 3) 学者观点
            const notes = (CROSS._notesByKepan && CROSS._notesByKepan[kid]) || [];
            if(notes.length){
              parts.push(`<a class="node-link note-go" href="sutras.html?load=${CUR_SID}" target="_blank" title="${notes.length}位学者对此段的解读"><i class="fa fa-user"></i> 学者解读${notes.length>1?'·'+notes.length+'位':''}</a>`);
            }
            return parts.length ? `<div class="node-meta-row">${parts.join('')}</div>` : '';
        }

        function renderNode(n, depth){
            const isLeaf = !hasChildren(n);
            const state = isLeaf ? 'leaf' : (depth < 2 ? 'expanded' : 'collapsed');
            const nid = n.name || '';
            const content = n.content || n.quote || '';
            let html = `<li class="${state}" data-name="${nid.replace(/"/g,'&quot;')}" data-kid="${(CUR_SID+'__'+nid).replace(/"/g,'&quot;')}">`;
            html += `<div class="node-row ${n.type ? nodeTypeClass(n.type) : ''}">`;
            html += `<span class="toggle" onclick="event.stopPropagation(); this.parentElement.parentElement.classList.toggle('collapsed'); this.parentElement.parentElement.classList.toggle('expanded');"></span>`;
            html += `<div class="flex-1">`;
            html += `<div class="font-semibold text-sm" style="color:#3A2E1F">${n.name || ''}</div>`;
            const desc = n.description || n.desc || '';
            if (desc) {
                html += `<div class="text-xs mt-1 leading-relaxed text-buddha-dark/75">${desc.length>300?desc.slice(0,300)+'…':desc}</div>`;
            }
            if (content) {
                const shortC = content.length > 120 ? content.slice(0,120)+'…' : content;
                html += `<div class="text-xs mt-1 leading-relaxed" style="color:#5c3c1a;background:rgba(196,154,108,0.1);padding:4px 8px;border-radius:4px;font-family:serif;">${shortC}</div>`;
            }
            // 插入互链元数据行（科判节点互链）
            html += buildNodeMeta(nid, content);
            if (n.juan) {
                html += `<div class="text-xs text-buddha-dark/50 mt-1">卷${n.juan}${n.position?' · '+n.position:''}</div>`;
            }
            html += `</div></div>`;
            if (hasChildren(n)) {
                html += '<ul>';
                n.children.forEach(c => html += renderNode(c, depth+1));
                html += '</ul>';
            }
            html += '</li>';
            return html;
        }

        async function renderKepan(sutra, targetNodeId, sid){
            CUR_SID = sid || Object.keys(data).find(k => data[k] === sutra) || null;
            let html = `<div class="mb-4 pb-4 border-b border-buddha-light/60">`;
            html += `<h2 class="text-2xl font-bold text-buddha-primary font-serif mb-1">${sutra.title}</h2>`;
            const meta = [];
            if (sutra.taisho) meta.push(`<span class="px-2 py-0.5 bg-buddha-light/50 rounded text-xs">${sutra.taisho}</span>`);
            if (sutra.translator) meta.push(`<span class="text-sm text-buddha-dark/80">译者：${sutra.translator}</span>`);
            if (sutra.juan) meta.push(`<span class="text-sm">${sutra.juan}卷</span>`);
            // 增加：打开经文 按钮
            if(CUR_SID) meta.push(`<a href="sutras.html?load=${CUR_SID}" target="_blank" class="text-sm text-amber-700 hover:underline"><i class="fa fa-book"></i> 打开经文阅读</a>`);
            // 增加：异译对照 按钮
            if(CROSS && CROSS.sutra_to_parallel && CROSS.sutra_to_parallel[CUR_SID]){
              const g = CROSS.sutra_to_parallel[CUR_SID][0];
              meta.push(`<a href="parallel.html?grp=${encodeURIComponent(g.group_name)}" target="_blank" class="text-sm text-blue-700 hover:underline"><i class="fa fa-exchange"></i> 异译对照</a>`);
            }
            if (sutra.description) html += `<p class="text-sm text-buddha-dark/70 mt-2 leading-relaxed">${sutra.description}</p>`;
            html += `<div class="flex flex-wrap items-center gap-3 mt-2">${meta.join('')}</div>`;
            html += `</div><ul class="kepan-tree text-sm" id="kepanRoot">`;
            (sutra.kepan||[]).forEach(n => html += renderNode(n, 0));
            html += '</ul>';
            // 等待跨页数据加载
            await getCross();
            // 如果跨页数据是后加载的，重新渲染一遍以填充互链meta
            if(CROSS && !container.dataset.crossReady){
              container.dataset.crossReady = '1';
              // 重新渲染（因为buildNodeMeta依赖CROSS）
              html = `<div class="mb-4 pb-4 border-b border-buddha-light/60">`;
              html += `<h2 class="text-2xl font-bold text-buddha-primary font-serif mb-1">${sutra.title}</h2>`;
              const meta2 = [];
              if (sutra.taisho) meta2.push(`<span class="px-2 py-0.5 bg-buddha-light/50 rounded text-xs">${sutra.taisho}</span>`);
              if (sutra.translator) meta2.push(`<span class="text-sm text-buddha-dark/80">译者：${sutra.translator}</span>`);
              if (sutra.juan) meta2.push(`<span class="text-sm">${sutra.juan}卷</span>`);
              if(CUR_SID) meta2.push(`<a href="sutras.html?load=${CUR_SID}" target="_blank" class="text-sm text-amber-700 hover:underline"><i class="fa fa-book"></i> 打开经文阅读</a>`);
              if(CROSS.sutra_to_parallel && CROSS.sutra_to_parallel[CUR_SID]){
                const g = CROSS.sutra_to_parallel[CUR_SID][0];
                meta2.push(`<a href="parallel.html?grp=${encodeURIComponent(g.group_name)}" target="_blank" class="text-sm text-blue-700 hover:underline"><i class="fa fa-exchange"></i> 异译对照</a>`);
              }
              if (sutra.description) html += `<p class="text-sm text-buddha-dark/70 mt-2 leading-relaxed">${sutra.description}</p>`;
              html += `<div class="flex flex-wrap items-center gap-3 mt-2">${meta2.join('')}</div>`;
              html += `</div><ul class="kepan-tree text-sm" id="kepanRoot">`;
              (sutra.kepan||[]).forEach(n => html += renderNode(n, 0));
              html += '</ul>';
            }
            container.innerHTML = html;
            // 默认展开
            container.querySelectorAll('.node-row').forEach(row => {
                row.addEventListener('click', e => {
                    if(e.target.closest('a')) return; // 点击链接不展开折叠
                    const li = row.parentElement;
                    if (li.classList.contains('leaf')) return;
                    li.classList.toggle('collapsed');
                    li.classList.toggle('expanded');
                });
            });
            // 定位到目标节点
            if(targetNodeId){
              setTimeout(()=>{
                const tgt = container.querySelector(`[data-kid="${targetNodeId.replace(/"/g,'')}"]`);
                if(tgt){
                  // 展开所有父
                  let p = tgt.parentElement;
                  while(p && p !== container){
                    if(p.classList && p.classList.contains('collapsed')){
                      p.classList.remove('collapsed');
                      p.classList.add('expanded');
                    }
                    p = p.parentElement;
                  }
                  tgt.scrollIntoView({behavior:'smooth', block:'center'});
                  const row = tgt.querySelector('.node-row');
                  if(row){
                    row.style.background = 'rgba(217,119,6,0.2)';
                    setTimeout(()=>{ row.style.background = ''; }, 2000);
                  }
                }
              }, 100);
            }
        }

        // ===== 科判按需加载（索引列表 + 分片） =====
        let shardMap = null;
        const shardCache = {};
        async function ensureShardMap(){
            if (shardMap) return shardMap;
            try{
                const r = await fetch('../kepan/shard-map.json', {cache:'no-cache'});
                shardMap = r.ok ? ((await r.json()).map || {}) : {};
            }catch(e){ shardMap = {}; }
            return shardMap;
        }
        async function loadKepanFor(id){
            await ensureShardMap();
            const sh = shardMap[id];
            if (sh === undefined) return null;
            if (!shardCache[sh]){
                const r = await fetch('../kepan/shards/shard-' + String(sh).padStart(3,'0') + '.json', {cache:'no-cache'});
                if (!r.ok) throw new Error('科判分片加载失败 HTTP ' + r.status);
                shardCache[sh] = await r.json();
            }
            return shardCache[sh][id] || null;
        }

        function buildList(filter){
            list.innerHTML = '';
            const keys = Object.keys(data).sort();
            let count = 0;
            keys.forEach(tid => {
                const s = data[tid];
                const text = ((s.title||'') + ' ' + (s.translator||'') + ' ' + (s.category||'')).toLowerCase();
                if (filter && !text.includes(filter.toLowerCase())) return;
                count++;
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-2.5 rounded hover:bg-buddha-light/50 transition-colors border border-buddha-light/40 text-sm flex flex-col gap-0.5';
                btn.dataset.tid = tid;
                const badge = s.ancient ? '<span style="font-size:10px;color:#8a5a2b;border:1px solid #d8b48a;border-radius:8px;padding:0 5px;margin-left:5px">古德</span>' : '';
                let top = `<span class="font-semibold text-buddha-ink">${s.title}${badge}</span>`;
                let sub = `<span class="text-xs text-buddha-dark/60">${s.taisho||''} · ${s.translator||''} · ${s.juan?s.juan+'卷':''}</span>`;
                btn.innerHTML = top + sub;
                btn.onclick = async () => {
                    list.querySelectorAll('button').forEach(b => b.classList.remove('bg-buddha-secondary/20','border-buddha-secondary'));
                    btn.classList.add('bg-buddha-secondary/20','border-buddha-secondary');
                    container.innerHTML = '<p class="text-sm text-buddha-dark/60 p-6">科判加载中…</p>';
                    try{
                        const full = await loadKepanFor(tid);
                        if (full) await renderKepan(full, null, tid);
                        else container.innerHTML = '<p class="text-sm text-buddha-dark/60 p-6">该经暂无科判数据。</p>';
                    }catch(e){
                        container.innerHTML = '<p class="text-red-600 p-6">科判加载失败：' + e.message + '</p>';
                    }
                };
                list.appendChild(btn);
            });
            document.getElementById('cnt').textContent = count;
            if (count === 0) {
                list.innerHTML = '<p class="text-sm text-buddha-dark/60 p-3">没有匹配的经典</p>';
            }
        }

        let searchTimer;
        search.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(()=>buildList(search.value.trim()), 150);
        });

        fetch('../kepan/index.json', {cache:'no-cache'}).then(r=>r.json()).then(async d => {
            data = d.sutras || d;
            buildList('');
            await getCross();
            const p = new URLSearchParams(location.search);
            const targetSid = p.get('sid');
            const targetNode = p.get('node');
            let tid = (targetSid && data[targetSid]) ? targetSid : Object.keys(data).sort()[0];
            const btn = list.querySelector(`button[data-tid="${tid}"]`);
            if (btn) btn.classList.add('bg-buddha-secondary/20','border-buddha-secondary');
            try{
                const full = await loadKepanFor(tid);
                if (full) await renderKepan(full, targetNode, tid);
                else container.innerHTML = '<p class="text-sm text-buddha-dark/60 p-6">该经暂无科判数据。</p>';
            }catch(e){
                container.innerHTML = '<p class="text-red-600 p-6">科判加载失败：' + e.message + '</p>';
            }
        }).catch(e => {
            container.innerHTML = '<p class="text-red-600">科判数据加载失败：' + e.message + '</p>';
        });
    })();
    </script>
    <script src="../js/mobile-nav.js"></script>
</body>
</html>
