<h1>t2915 《救諸眾生一切苦難經》</h1>
<div class="meta"></div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">天台山中有一老師。年可九□□□□□□□神悲哭眼中泣血唱言。苦□□□□□□□弟子惠通合掌頂禮。眼中泣淚□□□□□災難如何得免。師報言惠通。□□□□□□眾生亡沒普念彌勒□□□□□□□已比相相魏之地。</div></details>
<hr id="seg1"><details><summary>查看原文</summary><div class="original">正在其中愚□□□□□□□三月四月鬼兵亂起無邊無際。八月九月□□□末劫眾生行善鬼兵自滅。天地黑闇得免□寫一本免一門。寫兩本免六親。寫三本免一村。流傳者是弟子。謗此經者。入阿鼻地獄無有出期。</div></details>
<hr id="seg2"><details><summary>查看原文</summary><div class="original">見此經不寫者滅門。至心讀誦者得成佛道。
黑風西北起東南興鬼兵永常天地闇何得心□□先須斷酒肉貪嗔更莫生人能慎此事佛道一時□</div></details>
