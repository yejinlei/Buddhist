<h1>t2889 《續命經》</h1>
<div class="meta"></div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">南無大慈大悲救苦觀世音。唯願聖手摩我頂。救護娑婆世界重罪者。安著涅槃解脫地。每供養諸佛。度一切如影隨形。願恒受持得不捨離。西方阿彌陀佛觀世音菩薩得大勢至菩薩有能。誦此一佛二菩薩名者。</div></details>
<hr id="seg1"><details><summary>查看原文</summary><div class="original">離生死苦永不入地獄。恒值善諸識。有疑有難者。誦此經一千遍即得解脫。一願三寶恒存立二願風雨順時行　三願國王壽萬歲　四願邊地無刀丘　五願三塗離苦難　六願百病盡消除　七願眾生行慈孝　八願屠人莫殺生　九願牢囚所得脫　十願法界普安寧　眼願莫見刀光刃　耳願不聞怨殃聲口願不用為心語　手願不殺一眾生　總願當來值彌勒　連辟相將入化城。</div></details>
