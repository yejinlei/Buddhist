<h1>t1316 《佛說甘露經陀羅尼呪》</h1>
<div class="meta">唐 實叉難陀譯</div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">南無素嚕皤耶（一）　怛他揭多（去聲呼之）耶（二）　怛姪他（三）　唵（四）　素嚕素嚕（五）　皤囉素嚕（六）　皤羅素嚕（七）　莎呵（八）
右取水一掬，呪之七遍，散於空中。其水一渧變成十斛甘露，一切餓鬼並得飲之，無有乏少，皆悉飽滿。</div></details>
