<h1>t2852 《入布薩堂說偈文等》</h1>
<div class="meta"></div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">持戒清淨如滿月身口皎潔無瑕穢清淨和合無違諍爾乃可得同布薩
八功德水淨諸塵灌掌去垢心無染奉持禁戒無缺犯一切眾生悉如是
羅漢聖僧集凡夫眾和合香湯浴淨布薩度眾生
香水勳沐澡諸垢法身具足五分充般若圓照解脫滿群生同會法界融</div></details>
<hr id="seg1"><details><summary>查看原文</summary><div class="original">戒香定香解脫香光明雲臺遍世界供養十方無量佛見聞普勳證寂滅
金剛無礙解脫籌難□□□□□菓我今歡喜頂戴受一切眾生悉如是
具足清淨受此籌具足清淨還此籌堅持禁戒無缺犯一切眾生悉如是
清淨如滿月清淨應布薩身口業清淨爾乃同布薩
諸佛出世第一快聞法奉行歡喜快大眾和合寂滅快眾生離苦安樂快</div></details>
