<h1>t2917b 《新菩萨经》</h1>
<div class="meta">（敦煌写本）</div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">率□□□□□□□大小念百萬口。阿彌陀佛五百身中不入□□菩薩說今󱭚八𠥱九𠥱太山崩須九萬億□亦須九千億牛。第一患死。第二卒死。第三產坐死。第四不持齋死。第五腸肚熱死。第六自絞死。今󱭚禾荳熟恐無𤯔無收度。今󱭚即好信者寫一通免身。寫二通免合家。寫三通免一村。若聞不寫即滅門。若有轉讀此經者。皆度苦難。不信即身滅。經從西涼州縣來。在彼城東門口。四𠥱雷鳴雨下一石如斗。破兩片遂見此經。轉示眾生得福無量。</div></details>
<hr id="seg1"><details><summary>查看原文</summary><div class="original">長安四󱭚五𠥱十五日</div></details>
