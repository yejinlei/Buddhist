<h1>t0706 《佛說五大施經》</h1>
<div class="meta">宋 施護等譯</div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">西天譯經三藏朝奉大夫試光祿卿傳法大師賜紫沙門臣施護等奉　詔譯
佛、世尊一時在舍衛國祇樹給孤獨園，與苾芻眾俱。
佛告諸苾芻言：「有五種大施，今為汝說。何等為五？所謂：一、不殺生，是為大施；</div></details>
<hr id="seg1"><details><summary>查看原文</summary><div class="original">二、不偷盜；三、不邪染；四、不妄語；五、不飲酒。是為大施。
「以何義故，持不殺行而名大施？謂不殺故，能與無量有情施其無畏。以無畏故，無怨、無憎、無害。由彼無量有情得無畏已，無怨憎害已，乃於天上、人間得安隱樂。</div></details>
<hr id="seg2"><details><summary>查看原文</summary><div class="original">是故不殺名為大施。不偷盜、不邪染、不妄語、不飲酒，亦復如是。」</div></details>
