# =====================================================================
# 佛学本体论 · 权威主档 (Master Ontology / TBox)
# ---------------------------------------------------------------------
# 版本 : 3.0.0 (融合版)
# 结构 : 四轴（顶层分类骨架）× 七层（抽象层级）—— 正交融合
#
#   四轴（axis，回答"从哪个维度看"）：
#     Axis1 横向分类轴  —— 三藏 / 部类 / 乘 / 显密 / 宗派 / 判教 / 版本
#     Axis2 纵向内容轴  —— Doctrine → Text → Kepan → Chapter → Section → Gatha/Mantra
#     Axis3 人物传承轴  —— 佛 / 菩萨 / 声闻 / 护法 / 祖师 / 学者
#     Axis4 事件缘起轴  —— 法会 / 本事本生 / 译经传法 / 结集
#
#   七层（layer，回答"抽象到哪一层"）：
#     L0 元模型 / L1 教理本体 / L2 义理范畴 / L3 宗派体系 /
#     L4 文本载体 / L5 人物传承 / L6 信仰文化外延
#
# 融合规则：
#   1. 四轴作为顶层分类骨架，所有类归属于某一轴；
#   2. 七层作为抽象层级，每个类同时标记其所属层；
#   3. 轴与层正交：同一轴内可跨层（如文本轴含 L4 的 Text/Chapter 和 L1 的教义概念），
#      同一层内可跨轴（如 L4 同时含分类轴的 CanonCategory 与内容轴的 Text/Kepan）；
#   4. 关系谓词 id 统一 snake_case（兼容已落地的 expanded 与 instances），
#      A 稿的 camelCase 写法进 aliases 以兼容旧数据；
#   5. 命名空间以公网地址为准，原方案 doubao 命名空间作为 source_namespace 登记。
#
# 源版本记录：
#   source_v1 : 2026-10-27 仓库初始七层稿（data/ontology-schema.json v1.0.0，7 层 31 类）
#   source_v2 : 2026-10-29 用户上传《佛经三藏体系本体构建方案》v1.0（四轴 / camelCase /
#               命名空间 https://ontology.doubao/buddhist-canon#），含 M1–M5 落地流程
#               与 6 项质量校验；其配套正式形式化文件 buddhist_canon_ontology.yaml 未随包提供，
#               本主档按方案正文 §3–§8 落实其全部类、属性、关系设计。
#   source_v3 : 2026-10-29 v2.0.0 七层主档（ontology/ontology.yaml，31 类 21 属性 37 关系）。
#
# 红线 : 经文正文一字不改；2506 部实例不整体重写（实例 id 保留 t#### / c### / p###）。
# =====================================================================

meta:
  name: 佛学本体论
  english_name: Buddhist Ontology
  version: "3.0.0"
  structure: "四轴 × 七层"
  namespace: "https://yejinlei.github.io/Buddhist/ontology#"
  prefix: bc
  source_namespace: "https://ontology.doubao/buddhist-canon#"
  source_version: "佛经三藏体系本体构建方案 v1.0（四轴骨架）+ 仓库初始七层稿（L0–L6 层级）"
  basis: "大正新修大藏经（CBETA）"
  license: MIT
  description: >-
    融合四轴骨架（分类 / 内容 / 人物 / 事件）与七层抽象层级（L0–L6）的佛学知识本体，
    统一描述三藏分类、义理概念、宗派判教、典籍结构（科判→品→段→偈/咒）、人物传承、
    法会事件、译经版本与文化外延，并把全藏 2506 部经文挂接为文本层实例。
  id_convention:
    concept: "c###  （对应 data/concepts-expanded.json）"
    person: "p###  （对应 data/persons-expanded.json）"
    school: "sec###"
    sutra_meta: "s###  （对应 data/sutras-expanded.json，义理层元数据）"
    text_instance: "t#### （对应 ontology/instances 文本实例，CBETA 大正藏经号）"
    event: "e###"
  process:
    # 来自 A 稿 §8 落地流程
    phases:
      - "M1 骨架定版（本主档）"
      - "M2 义理层实例填充（concepts/persons/sects/relations）"
      - "M3 全量文本实例挂接（ontology/instances 2506 部，已完成）"
      - "M4 事件层实例填充（法会/本生/译经/结集）"
      - "M5 应用层（图谱/检索/RAG 问答）"
    quality_checks:
      - 引文逐句回原典核对
      - 类层级无环、关系对称/逆元一致
      - 实例 id 唯一、无悬空引用
      - 偈/咒/人物/佛理标引可回原典定位
      - 异译组经号与大正藏目录一致
      - 判教体系与宗派依经有据

# =====================================================================
# 四轴（顶层分类骨架）
# =====================================================================
axes:
  - id: A1
    key: classification
    name: 横向分类轴
    description: "三藏 → 部类 → 乘 → 显密 → 宗派 → 判教 → 版本。回答这部经属于哪一类。"
  - id: A2
    key: content
    name: 纵向内容轴
    description: "教理 → 典籍 → 科判 → 品章 → 段落 → 偈/咒。回答在讲什么、结构怎样。"
  - id: A3
    key: person
    name: 人物传承轴
    description: "佛 → 菩萨 → 声闻 → 护法 → 祖师 → 学者。回答谁在讲、谁传承。"
  - id: A4
    key: event
    name: 事件缘起轴
    description: "法会 → 本事本生 → 译经传法 → 结集。回答在何时何地何缘何会讲。"

# =====================================================================
# 七层（抽象层级）—— 与四轴正交
# =====================================================================
layers:
  - { id: L0, key: metamodel,          name: 元模型层,       description: "描述本体所用的元语言：轴、层、类、属性、关系、实例。" }
  - { id: L1, key: doctrine_core,      name: 教理本体层,     description: "佛学最顶层的形而上学核心概念（真如、佛性、空性、法身…）。" }
  - { id: L2, key: doctrine_category,  name: 义理范畴层,     description: "佛学核心修行与分析框架（五蕴、十二缘起、四圣谛、二谛…）。" }
  - { id: L3, key: school_system,      name: 宗派体系层,     description: "各宗派及其判教体系，以及法门、乘、显密等教法分类。" }
  - { id: L4, key: text,               name: 文本载体层,     description: "三藏典籍、部类、科判结构（科判→品→段→偈/咒）、版本与异译。" }
  - { id: L5, key: person_lineage,     name: 人物传承层,     description: "佛、菩萨、阿罗汉、护法诸天、历代祖师、译经师、学者。" }
  - { id: L6, key: cultural_extension, name: 信仰文化外延层, description: "民间信仰人物、文化艺术外延元素。" }

# =====================================================================
# 类定义 (TBox Class Hierarchy) —— 同时标注 axis 与 layer
# =====================================================================
classes:
  # ---------------- L0 元模型层（跨四轴） ----------------
  - id: bc:Entity
    axis: [A1, A2, A3, A4]
    layer: L0
    label: 本体元素
    description: "本体中一切元素的根类。"
    subclasses:
      - { id: bc:Axis,            label: 轴,       description: "顶层分类维度，共四轴。" }
      - { id: bc:Layer,           label: 层,       description: "抽象层级，共七层。" }
      - { id: bc:OntologyClass,   label: 类,       description: "对同类实例的抽象，如 Sutra、Person、Event。" }
      - { id: bc:DatatypeProperty,label: 数据属性, description: "描述实例的字面量属性，如 name、taisho_id。" }
      - { id: bc:ObjectProperty,  label: 关系谓词, description: "连接两个实例的关系，如 expounds、translation_of。" }
      - { id: bc:Individual,      label: 个体,     description: "类的具体实例，如 T0235、释迦牟尼佛、灵山法会。" }

  # ---------------- L1 教理本体层（内容轴 A2） ----------------
  - id: bc:Concept
    axis: [A2]
    layer: L1
    label: 教理核心概念
    description: "佛学最顶层的形而上学核心概念族，为义理分析的原子。"
    examples: [法界, 真如, 佛性, 空性, 如来藏, 涅槃, 心, 阿赖耶识, 法身, 自性, 实相, 一真法界, 二谛, 三身, 一佛乘, 顿悟, 三性]

  # ---------------- L2 义理范畴层（内容轴 A2） ----------------
  - id: bc:Doctrine
    axis: [A2]
    layer: L2
    label: 义理范畴
    description: "佛学核心修行与分析框架，由多个教理概念组合而成。"
    examples: [五蕴, 十二处, 十八界, 十二缘起, 四圣谛, 八正道, 三法印, 六度, 三学, 三十七道品]

  # ---------------- L3 宗派体系层（分类轴 A1，部分跨 A2 内容轴） ----------------
  - id: bc:School
    axis: [A1]
    layer: L3
    label: 佛教宗派
    aliases: [sect, 宗派]
    description: "汉传、藏传、南传各宗派。"
    examples: [三论宗, 唯识宗, 天台宗, 华严宗, 禅宗, 净土宗, 律宗, 密宗]
  - id: bc:PanjiaoSystem
    axis: [A1]
    layer: L3
    label: 判教体系
    description: "各宗派对佛陀一代教法的分类与判摄体系。"
    examples: [天台五时八教, 华严五教十宗, 法相三时教, 净土二教]
  # A 稿有、B 稿缺：法门 / 乘 / 显密
  - id: bc:Practice
    axis: [A1, A2]
    layer: L3
    label: 法门
    description: "具体修行法门，由宗派依经典而立。"
    examples: [念佛, 持咒, 禅观, 止观, 忏悔, 礼佛, 读诵, 持戒]
  - id: bc:Vehicle
    axis: [A1]
    layer: L3
    label: 乘
    description: "教法的乘别分类。"
    examples: [声闻乘, 缘觉乘, 菩萨乘, 一乘, 三乘, 五乘]
  - id: bc:Mode
    axis: [A1]
    layer: L3
    label: 显密
    description: "显教 / 密教两类教法模式。"
    examples: [显教, 密教, 显密圆融]

  # ---------------- L4 文本载体层（分类轴 A1 + 内容轴 A2） ----------------
  # —— A 稿有、B 稿以 Sutra/Vinaya/Sastra 替代：三藏根类 ThreeBaskets
  - id: bc:ThreeBaskets
    axis: [A1]
    layer: L4
    label: 三藏
    description: "经律论三藏分类根类。"
    subclasses:
      - { id: bc:SutraPitaka, label: 经藏, description: "佛所说或所印可的经典。" }
      - { id: bc:VinayaPitaka, label: 律藏, description: "僧团戒律典籍。" }
      - { id: bc:AbhidharmaPitaka, label: 论藏, description: "菩萨、论师所造论典。" }
  # A 稿有、B 稿缺：十二分教（文体分类 Genre）
  - id: bc:Genre
    axis: [A1]
    layer: L4
    label: 十二分教
    description: "经典文体分类。"
    examples: [契经, 祇夜, 记别, 伽陀, 优陀那, 尼陀那, 阿波陀那, 伊帝目多伽, 阇多伽, 毗富罗, 阿浮多达摩, 优波提舍]
  # 典籍总类 Text，按三藏分 Sutra/Vinaya/Sastra；含注疏、译本子类
  - id: bc:Text
    axis: [A2]
    layer: L4
    label: 典籍
    description: "佛教文献的总类；按三藏归属 Sutra/Vinaya/Sastra 三个子类。"
    subclasses:
      - { id: bc:Sutra,       label: 经,   description: "经藏典籍，对应 SutraPitaka。" }
      - { id: bc:Vinaya,      label: 律,   description: "律藏典籍，对应 VinayaPitaka。" }
      - { id: bc:Sastra,      label: 论,   description: "论藏典籍，对应 AbhidharmaPitaka。" }
      - { id: bc:Commentary,  label: 注疏, description: "历代祖师对经论的注释。" }
      - { id: bc:Translation, label: 译本, description: "同一部经的不同译本。" }
  - id: bc:CanonCategory
    axis: [A1]
    layer: L4
    label: 部类
    description: "大正藏典籍的部类划分（阿含 / 般若 / 法华 / 华严 …）。"
    examples: [阿含部, 般若部, 法华部, 华严部, 宝积部, 涅槃部, 大集部, 经集部, 密教部, 律部, 论部, 禅宗部, 净土部, 史传部, 目录部, 事汇部, 外教部, 疑似部]
  # A 稿有、B 稿缺：Division（分部，介于三藏与部类之间）
  - id: bc:Division
    axis: [A1]
    layer: L4
    label: 分部
    description: "大正藏内部分部（如阿含部含长/中/杂/增一阿含），介于三藏与部类之间。"
    examples: [长阿含分部, 中阿含分部, 杂阿含分部, 增一阿含分部, 般若分部, 华严分部]
  # —— 文本结构（科判模型）——
  - id: bc:Kepan
    axis: [A2]
    layer: L4
    label: 科判
    description: "一部经的三分结构（序分 / 正宗分 / 流通分）。"
    subclasses:
      - { id: bc:IntroductoryPart, label: 序分,   description: "证信序与发起序，明说法时处因缘。" }
      - { id: bc:EssentialPart,    label: 正宗分, description: "一经正所诠之法门。" }
      - { id: bc:CirculationPart,  label: 流通分, description: "付嘱流通，令法久住。" }
  - id: bc:Chapter
    axis: [A2]
    layer: L4
    label: 品章
    description: "经中的品或卷级单位。"
  - id: bc:Section
    axis: [A2]
    layer: L4
    label: 段落
    description: "科判下的基本段落单位。"
  - id: bc:Gatha
    axis: [A2]
    layer: L4
    label: 偈颂
    description: "韵文体偈颂，一般紧随「而说偈言 / 说偈言 / 偈曰」等偈头之后。"
  - id: bc:Mantra
    axis: [A2]
    layer: L4
    label: 咒语
    description: "音译真言陀罗尼，多以「莎婆诃（svāhā）」等结尾，前常有「即说咒曰」等导语。"
  # —— A 稿有、B 稿缺：传播 / 存世四条 ——
  - id: bc:Translator
    axis: [A1, A4]
    layer: L4
    label: 译者
    description: "经律论的翻译者；归属人物轴 L5 的 Master，但在文本轴 L4 单独立类以便挂接译事。"
    parent: bc:Master
    examples: [鸠摩罗什, 玄奘, 义净, 真谛, 不空, 施护]
  - id: bc:TranslationEra
    axis: [A1]
    layer: L4
    label: 译时代
    description: "汉译佛经的译经时代分期。"
    examples: [东汉, 三国, 西晋, 东晋, 南北朝, 隋, 唐, 北宋, 南宋, 元, 明, 清]
  - id: bc:SourceLanguage
    axis: [A1]
    layer: L4
    label: 原本语言
    description: "译经所据原本的语言。"
    examples: [梵文, 巴利文, 吐火罗文, 于阗文, 藏文]
  - id: bc:Edition
    axis: [A1]
    layer: L4
    label: 藏经版本
    description: "藏经版本 / 刻本系统。"
    examples: [开宝藏, 崇宁藏, 赵城金藏, 高丽藏, 碛砂藏, 永乐南藏, 永乐北藏, 径山藏, 龙藏, 频伽藏, 大正藏, 卍续藏, CBETA]

  # ---------------- L5 人物传承层（人物轴 A3） ----------------
  - id: bc:Person
    axis: [A3]
    layer: L5
    label: 人物
    description: "与佛教相关的人物总类。"
    subclasses:
      - { id: bc:Buddha,        label: 佛陀,       description: "如释迦牟尼佛、阿弥陀佛、药师佛。" }
      - { id: bc:Bodhisattva,   label: 菩萨,       description: "如文殊、普贤、观音、地藏、弥勒。" }
      - { id: bc:Arhat,         label: 阿罗汉,     description: "声闻乘圣者、十大弟子等。" }
      - { id: bc:Protector,     label: 护法,       description: "天龙八部、护法善神，护持佛法。" }
      - { id: bc:Patriarch,     label: 祖师,       description: "译经师、论师、宗派祖师（含 Translator）。" }
      - { id: bc:ModernScholar, label: 现代学者,   description: "近现代佛学研究学者。" }

  # ---------------- L6 信仰文化外延层（跨 A1/A3） ----------------
  - id: bc:Deity
    axis: [A3]
    layer: L6
    label: 护法诸天
    description: "护法神、天龙八部、诸天；与 L5 Protector 的区别为已民间信仰化。"
  - { id: bc:FolkFigure,       axis: [A3],    layer: L6, label: 民间信仰人物, description: "济公、布袋和尚等民间化佛教人物。" }
  - { id: bc:CulturalElement,  axis: [A1],    layer: L6, label: 文化外延元素, description: "佛教相关的文学、艺术、建筑、民俗元素。" }

  # ---------------- 事件层（事件轴 A4，抽象层级横跨 L3–L5） ----------------
  # A 稿有完整事件轴、B 稿完全缺失
  - id: bc:Event
    axis: [A4]
    layer: L3
    label: 事件
    description: "佛教教法传播与成立过程中的关键事件。"
    subclasses:
      - { id: bc:DharmaAssembly,     label: 法会事件,     description: "佛陀宣说某经法会（时、处、听众），如灵山法会、般若法会。" }
      - { id: bc:StoryEvent,         label: 本事本生事件, description: "经中叙述的过去世本事、本生、因缘、譬喻故事。" }
      - { id: bc:TransmissionEvent,  label: 传法译经事件, description: "祖师传法、译师译经、宗派开创等传译事件。" }
      - { id: bc:Council,            label: 结集事件,     description: "三藏结集（王舍城、毗舍离、华氏城等）。" }

# =====================================================================
# 数据属性 (Datatype Properties)
#  融合后分三组：核心（沿用 B 稿 21 条）+ 文本细分（A 稿 Text/Chapter/Section/Gatha/Mantra 专属）
# =====================================================================
properties:
  # —— 通用核心 ——
  - { id: bc:name,                label: 名称,           domain: all,                          range: xsd:string }
  - { id: bc:alias,               label: 别名,           domain: all,                          range: xsd:string }
  - { id: bc:definition,          label: 定义,           domain: [Concept, Doctrine, Practice],range: xsd:string }
  - { id: bc:sanskrit,            label: 梵文名,         domain: all,                          range: xsd:string }
  - { id: bc:description,         label: 描述,           domain: all,                          range: xsd:string }

  # —— 典籍 Text 专属 ——
  - { id: bc:taisho_id,           label: 大正藏经号,     domain: Text,                         range: xsd:string }
  - { id: bc:volume_count,        label: 卷数,           domain: Text,                         range: xsd:integer }
  - { id: bc:translator,          label: 译者,           domain: Text,                         range: xsd:string }
  - { id: bc:translate_time,      label: 译出时间,       domain: Text,                         range: xsd:string }
  - { id: bc:translate_place,     label: 译出地点,       domain: Text,                         range: xsd:string }
  - { id: bc:source_language,     label: 原典语言,       domain: Text,                         range: SourceLanguage }
  - { id: bc:translation_era,     label: 译经时代,       domain: Text,                         range: TranslationEra }
  - { id: bc:vehicle,             label: 乘,             domain: Text,                         range: Vehicle }
  - { id: bc:mode,                label: 显密,           domain: Text,                         range: Mode }
  - { id: bc:category,            label: 部类,           domain: Text,                         range: CanonCategory }
  - { id: bc:genre,               label: 文体,           domain: Text,                         range: Genre }
  - { id: bc:char_count,          label: 字数,           domain: [Text, Chapter, Section],     range: xsd:integer }
  - { id: bc:core_content,        label: 主要内容,       domain: Text,                         range: xsd:string }
  - { id: bc:core_doctrine,       label: 核心教义,       domain: [Text, School],               range: xsd:string }
  - { id: bc:parallel_versions,   label: 异译版本,       domain: Text,                         range: xsd:string }
  - { id: bc:edition_list,        label: 存世版本,       domain: Text,                         range: xsd:string }
  - { id: bc:keywords,            label: 关键词,         domain: Text,                         range: xsd:string }   # RAG 检索用
  - { id: bc:commentary_count,    label: 注疏数,         domain: Text,                         range: xsd:integer }

  # —— 章节 / 段落 / 偈 / 咒专属 ——
  - { id: bc:chapter_no,          label: 品序号,         domain: Chapter,                      range: xsd:integer }
  - { id: bc:chapter_title,       label: 品题,           domain: Chapter,                      range: xsd:string }
  - { id: bc:section_no,          label: 段序号,         domain: Section,                      range: xsd:integer }
  - { id: bc:part_of_kepan,       label: 所属三分,       domain: [Chapter, Section],           range: Kepan }
  - { id: bc:gatha_meter,         label: 句式,           domain: Gatha,                        range: xsd:string }
  - { id: bc:mantra_siddham,      label: 悉昙/梵字转写,  domain: Mantra,                       range: xsd:string }

  # —— 人物 / 宗派 / 事件 ——
  - { id: bc:founder,             label: 创立者,         domain: School,                       range: Person }
  - { id: bc:found_time,          label: 创立时间,       domain: School,                       range: xsd:string }
  - { id: bc:era,                 label: 时代,           domain: [Person, Event],              range: xsd:string }
  - { id: bc:birth_place,         label: 籍贯/出生地,    domain: Person,                       range: xsd:string }
  - { id: bc:location,            label: 地点,           domain: Event,                        range: xsd:string }
  - { id: bc:audience,            label: 听众/当机众,    domain: DharmaAssembly,               range: xsd:string }
  - { id: bc:event_time,          label: 事件时间,       domain: Event,                        range: xsd:string }
  - { id: bc:sutra_source,        label: 经论出处,       domain: [Concept, Doctrine],          range: xsd:string }
  - { id: bc:sect_interpretation, label: 宗派诠释,       domain: [Concept, Doctrine],          range: xsd:string }
  - { id: bc:modern_interpretation,label: 现代解读,      domain: [Concept, Doctrine],          range: xsd:string }

# =====================================================================
# 关系谓词 (Object Properties)
#  统一 id 为 snake_case；aliases 同时收录：
#    ① A 稿 camelCase（如 partOf / teacherOf / founderOf / basesOn / derivesFrom /
#       translationOf / classifiedIn / hasPanJiao / classifiesAs / author_of 等）
#    ② B 稿早期拼音/同义写法
# =====================================================================
relations:
  分类关系类（A1 横向分类轴）:
    - { id: belongs_to_basket,  label: 属三藏,  aliases: [belongsToBasket],   domain: Text,           range: ThreeBaskets, description: "A 典籍归属于三藏中某一藏。" }
    - { id: part_of,            label: 属于,    aliases: [partOf, shuyu],     inverse: has_part,      domain: [Text, Chapter], range: [Text, CanonCategory, Division, Chapter], description: "部分属于整体或某部类/分部。" }
    - { id: belongs_to_division,label: 属分部,  aliases: [belongsToDivision], domain: CanonCategory,  range: Division,     description: "部类归属于某一分部。" }
    - { id: of_genre,           label: 属文体,  aliases: [ofGenre],           domain: Text,           range: Genre,        description: "典籍属于十二分教中某一文体。" }
    - { id: of_vehicle,         label: 属乘,    aliases: [ofVehicle],         domain: [Text, School, Practice], range: Vehicle, description: "典籍/宗派/法门归属某乘。" }
    - { id: of_mode,            label: 属显密,  aliases: [ofMode],            domain: [Text, School], range: Mode,         description: "典籍/宗派归属显教或密教。" }
    - { id: translation_of,     label: 异译,    aliases: [translationOf, yiyi, same_text_different_translation], symmetric: true, domain: Text, range: Text, description: "A 与 B 为同一部经之异译。" }
    - { id: based_on_edition,   label: 据版本,  aliases: [basedOnEdition],    domain: Text,           range: Edition,      description: "A 经所据底本为某藏经版本。" }
    - { id: translated_in,      label: 译于,    aliases: [translatedIn],      domain: Text,           range: TranslationEra, description: "A 经译于某译经时代。" }
    - { id: from_language,      label: 译自,    aliases: [fromLanguage],      domain: Text,           range: SourceLanguage, description: "A 经译自某种原典语言。" }

  文本结构关系类（A2 纵向内容轴）:
    - { id: expounds,           label: 阐明,    aliases: [chanming],          inverse: origin_from_text, domain: Text, range: [Concept, Doctrine], description: "A 经阐明 B 教理概念。" }
    - { id: has_kepan,          label: 三分,    aliases: [hasKepan],          domain: Text,           range: Kepan,        description: "A 经具序/正宗/流通三分。" }
    - { id: has_chapter,        label: 含章,    aliases: [hasChapter],        domain: [Text, Kepan],  range: Chapter,      description: "包含品/章。" }
    - { id: has_section,        label: 含段,    aliases: [hasSection],        domain: [Chapter, Kepan], range: Section,    description: "包含段落。" }
    - { id: has_gatha,          label: 含偈,    aliases: [hasGatha],          domain: [Chapter, Section], range: Gatha,     description: "包含偈颂。" }
    - { id: has_mantra,         label: 含咒,    aliases: [hasMantra],         domain: [Chapter, Section], range: Mantra,    description: "包含咒语。" }
    - { id: commentary_on,      label: 注疏,    aliases: [commentaryOn],      inverse: commented_by,  domain: Commentary,  range: Text,         description: "A 注疏为 B 之注释。" }
    - { id: quotation,          label: 引用,    aliases: [yinyong, quotes],   inverse: quoted_by,     description: "A 论引用 B 经文句。" }
    - { id: accomplishment,     label: 成就,    aliases: [chengjiu],          domain: Practice,       range: Text,         description: "法门依经典而成就。" }
    - { id: mentions_doctrine,  label: 涉佛理,  aliases: [mentionsDoctrine],  domain: [Section, Gatha, Mantra], range: [Concept, Doctrine], description: "段落/偈/咒中涉及某佛理概念。" }

  宗派判教关系类（A1 / L3）:
    - { id: founding,           label: 创立,    aliases: [chuangli, founderOf, founder_of], inverse: founded_by, domain: Person, range: School, description: "A 创立 B 宗派。" }
    - { id: co_founding,        label: 共同创立,aliases: [cofounderOf],       domain: Person,         range: School,       description: "A 与同道共同开创 B。" }
    - { id: reliance,           label: 依经,    aliases: [yijing, basesOn],   inverse: relied_by,     domain: School,       range: Text,         description: "A 宗派以 B 经为根本依止。" }
    - { id: establishes_practice,label: 立法门, aliases: [establishesPractice],domain: School,        range: Practice,     description: "宗派立某修行法门。" }
    - { id: has_panjiao,        label: 立判教,  aliases: [hasPanJiao],        domain: School,         range: PanjiaoSystem, description: "A 宗派立有 B 判教体系。" }
    - { id: classifies_as,      label: 判为,    aliases: [classifiesAs],      domain: PanjiaoSystem,  range: [Text, Doctrine, Vehicle, Mode], description: "判教体系将某经/教理/乘/显密判属某一教相。" }
    - { id: higher_than,        label: 胜,      aliases: [],                  asymmetric: true,       domain: PanjiaoSystem, range: PanjiaoSystem, description: "判教中的高低层次，如圆教胜于别教。" }
    - { id: panjiao_attribution,label: 判摄,    aliases: [panshe, classifiedIn], domain: [Text, Doctrine], range: PanjiaoSystem, description: "A 被 B 判教体系摄归某位。" }
    - { id: transmission,       label: 传承,    aliases: [chuancheng, succeeds], inverse: received_from, domain: Person, range: Person, description: "A 传承 B 之法脉。" }
    - { id: divergence,         label: 分歧,    aliases: [fenqi],             symmetric: true,        domain: School,       range: School,       description: "A 与 B 宗派在某义理上存在分歧。" }

  人物关系类（A3 人物传承轴）:
    - { id: teacher_student,    label: 师徒,    aliases: [dishi, teacherOf, studentOf], domain: Person, range: Person, description: "A 与 B 为师徒（师→弟）。" }
    - { id: sibling,            label: 兄弟,    aliases: [brotherOf],         symmetric: true,        domain: Person,       range: Person,       description: "A 与 B 为兄弟（如阿难与提婆达多）。" }
    - { id: manifestation,      label: 化现,    aliases: [huaxian],           inverse: manifested_as, description: "A 化现为 B，如观音化现民间人物。" }
    - { id: protection,         label: 护持,    aliases: [huchi, hufa],       domain: [Protector, Deity], range: [Text, School, Doctrine, Practice], description: "A 护持 B 法门/宗派/教理。" }
    - { id: authorship,         label: 著有,    aliases: [zhuyou, authorOf, author_of], inverse: authored_by, domain: Person, range: [Text, Commentary], description: "A 造/著 B 经论或注疏。" }
    - { id: translated_by,      label: 译出,    aliases: [yichu, translatedBy, translated], inverse: translated, domain: Text, range: Translator, description: "A 经为 B 所译出。" }

  义理关系类（A2 / L1–L2）:
    - { id: subsumption,        label: 摄属,    aliases: [sheshu, subsumes],  inverse: subsumed_by,   description: "总法含别法，如五蕴摄属三科。" }
    - { id: correspondence,     label: 相即,    aliases: [xiangji, correspondsTo], symmetric: true, description: "两法相即不二，如烦恼即菩提、生死即涅槃。" }
    - { id: refutation,         label: 对破,    aliases: [duipo, disputes],   symmetric: true,        description: "A 对破 B 之偏执，如中观对破有见与空见。" }
    - { id: precedence,         label: 次第,    aliases: [cidi, precedes],    inverse: succeeds_in_order, description: "修行或义理之先后，如信为行之先。" }
    - { id: interpretation,     label: 诠释,    aliases: [quanshi, interprets], description: "A 诠释 B 之义，如《大智度论》诠释《大般若经》。" }
    - { id: derivation,         label: 衍生,    aliases: [yansheng],          inverse: derived_from,  description: "B 由 A 衍生发展而来。" }
    - { id: opposition,         label: 对立,    aliases: [duili],             symmetric: true,        description: "A 与 B 是两种对立见地。" }
    - { id: synonymy,           label: 同一,    aliases: [tongyi],            symmetric: true,        description: "A 与 B 为同一概念之异名。" }
    - { id: origin_from_text,   label: 出自,    aliases: [chujing, derivesFrom], inverse: expounds, domain: [Concept, Doctrine], range: Text, description: "A 概念出自 B 经。" }
    - { id: textual_evidence,   label: 证明,    aliases: [zhengming],         domain: Text,           range: [Concept, Doctrine], description: "A 经文佐证 B 概念。" }

  事件关系类（A4 事件缘起轴）:
    - { id: speaks_at,          label: 说于,    aliases: [speaksAt],          inverse: spoken_by,     domain: Buddha,       range: DharmaAssembly, description: "A 佛在 B 法会上说法。" }
    - { id: held_at,            label: 处会,    aliases: [heldAt],            domain: DharmaAssembly, range: Text,         description: "法会 B 所说为 A 经。" }
    - { id: in_assembly,        label: 预会,    aliases: [inAssembly],        domain: Person,         range: DharmaAssembly, description: "A 人物为 B 法会之听众 / 当机众。" }
    - { id: tells_of,           label: 述说,    aliases: [tellsOf],           domain: Text,           range: StoryEvent,    description: "A 经中述说 B 本事/本生/因缘故事。" }
    - { id: attends_council,    label: 参与结集,aliases: [attendsCouncil],    domain: Person,         range: Council,       description: "A 参与 B 结集。" }
    - { id: during_event,       label: 发生于,  aliases: [duringEvent],       domain: Event,          range: Event,         description: "子事件发生于母事件期间。" }
    - { id: transmits,          label: 传法,    aliases: [chuanfa],           domain: Person,         range: TransmissionEvent, description: "A 祖师在传法事件 B 中传付法脉。" }

