datasets:
  - path: data/concepts-expanded.json
    entity: Concept / Doctrine
    count: 50
    note: "义理概念与范畴实例，id 前缀 c###（规划 216，待补）。"
  - path: data/persons-expanded.json
    entity: Person（Buddha/Bodhisattva/Arhat/Protector/Patriarch/ModernScholar/Deity/FolkFigure）
    count: 54
    note: "人物实例，id 前缀 p###。"
  - path: data/sects-expanded.json
    entity: School / PanjiaoSystem
    count: 8
    note: "宗派实例，id 前缀 sec###，含判教对照。"
  - path: data/sutras-expanded.json
    entity: Text 元数据
    count: 20
    note: "核心经典义理元数据，id 前缀 s###（规划 86，待补）。"
  - path: data/relations-expanded.json
    entity: ObjectProperty 实例（三元组）
    count: 109
    note: "义理关系三元组（规划 368，待补）。"
  - path: ontology/instances/
    entity: Text 全量实例（含 Kepan/Chapter/Section/Gatha/Mantra）
    count: 2506
    note: "全藏文本本体，分片存储于 shards/（51 片），实例内 figure_id/concept_id 已对齐 p###/c###。"
  - path: ontology/instance-links.json
    entity: 反向索引（concept/person/school/category → 经文落点）
    note: "打通义理本体与文本本体的查询层。"
  - path: ontology/parallel_translations.json
    entity: Text 异译组
    note: "异译分组数据；与 relation:translation_of 对应。"
  - path: js/ontology-graph-data.js
    entity: 图谱页内联节点/边
    note: "义理图谱页（graph.html / inference.html）当前数据源，待并入统一实例。"
  - path: js/ontology-data.js
    entity: Concept/Person/School/Text/Relation 旧版完整数据
    count: "216 概念 / 100 人物 / 984 关系"
    note: "旧版完整数据，当前无页面引用，待并入统一实例后归档。"

# =====================================================================
# 本次融合修订记录 (v3.0.0)
# =====================================================================
fixes:
  - "顶层结构由「纯七层」改为「四轴 × 七层」：四轴（分类/内容/人物/事件）做顶层分类骨架，七层（L0–L6）做抽象层级，两者正交。"
  - "补入 A 稿（用户上传方案）有而 v2.0.0 缺的完整事件轴 Event 及其子类：DharmaAssembly 法会 / StoryEvent 本事本生 / TransmissionEvent 传法译经 / Council 结集，并新增 7 条事件关系谓词（speaks_at / held_at / in_assembly / tells_of / attends_council / during_event / transmits）。"
  - "补入 A 稿的传播存世四分类：Translator 译者 / TranslationEra 译时代 / SourceLanguage 原典语言 / Edition 藏经版本，并补相应数据属性与谓词。"
  - "补入三藏根类 ThreeBaskets（SutraPitaka / VinayaPitaka / AbhidharmaPitaka）、十二分教 Genre、分部 Division、法门 Practice、乘 Vehicle、显密 Mode；Text 下三子类 Sutra/Vinaya/Sastra 与三藏对齐。"
  - "Kepan 补全三分子类 IntroductoryPart 序分 / EssentialPart 正宗分 / CirculationPart 流通分，与「三段式」模型对齐。"
  - "人物类 Protector（护法）、Patriarch（祖师）按 A 稿正名，替换 v2.0.0 中 Master/Deity 命名（保留 aliases 兼容）。"
  - "数据属性由 21 条扩到 45 条：补入 description/source_language/translation_era/vehicle/mode/genre/parallel_versions/edition_list/keywords/commentary_count/chapter_no/chapter_title/section_no/part_of_kepan/gatha_meter/mantra_siddham/location/audience/event_time 等 A 稿细分属性。"
  - "关系谓词由 37 条扩到 50 条，分 6 组重排为 7 组（新增分类关系组、事件关系组）；id 统一 snake_case，A 稿 camelCase（partOf/teacherOf/founderOf/basesOn/derivesFrom/translationOf/classifiedIn/hasPanJiao/classifiesAs/authorOf/translatedBy/same_text_different_translation 等）全部收录 aliases。"
  - "命名空间以公网 https://yejinlei.github.io/Buddhist/ontology# 为准，原方案 doubao 命名空间登记为 source_namespace。"
  - "v2.0.0 中「依据：《佛经三藏体系本体构建方案》（七层框架）」依据标注错误——该方案是四轴而非七层；现更正为 source_v2，并同时记录 v1 七层稿与 v2 四轴稿来源。"
  - "保留 v2.0.0 已修的四项硬伤：TBox/ABox 不再混写；Person 层号归 L5；teacherOf/founderOf/studentOf 重复已合并；删除《心经》属《大般若经》之误举例。"
  - "2506 部文本实例字段（vehicle/mode/belongs_to_school/parallel_translations/canon_ref/kepan/chapters/paragraphs/gathas/mantras/figures/doctrines）与本主档对齐，实例 id（t####/c###/p###）不整体重写。"
