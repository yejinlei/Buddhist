<h1>t1021 《華嚴經心陀羅尼》</h1>
<div class="meta">唐·實叉難陀 譯</div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">唵枳那枳那怛他伽頭踟婆陛珊隱底婆囉底烏陀慕陀迷唵薩陛梯薩嚩（二合）訶</div></details>
<hr id="seg1"><details><summary>查看原文</summary><div class="original">此陀羅尼是普賢如來說，于闐國三藏實叉難陀譯。</div></details>
<hr id="seg2"><details><summary>查看原文</summary><div class="original">別有本經云：若人誦此一遍，準誦龍藏中《華嚴經》上中下三本一遍，何況常持。若能滿十萬遍者，其人敏悟精微，洞徹一切教藏。至於福聚轉障，不可具說。</div></details>
<hr id="seg3"><details><summary>查看原文</summary><div class="original">上元縣高公寺摩訶衍和尚授</div></details>
