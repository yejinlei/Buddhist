<h1>t2884 《大威仪请问》</h1>
<div class="meta">（失译）</div>
<hr id="seg0"><details><summary>查看原文</summary><div class="original">若有善男子、善女人，不將澡豆洗手捉經，及前睡眠、伏地，三百億歲作廁中蟲；</div></details>
<hr id="seg1"><details><summary>查看原文</summary><div class="original">淨手搔癢、對經漫語，八百萬億歲墮黑闇地獄、二億歲生狐兔中；</div></details>
<hr id="seg2"><details><summary>查看原文</summary><div class="original">經前㖒唾、口銜帶，亦同前罪。</div></details>
